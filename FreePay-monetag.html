<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreePay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11890386' data-sdk='show_11890386'></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#11152B; --bgSoft:#161B36; --card:#1B2044; --card2:#20264C;
    --border:rgba(255,255,255,0.07); --text:#F3EFE3; --textMuted:#9098C2; --textDim:#6A7099;
    --gold:#F5B942; --goldDark:#B9822A; --pink:#FF5C8A; --pinkDark:#C23A63;
    --gray:#3A4066; --grayLight:#9AA1C9; --blue:#34B3F1; --blueLight:#7FD4FA; --star:#FFD24C;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family:'Manrope', sans-serif; color:var(--text);
    display:flex; justify-content:center; min-height:100vh;
  }
  button{ font-family:inherit; }
  .tap:active{ transform:scale(0.96); }

  @keyframes popIn{ from{opacity:0; transform:translateY(10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes floatToast{ from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);} }

  #app{
    width:100%; max-width:430px; height:100vh; max-height:900px;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.4);
  }

  /* header */
  header{ padding:16px 16px 10px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-size:20px; font-weight:800; }
  .logo .pay{ color:var(--gold); }
  .chips{ display:flex; gap:6px; }
  .chip{
    display:flex; align-items:center; gap:5px; background:var(--card);
    border:1px solid var(--border); border-radius:999px; padding:5px 10px 5px 9px;
    font-size:13px; font-weight:600;
  }
  .chip span{ font-variant-numeric:tabular-nums; }

  /* ads-watched banner */
  .ads-banner{
    margin:0 16px 8px; padding:9px 12px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--textMuted);
  }
  .ads-banner b{ color:var(--text); font-variant-numeric:tabular-nums; }

  /* body / screens */
  main{ flex:1; overflow-y:auto; padding:6px 16px 16px; }
  .screen-title{ font-size:15px; font-weight:700; }
  .screen-sub{ font-size:12px; color:var(--textMuted); margin-top:2px; }
  .section-label{ font-size:11.5px; color:var(--textDim); margin:16px 0 8px; }

  /* bottom nav */
  nav{
    display:flex; border-top:1px solid var(--border); background:var(--bgSoft);
    padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  }
  .nav-btn{
    position:relative; flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:6px 0; cursor:pointer;
  }
  .nav-btn span{ font-size:11px; color:var(--textDim); font-weight:500; }
  .nav-btn.active span{ color:var(--gold); font-weight:700; }
  .nav-dot{
    position:absolute; top:2px; right:calc(50% - 20px); width:8px; height:8px;
    border-radius:50%; background:var(--star); box-shadow:0 0 0 2px var(--bgSoft);
    animation:popIn .2s ease-out;
  }

  /* flappy dino tab */
  #flappyRoot{
    position:relative; width:100%; max-width:320px; aspect-ratio:9/16; max-height:65vh;
    margin:10px auto 0; border-radius:16px; overflow:hidden; background:#05010f;
    box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }
  #flappyCanvas{
    display:block; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges;
    touch-action:none;
  }
  #flappyHud{
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  }
  #flappyScoreLabel{
    margin-top:14px; display:flex; align-items:center; gap:7px;
    font-size:24px; font-weight:bold; color:#ffe066;
    text-shadow:1px 1px 0 #3a2a6a, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    letter-spacing:1px; opacity:0; transition:opacity .3s; font-family:'Courier New', monospace;
  }
  #flappyScoreLabel span{ font-variant-numeric:tabular-nums; }

  /* ---------- flappy claim overlay ---------- */
  #flappyClaimOverlay{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(5,1,15,0.85); z-index:70; text-align:center; padding:16px; box-sizing:border-box;
    font-family:'Courier New', monospace;
  }
  #flappyClaimOverlay.show{ display:flex; }
  .flappy-claim-title{
    font-size:clamp(15px,4.8vw,20px); color:#ffe066; letter-spacing:2px;
    text-shadow:1px 1px 0 #3a2a6a, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    margin-bottom:8px;
  }
  .flappy-claim-ticket{
    display:flex; align-items:center; gap:8px; font-size:22px; font-weight:800;
    color:var(--gold); margin-bottom:2px;
  }
  .flappy-claim-ticket span{ font-variant-numeric:tabular-nums; }
  .flappy-claim-fly{ position:relative; width:100%; max-width:260px; height:56px; margin:8px 0 16px; overflow:visible; }
  .flappy-claim-fly img{
    position:absolute; width:50px; height:auto; left:50%; top:50%; margin-left:-25px; margin-top:-19px;
    animation: flappyClaimFlyMove 2.6s ease-in-out infinite;
  }
  @keyframes flappyClaimFlyMove{
    0%{   transform:translate(-90px,0px) rotate(-8deg) scaleX(1); }
    24%{  transform:translate(-30px,-14px) rotate(5deg) scaleX(1); }
    50%{  transform:translate(30px,0px) rotate(-8deg) scaleX(1); }
    74%{  transform:translate(80px,-12px) rotate(5deg) scaleX(1); }
    100%{ transform:translate(-90px,0px) rotate(-8deg) scaleX(1); }
  }
  .flappy-ad-btn{
    width:100%; max-width:260px; padding:11px; margin-bottom:10px; border-radius:12px; border:none;
    background:#2ecc71; color:#06301B; font-weight:800; font-size:12.5px; letter-spacing:0.3px; cursor:pointer;
    font-family:'Courier New', monospace;
  }
  .flappy-ad-btn:disabled{ opacity:0.55; }
  .flappy-claim-btn{
    width:100%; max-width:260px; padding:12px; border-radius:12px; border:none;
    background:var(--gold); color:#241A05; font-weight:800; font-size:14px; letter-spacing:1px; cursor:pointer;
    font-family:'Courier New', monospace;
  }
  #flappyOverlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff; background:rgba(5,1,15,0.35); pointer-events:none;
    font-family:'Courier New', monospace;
  }
  #flappyOverlay h1{
    font-size:clamp(16px,6vw,26px); color:#ffe066;
    text-shadow:2px 2px 0 #3a2a6a, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    letter-spacing:2px; margin:0 0 10px; animation:flappyPulse 1.4s infinite ease-in-out;
  }
  #flappyOverlay p{ font-size:clamp(11px,3.4vw,14px); color:#c9c2ff; letter-spacing:1px; margin:6px 0 0; }
  #flappyFinal{ font-size:clamp(14px,4.4vw,18px); color:#fff; margin-bottom:4px; display:none; }
  @keyframes flappyPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }
  #flappyFooter{
    position:absolute; bottom:8px; left:0; width:100%; text-align:center;
    color:#4a3f7a; font-size:10px; letter-spacing:1px; pointer-events:none;
  }

  /* toast */
  #toast{
    position:absolute; top:70px; left:50%; animation:floatToast .2s ease-out;
    background:var(--card2); border:1px solid var(--border); padding:8px 16px;
    border-radius:999px; font-size:13px; white-space:nowrap; z-index:60; display:none;
  }

  /* onboarding tutorial spotlight */
  .tut-mask-panel{
    position:absolute; background:rgba(9,11,25,0.6);
    backdrop-filter:blur(4px) grayscale(1); -webkit-backdrop-filter:blur(4px) grayscale(1);
    z-index:55; pointer-events:auto;
  }
  .tut-highlight-ring{
    position:absolute; z-index:56; border:2px solid var(--gold); border-radius:14px;
    pointer-events:none; animation:tutPulse 1.4s ease-in-out infinite;
  }
  @keyframes tutPulse{
    0%,100%{ box-shadow:0 0 0 4px rgba(245,185,66,0.25), 0 0 14px rgba(245,185,66,0.5); }
    50%{ box-shadow:0 0 0 8px rgba(245,185,66,0.12), 0 0 26px rgba(245,185,66,0.85); }
  }
  .tut-bubble{
    position:absolute; z-index:57; background:var(--card2); border:1px solid var(--border);
    border-radius:14px; padding:9px 14px; font-size:12.5px; font-weight:700; color:var(--text);
    text-align:center; box-shadow:0 6px 20px rgba(0,0,0,0.45); pointer-events:none;
    animation:popIn .25s ease-out;
  }

  /* modal */
  #modalOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.72);
    display:none; align-items:center; justify-content:center; z-index:40;
  }
  #modalBox{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:28px 26px; width:260px; text-align:center; animation:popIn .25s ease-out;
  }
  #modalIcon{ display:flex; justify-content:center; margin-bottom:14px; }
  #modalTitle{ font-size:17px; font-weight:700; margin-bottom:4px; }
  #modalSub{ font-size:13px; color:var(--textMuted); margin-bottom:18px; }
  #modalBtn{
    width:100%; padding:11px; border-radius:12px; border:none;
    background:var(--gold); color:#241A05; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* welcome gift overlay */
  #giftOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.88);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #giftCard{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:30px 24px; width:270px; text-align:center; animation:popIn .3s ease-out;
    position:relative; overflow:visible;
  }
  #giftTitle{ font-size:17px; font-weight:800; margin-bottom:4px; }
  #giftSub{ font-size:13px; color:var(--textMuted); margin-bottom:6px; }
  #giftStage{ position:relative; width:140px; height:140px; margin:14px auto 6px; }
  #giftParticles{ position:absolute; inset:-40px; pointer-events:none; }
  #giftBox{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; animation:giftBounce 1.6s ease-in-out infinite;
  }
  #giftBox.opened{ animation:none; transform:scale(1.12); transition:transform .25s ease-out; }
  #giftBox.opened svg #giftLid{ transform:translateY(-14px) rotate(-8deg); }
  #giftBox svg #giftLid{ transition:transform .3s ease-out; transform-origin:20% 100%; }
  @keyframes giftBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  #giftResult{ font-size:15px; font-weight:700; color:var(--gold); min-height:20px; margin-top:8px; }
  #giftContinueBtn{
    display:none; width:100%; margin-top:16px; padding:11px; border-radius:12px; border:none;
    background:var(--gold); color:#241A05; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* ---------- daily reward overlay ---------- */
  #dailyRewardOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.9);
    display:none; align-items:center; justify-content:center; z-index:51;
  }
  #dailyRewardCard{
    background:linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid rgba(245,185,66,0.35); border-radius:24px;
    padding:28px 24px 24px; width:280px; text-align:center; animation:popIn .32s ease-out;
    position:relative; overflow:visible;
    box-shadow:0 0 0 1px rgba(245,185,66,0.08), 0 18px 50px rgba(0,0,0,0.55);
  }
  #dailyRewardTitle{ font-size:18px; font-weight:800; letter-spacing:.3px; }
  #dailyRewardTitle .pay{ color:var(--gold); }
  #dailyRewardSub{ font-size:13px; color:var(--textMuted); margin-top:4px; margin-bottom:4px; }
  #dailyRewardStage{ position:relative; width:150px; height:150px; margin:16px auto 4px; }
  #dailyRewardParticles{ position:absolute; inset:-40px; width:calc(100% + 80px); height:calc(100% + 80px); pointer-events:none; }
  #dailyRewardBox{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; animation:giftBounce 1.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 16px rgba(245,185,66,0.35));
  }
  #dailyRewardBox.opened{ animation:none; transform:scale(1.12); transition:transform .25s ease-out; }
  #dailyRewardBox.opened svg #dailyRewardLid{ transform:translateY(-14px) rotate(-8deg); }
  #dailyRewardBox svg #dailyRewardLid{ transition:transform .3s ease-out; transform-origin:20% 100%; }
  #dailyRewardGlow{
    position:absolute; inset:8px; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(245,185,66,0.35), transparent 70%);
    animation:dailyGlowPulse 1.8s ease-in-out infinite;
  }
  @keyframes dailyGlowPulse{ 0%,100%{ opacity:.5; transform:scale(0.9);} 50%{ opacity:1; transform:scale(1.08);} }
  #dailyRewardResult{ font-size:17px; font-weight:800; color:var(--gold); min-height:22px; margin-top:6px; }
  #dailyRewardOpenBtn{
    display:block; width:100%; margin-top:16px; padding:13px; border-radius:14px; border:none;
    background:linear-gradient(135deg, var(--gold), var(--goldDark)); color:#241A05;
    font-weight:800; font-size:15px; letter-spacing:.4px; cursor:pointer;
    box-shadow:0 8px 20px rgba(245,185,66,0.35);
  }
  #dailyRewardButtons{ display:none; flex-direction:column; gap:9px; margin-top:16px; }
  #dailyRewardAdBtn{
    width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#2ecc71,#27ae60); color:#06301B;
    font-weight:800; font-size:14.5px; letter-spacing:.3px;
    box-shadow:0 8px 20px rgba(46,204,113,0.35);
  }
  #dailyRewardAdBtn:disabled{ opacity:.55; cursor:default; }
  #dailyRewardAdBtn small{ display:block; font-size:11px; font-weight:600; opacity:.85; margin-top:2px; }
  #dailyRewardClaimBtn{
    width:100%; padding:8px; border:none; background:none; cursor:pointer;
    color:var(--textMuted); font-weight:600; font-size:12.5px;
  }

  /* home screen */
  .home-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:8px; }
  .home-head{ text-align:center; margin-bottom:4px; }
  #wheelBox{ position:relative; width:min(78vw,280px); aspect-ratio:1/1; margin-top:18px; }
  #pointer{
    position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent;
    border-top:18px solid var(--gold); z-index:5; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  #wheel{
    width:100%; height:100%; border-radius:50%;
    background: conic-gradient(from 0deg,
      var(--gold) 0deg 60deg, var(--pink) 60deg 120deg, var(--gray) 120deg 180deg,
      var(--gold) 180deg 240deg, var(--pink) 240deg 300deg, var(--gray) 300deg 360deg);
    border:5px solid var(--card2);
    box-shadow:0 0 0 2px var(--border), 0 10px 30px rgba(0,0,0,0.4);
    position:relative; transform:rotate(0deg);
  }
  .seg{ position:absolute; inset:0; }
  .seg-icon{ position:absolute; top:13%; left:50%; }
  #hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:26%; height:26%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFE3A0, #F5B942 55%, #C98A2A 100%);
    border:3px solid var(--bgSoft); color:#2A1C05; font-weight:800; font-size:12px;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2;
  }
  #hub.hub-ad{
    font-size:9.5px; font-weight:800;
    background:radial-gradient(circle at 35% 30%, #BEEBFF, var(--blue) 55%, #1C7CA8 100%);
    color:#06222E;
  }
  #spinHint{ margin-top:22px; font-size:13px; color:var(--textMuted); }
  .legend{ display:flex; gap:14px; margin-top:18px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--textMuted); }

  /* task screen */
  .task-list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }

  /* sponsored ad-task cards */
  .ad-task{
    display:block;
    background:var(--card);
    border:1px solid var(--border);
    border-inline-start:3px solid var(--blue);
    border-radius:14px;
    padding:12px;
    font-family:'Manrope', sans-serif;
    color:var(--text);
  }
  .ad-task__reward{ display:block; font-size:11.5px; color:var(--textMuted); margin-top:2px; }
  .ad-task__btn{
    background:var(--blue); color:#06222E; border-radius:10px; padding:8px 0;
    font-size:12px; font-weight:700; text-align:center; cursor:pointer;
  }
  .ad-task__btn--claim{ background:var(--gold); color:#241A05; }
  .ad-task__btn--done{ background:transparent; border:1px solid var(--border); color:var(--textDim); }

  /* ad cooldown (neon countdown between ads) */
  .ad-cooldown{
    background:var(--card); border:1px solid var(--border); border-inline-start:3px solid #39FF88;
    border-radius:14px; padding:14px;
  }
  .ad-cooldown__top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .ad-cooldown__title{ font-size:13.5px; font-weight:600; }
  .ad-cooldown__sub{ font-size:11.5px; color:var(--textMuted); margin-top:2px; }
  .ad-cooldown__timer{
    font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; color:#39FF88;
    text-shadow:0 0 8px rgba(57,255,136,0.8);
  }
  .ad-cooldown__track{
    height:9px; border-radius:999px; background:rgba(255,255,255,0.08);
    overflow:hidden; position:relative;
  }
  .ad-cooldown__bar{
    height:100%; border-radius:999px; width:100%;
    background:linear-gradient(90deg,#39FF88,#34E0F1,#39FF88);
    background-size:200% 100%;
    box-shadow:0 0 10px 2px rgba(57,255,136,0.7), 0 0 18px 4px rgba(52,224,241,0.45);
    transition:width .25s linear;
    animation:neonShift 1.6s linear infinite;
  }
  @keyframes neonShift{ 0%{ background-position:0% 0; } 100%{ background-position:200% 0; } }

  /* daily link tasks */
  .task-card{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--border); border-radius:14px; padding:12px;
    border-inline-start:3px solid var(--pink);
  }
  .task-card.done{ opacity:.55; border-inline-start-color:var(--gray); }
  .task-info{ flex:1; }
  .task-info .t{ font-size:13.5px; font-weight:600; }
  .task-info .d{ font-size:11.5px; color:var(--textMuted); margin-top:3px; }
  .task-btn{
    display:flex; align-items:center; gap:5px; flex-shrink:0; background:var(--pink);
    color:#3A0E1E; border:none; border-radius:10px; padding:8px 12px; font-size:12px;
    font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .task-btn.done{ background:transparent; color:var(--textDim); border:1px solid var(--border); cursor:default; }

  /* shop screen */
  .shop-list{ display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .shop-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
  .shop-top{ display:flex; align-items:center; gap:10px; }
  .shop-icon{
    width:42px; height:42px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; background:rgba(52,179,241,0.12);
  }
  .shop-info{ flex:1; }
  .shop-info .t{ font-size:14px; font-weight:700; }
  .shop-info .d{ font-size:11.5px; color:var(--textMuted); margin-top:2px; }
  .shop-btn{
    width:100%; margin-top:12px; padding:10px; border-radius:10px; border:none;
    font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:6px;
  }
  .shop-btn.disabled{ background:var(--card2)!important; color:var(--textDim)!important; }
  .shop-btn:disabled{ cursor:default; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo"><span>Free</span><span class="pay">Pay</span></div>
    <div class="chips">
      <div class="chip" id="chipCoins"></div>
      <div class="chip" id="chipTickets"></div>
      <div class="chip" id="chipTon"></div>
    </div>
  </header>

  <div id="adsBanner"></div>

  <main id="main"></main>

  <nav>
    <button class="nav-btn" id="navHome" onclick="setTab('home')"></button>
    <button class="nav-btn" id="navTask" onclick="setTab('task')"></button>
    <button class="nav-btn" id="navShop" onclick="setTab('shop')"></button>
    <button class="nav-btn" id="navGame" onclick="setTab('game')"></button>

  }

function playTone(freq, duration, type, vol, delay){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol || 0.2, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}

/* ---------- lightweight particle burst (used by the welcome gift) ---------- */
function burstParticles(canvas, count){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w; canvas.height = h;
  const cx = w / 2, cy = h / 2;
  const colors = [C.gold, C.goldDark, C.pink, '#FFD24C'];
  const particles = [];
  for(let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 5.5;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2.5,
      life: 1,
      decay: 0.014 + Math.random() * 0.012,
      size: 2.5 + Math.random() * 3.5,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  function tick(){
    ctx.clearRect(0, 0, w, h);
    let alive = false;
    particles.forEach(p => {
      if(p.life <= 0) return;
      alive = true;
      p.vy += 0.16;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if(alive) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, w, h);
  }
  tick();
}

/* ---------- tiny "mining" animation for the cooldown card ----------
   Draws the flappy character swinging a pickaxe at a rock, transparent
   background so it blends with the card instead of showing a boxed sprite. */
let cooldownMineTime = 0;
let cooldownMineLastTs = 0;
function drawCooldownMineFrame(ts){
  const canvas = document.getElementById('adCooldownAnim');
  if(!canvas){ adCooldownRafId = null; return; }
  if(!cooldownMineLastTs) cooldownMineLastTs = ts;
  const dt = Math.min((ts - cooldownMineLastTs) / 1000, 0.05);
  cooldownMineLastTs = ts;
  cooldownMineTime += dt;

  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const cycle = (cooldownMineTime % 1.1) / 1.1; // 0..1 swing cycle
  const swing = Math.sin(cycle * Math.PI * 2);      // -1..1
  const impact = cycle > 0.42 && cycle < 0.5;        // brief impact moment

  ctx.save();
  ctx.translate(w * 0.36, h * 0.62);

  /* rock */
  ctx.fillStyle = '#3A4066';
  ctx.beginPath();
  ctx.moveTo(w * 0.18, h * 0.06);
  ctx.lineTo(w * 0.34, -h * 0.06);
  ctx.lineTo(w * 0.44, h * 0.10);
  ctx.lineTo(w * 0.30, h * 0.16);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#4A5188';
  ctx.beginPath();
  ctx.moveTo(w * 0.20, h * 0.05);
  ctx.lineTo(w * 0.30, -h * 0.02);
  ctx.lineTo(w * 0.34, h * 0.08);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  /* impact chips */
  if(impact){
    ctx.fillStyle = '#9AA1C9';
    for(let i = 0; i < 4; i++){
      const a = (i / 4) * Math.PI * 2 + cooldownMineTime * 6;
      const r = w * 0.06;
      const cx = w * 0.62 + Math.cos(a) * r;
      const cy = h * 0.5 + Math.sin(a) * r * 0.6;
      ctx.beginPath();
      ctx.arc(cx, cy, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* miner body (simple rounded shape, no external image = no blocked-CDN risk) */
  ctx.save();
  ctx.translate(w * 0.6, h * 0.55);
  const bob = Math.sin(cooldownMineTime * 6) * 1.2;
  ctx.translate(0, bob);
  ctx.fillStyle = '#F5B942';
  ctx.beginPath();
  ctx.ellipse(0, 0, w * 0.11, h * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFE3A0';
  ctx.beginPath();
  ctx.arc(0, -h * 0.2, w * 0.075, 0, Math.PI * 2);
  ctx.fill();

  /* pickaxe arm, swinging toward the rock */
  const swingAngle = -0.9 + swing * 0.9; // radians
  ctx.save();
  ctx.translate(-w * 0.06, -h * 0.05);
  ctx.rotate(swingAngle);
  ctx.strokeStyle = '#B9822A';
  ctx.lineWidth = Math.max(2, w * 0.045);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w * 0.22, 0);
  ctx.stroke();
  ctx.fillStyle = '#9AA1C9';
  ctx.beginPath();
  ctx.moveTo(w * 0.22, -h * 0.05);
  ctx.lineTo(w * 0.30, 0);
  ctx.lineTo(w * 0.22, h * 0.05);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.restore();

  adCooldownRafId = requestAnimationFrame(drawCooldownMineFrame);
}

function startCooldownMineAnim(){
  stopCooldownMineAnim();
  cooldownMineTime = 0;
  cooldownMineLastTs = 0;
  adCooldownRafId = requestAnimationFrame(drawCooldownMineFrame);
}
function stopCooldownMineAnim(){
  if(adCooldownRafId){ cancelAnimationFrame(adCooldownRafId); adCooldownRafId = null; }
}

function updateAdCooldownUI(){
  const bar = document.getElementById('adCooldownBar');
  if(!bar) return;
  const remain = Math.max(0, AD_COOLDOWN_MS - (Date.now() - adCooldownStart));
  bar.style.width = Math.max(0, (remain / AD_COOLDOWN_MS) * 100) + '%';
}

function startAdCooldown(){
  adCoolingDown = true;
  updateNavDot();
  adCooldownStart = Date.now();
  if(adCooldownInterval) clearInterval(adCooldownInterval);
  if(adCooldownTimeout) clearTimeout(adCooldownTimeout);

  if(state.tab === 'task') renderMain();
  /* set the bar's initial width on the *next* frame so the CSS transition
     actually animates from 100% down, instead of snapping straight to 0 */
  requestAnimationFrame(()=>{
    const bar = document.getElementById('adCooldownBar');
    if(bar) bar.style.width = '100%';
    requestAnimationFrame(updateAdCooldownUI);
    startCooldownMineAnim();
  });

  adCooldownInterval = setInterval(updateAdCooldownUI, 250);
  adCooldownTimeout = setTimeout(()=>{
    adCoolingDown = false;
    stopCooldownMineAnim();
    clearInterval(adCooldownInterval);
    adCooldownInterval = null;
    adCooldownTimeout = null;
    rotateActiveAdBlock();
  }, AD_COOLDOWN_MS);
}

/* Monetag Rewarded Interstitial (zone 11890386) that lets a user with 4 tickets spin anyway */
let SpinAdController = null;
function getSpinAdController(){
  if(!SpinAdController && typeof show_11890386 === 'function'){
    SpinAdController = { show: () => show_11890386() };
  }
  return SpinAdController;
}

/* Monetag Rewarded Popup (zone 11890386) used on the Flappy Dino claim screen to double the round's tickets —
   popup chosen over interstitial because the user is mid-game and a lighter format loses fewer of them */
let FlappyAdController = null;
function getFlappyAdController(){
  if(!FlappyAdController && typeof show_11890386 === 'function'){
    FlappyAdController = { show: () => show_11890386('pop') };
  }
  return FlappyAdController;

function handleSpin(){
  if(state.spinning) return;
  if(state.tickets < 5){
    showToast('You need 5 tickets to spin the wheel');
    return;
  }
  playClickSound();
  state.tickets -= 5;
  performSpin();
}

function handleSpinWithAd(){
  if(state.spinning) return;
  if(state.tickets !== 4){
    handleSpin();
    return;
  }
  const controller = getSpinAdController();
  if(!controller){
    showToast('Ad module is not ready, try again in a moment');
    return;
  }
  playClickSound();
  const hub = document.getElementById('hub');
  if(hub) hub.disabled = true;

  controller.show().then(()=>{
    if(hub) hub.disabled = false;
    state.tickets -= 4;
    performSpin();
  }).catch(()=>{
    if(hub) hub.disabled = false;
    showToast('Ad was not completed, spin canceled');
  });
}

function performSpin(){
  state.spinCount += 1;
  persistState();
  renderChips();
  const n = state.spinCount;

  let idx, type, amount;
  if(n === 1){ idx=0; type='coin'; amount=10; }
  else if(n === 2){ idx=1; type='ticket'; amount=5; }
  else if(n === 3){ idx=3; type='coin'; amount=5; }
  else{
    idx = Math.floor(Math.random()*6);
    type = SEGMENTS[idx].type;
    if(type==='coin') amount = 3 + Math.floor(Math.random()*6);
    else if(type==='ticket') amount = 2 + Math.floor(Math.random()*6);
    else amount = 0;
  }

  const centerAngle = idx*60 + 30;
  const finalMod = (360 - centerAngle) % 360;
  const currentMod = ((state.rotation % 360) + 360) % 360;
  const delta = ((finalMod - currentMod) % 360 + 360) % 360;
  const extraSpins = 6;
  const nextRotation = state.rotation + extraSpins*360 + delta;

  state.spinning = true;
  state.rotation = nextRotation;

  const wheel = document.getElementById('wheel');
  wheel.style.transition = 'transform 4.2s cubic-bezier(.17,.67,.16,1)';
  wheel.style.transform = `rotate(${nextRotation}deg)`;

  const hub = document.getElementById('hub');
  if(hub){ hub.textContent = '...'; hub.disabled = true; }

  setTimeout(()=>{
    state.spinning = false;
    if(type === 'coin'){ state.coins += amount; pushCoinsToBackend(); }
    if(type === 'ticket') state.tickets += amount;
    renderChips();
    if(type !== 'blank') playClaimSound();
    if(state.tab === 'home') renderMain();
    openModal(type, amount);
  }, 4300);
}

/* ---------- Monetag block-style ad-task behavior ---------- */
/* Calls whichever Monetag format is currently the "live" slot (interstitial
   or popup — see activeAdIndex) directly via the SDK's global show function. */
function watchBlockAd(){
  if(adCoolingDown) return;
  const t = AD_TASKS[activeAdIndex];
  if(typeof show_11890386 !== 'function'){
    showToast('Ad module is not ready, try again in a moment');
    return;
  }
  const request = t.format === 'popup' ? show_11890386('pop') : show_11890386();
  request.then(()=>{
    if(tutorialStep === 2) finishTutorial();
    state.tickets += t.reward;
    state.adsWatchedToday += 1;
    renderChips();
    renderAdsBanner();
    playClaimSound();
    showToast(`+${t.reward} ticket earned 🎫`);
    bumpAdsWatchedBackend();
    startAdCooldown();
  }).catch(()=>{
    showToast('Ad was not completed, try again later');
    rotateActiveAdBlock();
  });
}

/* ---------- daily link task behavior ---------- */
function openExtraTask(id){
  const t = EXTRA_TASKS.find(x => x.id === id);
  if(!t || state.tasksDoneToday[t.id]) return;
  playClickSound();
  if(t.url.indexOf('https://t.me/') === 0){
    if(TG && TG.openTelegramLink) TG.openTelegramLink(t.url); else window.open(t.url, '_blank');
  } else {
    if(TG && TG.openLink) TG.openLink(t.url); else window.open(t.url, '_blank');
  }
  openedTasks[t.id] = true;
  if(state.tab === 'task') renderMain();
}

function claimExtraTask(id){
  const t = EXTRA_TASKS.find(x => x.id === id);
  if(!t || state.tasksDoneToday[t.id]) return;
  state.tasksDoneToday[t.id] = true;
  state.tickets += t.reward;
  renderChips();
  playClaimSound();
  showToast(`+${t.reward} ticket earned 🎫`);

  if(state.coins < 500){ showToast('You need at least 500 coins'); return; }
  playClickSound();
  state.coins -= 500;

  playClickSound();

function paintSpotlight(rect, bubbleHtml, bubbleAbove){
  const overlay = document.getElementById('tutorialOverlay');
  if(!overlay) return;
  const appEl = document.getElementById('app');
  const appRect = appEl.getBoundingClientRect();
  const pad = 8;
  const hole = {
    left: Math.max(rect.left - appRect.left - pad, 0),
    top: Math.max(rect.top - appRect.top - pad, 0),
    right: Math.min(rect.right - appRect.left + pad, appRect.width),
    bottom: Math.min(rect.bottom - appRect.top + pad, appRect.height)
  };
  const appW = appRect.width, appH = appRect.height;

  overlay.innerHTML = `
    <div class="tut-mask-panel" style="left:0px; top:0px; width:${appW}px; height:${hole.top}px;"></div>
    <div class="tut-mask-panel" style="left:0px; top:${hole.bottom}px; width:${appW}px; height:${Math.max(appH-hole.bottom,0)}px;"></div>
    <div class="tut-mask-panel" style="left:0px; top:${hole.top}px; width:${hole.left}px; height:${hole.bottom-hole.top}px;"></div>
    <div class="tut-mask-panel" style="left:${hole.right}px; top:${hole.top}px; width:${Math.max(appW-hole.right,0)}px; height:${hole.bottom-hole.top}px;"></div>
    <div class="tut-highlight-ring" style="left:${hole.left}px; top:${hole.top}px; width:${hole.right-hole.left}px; height:${hole.bottom-hole.top}px;"></div>
  `;

  const bubble = document.createElement('div');
  bubble.className = 'tut-bubble';
  bubble.style.maxWidth = Math.min(appW-32, 260)+'px';
  bubble.innerHTML = bubbleHtml;
  overlay.appendChild(bubble);

  requestAnimationFrame(()=>{
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    let bLeft = hole.left + (hole.right-hole.left)/2 - bw/2;
    bLeft = Math.max(10, Math.min(bLeft, appW-bw-10));
    let bTop = bubbleAbove ? (hole.top - bh - 14) : (hole.bottom + 14);
    if(bTop < 10) bTop = hole.bottom + 14;
    if(bTop + bh > appH-10) bTop = Math.max(10, hole.top - bh - 14);
    bubble.style.left = bLeft+'px';
    bubble.style.top = bTop+'px';
  });
}

function startTutorialStepNav(){
  tutorialStep = 1;
  const target = document.getElementById('navTask');
  if(!target) return;
  const paint = ()=> paintSpotlight(target.getBoundingClientRect(), '👆 برای دیدن تسک‌ها اینجا بزن', true);
  paint();
  tutorialResizeHandler = ()=>{ if(tutorialStep === 1) paint(); };
  window.addEventListener('resize', tutorialResizeHandler);
}

function startTutorialStepTasks(){
  tutorialStep = 2;
  const mainEl = document.getElementById('main');
  if(mainEl) mainEl.scrollTop = 0;
  setTimeout(()=>{
    if(tutorialStep !== 2) return;
    const tasks = document.querySelectorAll('.ad-task');
    if(!tasks.length){ finishTutorial(); return; }
    const paint = ()=>{
      const first = tasks[0].getBoundingClientRect();
      const last = tasks[tasks.length-1].getBoundingClientRect();
      const rect = {
        left: Math.min(first.left, last.left), right: Math.max(first.right, last.right),
        top: Math.min(first.top, last.top), bottom: Math.max(first.bottom, last.bottom)
      };
      paintSpotlight(rect, '👆 روی یکی از این تبلیغ‌ها بزن تا بلیط بگیری', false);
    };
    paint();
    tutorialResizeHandler = ()=>{ if(tutorialStep === 2) paint(); };
    window.addEventListener('resize', tutorialResizeHandler);
  }, 260);
}

function finishTutorial(){
  if(tutorialStep === 0) return;
  tutorialStep = 0;
  clearTutorialOverlay();
}

/* ================= Flappy Dino mini-game (inlined, no iframe) ================= */
const flappyPlayerImg = new Image();
flappyPlayerImg.src = FLAPPY_PLAYER_SRC;

let flappyRafId = null;
let flappyFlapHandler = null;
let flappyKeyBound = false;

function flappyLocalGet(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
function flappyLocalSet(key, val){ try { localStorage.setItem(key, val); } catch(e){} }

function initFlappyGame(){
  if(flappyRafId){ cancelAnimationFrame(flappyRafId); flappyRafId = null; }

  const canvas = document.getElementById('flappyCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');

  const LW = 288, LH = 512;
  canvas.width = LW;
  canvas.height = LH;

  const overlay = document.getElementById('flappyOverlay');
  const titleText = document.getElementById('flappyTitle');
  const subText = document.getElementById('flappySub');
  const finalScoreEl = document.getElementById('flappyFinal');
  const scoreLabel = document.getElementById('flappyScoreLabel');

  /* ---------- cheap cached galaxy background (rendered once, blitted every frame) ---------- */
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = LW; bgCanvas.height = LH;
  const bgCtx = bgCanvas.getContext('2d');

  (function buildStaticBackground(){
    const g = bgCtx.createLinearGradient(0,0,0,LH);
    g.addColorStop(0, '#0b0420');
    g.addColorStop(0.55, '#1a0a3c');
    g.addColorStop(1, '#05010f');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0,0,LW,LH);

    const blobs = [
      { x: LW*0.25, y: LH*0.3, r: 90, color: 'rgba(106,48,147,0.35)' },
      { x: LW*0.75, y: LH*0.55, r: 110, color: 'rgba(58,28,113,0.35)' },
      { x: LW*0.5, y: LH*0.15, r: 70, color: 'rgba(75,46,131,0.3)' }
    ];
    blobs.forEach(b => {
      const rg = bgCtx.createRadialGradient(b.x,b.y,0, b.x,b.y,b.r);
      rg.addColorStop(0, b.color);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = rg;
      bgCtx.fillRect(b.x-b.r, b.y-b.r, b.r*2, b.r*2);
    });

    bgCtx.fillStyle = '#c96b4a';
    bgCtx.beginPath();
    bgCtx.arc(LW*0.78, LH*0.18, 16, 0, Math.PI*2);
    bgCtx.fill();
    bgCtx.strokeStyle = 'rgba(232,168,124,0.6)';
    bgCtx.lineWidth = 3;
    bgCtx.beginPath();
    bgCtx.ellipse(LW*0.78, LH*0.18, 26, 7, -0.3, 0, Math.PI*2);
    bgCtx.stroke();

    for (let i=0;i<70;i++){
      bgCtx.globalAlpha = 0.4 + Math.random()*0.6;
      bgCtx.fillStyle = i % 6 === 0 ? '#ffe066' : '#cfc6ff';
      const s = Math.random() < 0.8 ? 1 : 2;
      bgCtx.fillRect(Math.random()*LW, Math.random()*LH, s, s);
    }
    bgCtx.globalAlpha = 1;
  })();

  const movingStars = [];
  for (let i=0;i<20;i++){
    movingStars.push({ x: Math.random()*LW, y: Math.random()*LH, s: Math.random()<0.5?1:2 });
  }

  function drawBackground(dt){
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.fillStyle = '#e8e0ff';
    movingStars.forEach(s => {
      s.x -= 20 * dt;
      if (s.x < -2) s.x = LW + 2;
      ctx.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s);
    });
  }

  /* ---------- game constants ---------- */
  const GRAVITY = 900;
  const FLAP_VELOCITY = -260;
  const MAX_FALL = 420;
  const PIPE_W = 42;
  const PIPE_GAP = 130;
  const PIPE_SPEED = 95;
  const PIPE_INTERVAL = 1500;
  const GROUND_H = 24;

  const player = { x: LW*0.28, y: LH*0.45, vy:0, w:58, h:44, rot:0 };

  let pipes = [];
  let lastPipeTime = 0;
  let score = 0;
  let best = Number(flappyLocalGet('pf_best') || 0);

  const TICKETS_PER_PIPE = 0.25;
  let roundTickets = 0;
  const claimOverlay = document.getElementById('flappyClaimOverlay');
  const claimAmountEl = document.getElementById('flappyClaimAmount');
  const adAmountEl = document.getElementById('flappyAdAmount');
  const adBtn = document.getElementById('flappyAdBtn');
  const claimBtn = document.getElementById('flappyClaimBtn');
  let awaitingClaim = false;

  let gs = 'ready'; // ready | playing | dead
  let animTime = 0;

  function updateScoreLabel(){
    if(scoreLabel) scoreLabel.innerHTML = `${ticketIcon(22,'#FDF6E8', C.pink)}<span>${roundTickets.toFixed(2)}</span>`;
  }

  function resetGame(){
    player.x = LW*0.28; player.y = LH*0.45; player.vy = 0; player.rot = 0;
    pipes = []; lastPipeTime = 0; score = 0; roundTickets = 0;
    updateScoreLabel();
  }

  function spawnPipe(){
    const margin = 50;
    const gapY = margin + Math.random() * (LH - GROUND_H - margin*2 - PIPE_GAP);
    pipes.push({ x: LW + PIPE_W, gapY, passed:false });
  }

  function flap(){
    if (gs === 'ready'){
      gs = 'playing';
      overlay.style.display = 'none';
      scoreLabel.style.opacity = '1';
      player.vy = FLAP_VELOCITY;
      playFlapSound();
    } else if (gs === 'playing'){
      player.vy = FLAP_VELOCITY;
      playFlapSound();
    } else if (gs === 'dead'){
      if (awaitingClaim) return; /* claim overlay is up — must tap CLAIM, not the canvas */
      resetGame();
      gs = 'ready';
      overlay.style.display = 'flex';
      finalScoreEl.style.display = 'none';
      titleText.textContent = 'TAP TO START';
      subText.textContent = 'tap / click / press space to flap';
      scoreLabel.style.opacity = '0';
    }
  }
  flappyFlapHandler = flap;

  function hideClaimOverlay(){
    awaitingClaim = false;
    if(claimOverlay) claimOverlay.classList.remove('show');
    if(adBtn){ adBtn.style.display = ''; adBtn.disabled = false; }
  }

  function showClaimOverlay(){
    awaitingClaim = true;
    overlay.style.display = 'none'; /* the claim card replaces the plain game-over card */
    if(claimAmountEl) claimAmountEl.textContent = roundTickets.toFixed(2);
    if(adAmountEl) adAmountEl.textContent = (roundTickets*2).toFixed(2);
    if(adBtn){ adBtn.style.display = roundTickets >= 1 ? '' : 'none'; adBtn.disabled = false; }
    if(claimOverlay) claimOverlay.classList.add('show');
  }

  function returnToReadyScreen(){
    resetGame();
    gs = 'ready';
    overlay.style.display = 'flex';
    finalScoreEl.style.display = 'none';
    titleText.textContent = 'TAP TO START';
    subText.textContent = 'tap / click / press space to flap';
    scoreLabel.style.opacity = '0';
  }

  window.claimFlappyReward = function(){
    const amount = Number(claimAmountEl ? claimAmountEl.textContent : 0) || 0;
    if(amount > 0){
      state.tickets += amount;
      persistState();
      renderChips();
      playClaimSound();
      showToast(`+${amount.toFixed(2)} tickets earned 🎫`);
    }
    hideClaimOverlay();
    returnToReadyScreen();
  };

  window.watchAdForDoubleFlappyReward = function(){
    const controller = getFlappyAdController();
    if(!controller){
      showToast('Ad module is not ready, try again in a moment');
      return;
    }
    if(adBtn) adBtn.disabled = true;
    controller.show().then(()=>{
      const doubled = (Number(claimAmountEl.textContent) || 0) * 2;
      if(claimAmountEl) claimAmountEl.textContent = doubled.toFixed(2);
      if(adBtn) adBtn.style.display = 'none';
      bumpAdsWatchedBackend();
    }).catch(()=>{
      if(adBtn) adBtn.disabled = false;
      showToast('Ad was not completed');
    });
  };

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  function die(){
    if (gs !== 'playing') return;
    gs = 'dead';
    playFlappyHitSound();
    if (score > best){ best = score; flappyLocalSet('pf_best', best); }
    if (roundTickets > 0){
      showClaimOverlay();
      return;
    }
    overlay.style.display = 'flex';
    titleText.textContent = 'GAME OVER';
    subText.textContent = 'tap to try again';
    finalScoreEl.style.display = 'block';
    finalScoreEl.textContent = 'score ' + score + '   best ' + best;
  }

  function drawGround(){
    ctx.fillStyle = '#1a0f33';
    ctx.fillRect(0, LH-GROUND_H, LW, GROUND_H);
    ctx.fillStyle = '#2a1a4a';
    for (let x=0; x<LW; x+=8){ ctx.fillRect(x, LH-GROUND_H, 4, 4); }
  }

  function drawPipe(p){
    const capH = 14;
    const topH = p.gapY;
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(p.x, 0, PIPE_W, topH);
    ctx.fillStyle = '#27ae60'; ctx.fillRect(p.x, 0, 6, topH);
    ctx.fillStyle = '#58d68d'; ctx.fillRect(p.x, 0, PIPE_W-6, 4);
    ctx.fillStyle = '#1e8449'; ctx.fillRect(p.x-4, topH-capH, PIPE_W+8, capH);
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(p.x-4, topH-capH, PIPE_W+8, 4);

    const botY = p.gapY + PIPE_GAP;
    const botH = LH - GROUND_H - botY;
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(p.x, botY, PIPE_W, botH);
    ctx.fillStyle = '#27ae60'; ctx.fillRect(p.x, botY, 6, botH);
    ctx.fillStyle = '#1e8449'; ctx.fillRect(p.x-4, botY, PIPE_W+8, capH);
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(p.x-4, botY+capH-4, PIPE_W+8, 4);
  }

  function drawPlayer(){
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.rotate(player.rot);
    if (flappyPlayerImg.complete && flappyPlayerImg.naturalWidth){
      ctx.drawImage(flappyPlayerImg, -player.w/2, -player.h/2, player.w, player.h);
    } else {
      ctx.fillStyle = '#4a6fa5';
      ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    }
    ctx.restore();
  }

  let lastTs = 0;
  function loop(ts){
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    if (dt > 0.05) dt = 0.05;
    lastTs = ts;
    animTime += dt;

    drawBackground(dt);

    if (gs === 'playing'){
      player.vy += GRAVITY * dt;
      if (player.vy > MAX_FALL) player.vy = MAX_FALL;
      player.y += player.vy * dt;
      player.rot = Math.max(-0.5, Math.min(1.1, player.vy / 400));

      lastPipeTime += dt*1000;
      if (lastPipeTime > PIPE_INTERVAL){ lastPipeTime = 0; spawnPipe(); }

      pipes.forEach(p => { p.x -= PIPE_SPEED * dt; });
      pipes = pipes.filter(p => p.x > -PIPE_W - 10);

      pipes.forEach(p => {
        if (!p.passed && p.x + PIPE_W < player.x){
          p.passed = true; score++;
          roundTickets += TICKETS_PER_PIPE;
          updateScoreLabel();
          playFlappyScoreSound();
        }
        const px = player.x + 6, py = player.y + 6, pw = player.w - 12, ph = player.h - 12;
        if (rectsOverlap(px,py,pw,ph, p.x, 0, PIPE_W, p.gapY)) die();
        if (rectsOverlap(px,py,pw,ph, p.x, p.gapY+PIPE_GAP, PIPE_W, LH)) die();
      });

      if (player.y + player.h > LH - GROUND_H){ player.y = LH - GROUND_H - player.h; die(); }
      if (player.y < -20){ player.y = -20; player.vy = 0; }
    } else if (gs === 'ready'){
      player.y = LH*0.45 + Math.sin(animTime*3)*6;
      player.rot = Math.sin(animTime*3)*0.08;
    }

    pipes.forEach(drawPipe);
    drawPlayer();
    drawGround();

    flappyRafId = requestAnimationFrame(loop);
  }

  function onInput(e){ e.preventDefault(); flap(); }
  canvas.addEventListener('touchstart', onInput, { passive:false });
  canvas.addEventListener('mousedown', onInput);

  if(!flappyKeyBound){
    flappyKeyBound = true;
    window.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'ArrowUp') && flappyFlapHandler && state.tab === 'game'){
        e.preventDefault();
        flappyFlapHandler();
      }
    });
  }

  if (best > 0){ subText.textContent = 'best score: ' + best; }

  flappyRafId = requestAnimationFrame(loop);
}
