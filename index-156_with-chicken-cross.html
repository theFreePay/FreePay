    <div class="wl-bal">
      <div class="wl-tile"><small>${tt('wl_coins')}</small><b id="wlBalCoins">${coinIcon(20)}<span>${fmtNum(state.coins)}</span></b></div>
      <div class="wl-tile dia"><small>${tt('wl_dia')}</small><b id="wlBalDia">${diaIcon(20)}<span>${fmtDia(state.dia || 0)}</span></b></div>
    </div>

    <div class="wl-card">
      <div class="wl-card-title">${tt('wl_swap_title')}</div>

      <div class="wl-row" id="wlPayRow">
        <small>${tt('wl_pay')}</small>
        <div class="wl-line">
          <input id="wlAmt" class="wl-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${walletAmt}"
                 oninput="walletInput(this.value)" onfocus="document.getElementById('wlPayRow').classList.add('focus')" onblur="document.getElementById('wlPayRow').classList.remove('focus')">
          <div class="wl-pill" id="wlPayPill"></div>
        </div>
        <div class="wl-quick" id="wlQuick"></div>
      </div>

      <button class="wl-flip tap" id="wlFlip" onclick="walletFlip()" aria-label="Switch direction">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v15M4.5 15.5 8 19l3.5-3.5M16 20V5M12.5 8.5 16 5l3.5 3.5"/></svg>
      </button>

      <div class="wl-row">
        <small>${tt('wl_get')}</small>
        <div class="wl-line">
          <div id="wlOut" class="wl-out empty">0</div>
          <div class="wl-pill" id="wlGetPill"></div>
        </div>
      </div>

      <div class="wl-info">
        <div><span>${tt('wl_rate')}</span><b id="wlRate"></b></div>
        <div><span>${tt('wl_fee')}</span><b id="wlFee"></b></div>
      </div>

      <button class="shop-btn wl-go tap" id="wlGo" onclick="walletExchange()">${tt('wl_go')}</button>
    </div>

    <div class="wl-card">
      <div class="wl-card-title">${tt('wl_promo_title')}</div>
      <div class="wl-card-sub">${tt('wl_promo_sub')}</div>
      <div class="wl-promo">
        <input id="wlCode" class="wl-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${tt('wl_promo_ph')}">
        <button class="wl-claim tap" onclick="walletClaimCode()">${tt('wl_claim')}</button>
      </div>
    </div>
  `;
}

/* refresh the parts of the swap card that depend on direction / amount (the input itself is never re-rendered, so the keyboard stays open) */
function walletRefresh(){
  const buy = walletDir === 'buy';
  const coinPill = `${coinIcon(18)}<span>${tt('wl_coins')}</span>`;
  const diaPill = `${diaIcon(18)}<span>${tt('wl_dia')}</span>`;
  const set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set('wlPayPill', buy ? coinPill : diaPill);
  set('wlGetPill', buy ? diaPill : coinPill);
  const ic = (f) => `<span style="display:inline-flex;vertical-align:-2px;margin:0 2px">${f}</span>`;
  set('wlRate', buy ? `100 ${ic(coinIcon(13))} = 0.01 ${ic(diaIcon(13))}` : `0.01 ${ic(diaIcon(13))} = 90 ${ic(coinIcon(13))}`);
  const units = walletUnits();
  const feeCoins = units * (WL_BUY_COINS_PER_UNIT - WL_SELL_COINS_PER_UNIT);
  set('wlFee', buy ? tt('wl_fee_buy') : tt('wl_fee_sell', {n: fmtNum(feeCoins)}));
  const out = document.getElementById('wlOut');
  if(out){
    const getTxt = units < 1 ? '0' : (buy ? fmtDia(units) : fmtNum(units * WL_SELL_COINS_PER_UNIT));
    out.textContent = getTxt;
    out.classList.toggle('empty', units < 1);
  }
  const quick = document.getElementById('wlQuick');
  if(quick){
    const maxVal = buy ? Math.floor(state.coins / WL_BUY_COINS_PER_UNIT) * WL_BUY_COINS_PER_UNIT : (state.dia || 0) / 100;
    const opts = buy ? [100, 500, 1000] : [0.01, 0.1, 0.5];
    quick.innerHTML = opts.map(v => `<button onclick="walletQuick(${v})">${buy ? fmtNum(v) : v.toFixed(2)}</button>`).join('')
      + `<button onclick="walletQuick(${maxVal})">${tt('wl_max')}</button>`;
  }
  const inp = document.getElementById('wlAmt');
  if(inp) inp.inputMode = buy ? 'numeric' : 'decimal';
}
function walletInput(v){
  /* keep digits and one decimal separator only */
  let c = String(v).replace(',', '.').replace(/[^0-9.]/g, '');
  const i = c.indexOf('.');
  if(i !== -1) c = c.slice(0, i + 1) + c.slice(i + 1).replace(/\./g, '');
  if(walletDir === 'buy') c = c.split('.')[0];
  else if(i !== -1) c = c.slice(0, c.indexOf('.') + 3);
  walletAmt = c;
  const inp = document.getElementById('wlAmt');
  if(inp && inp.value !== c) inp.value = c;
  walletRefresh();
}
function walletQuick(v){
  playClickSound();
  walletAmt = v > 0 ? String(walletDir === 'buy' ? v : v.toFixed(2)) : '';
  const inp = document.getElementById('wlAmt'); if(inp) inp.value = walletAmt;
  walletRefresh();
}
function walletFlip(){
  playClickSound();
  walletDir = walletDir === 'buy' ? 'sell' : 'buy';
  walletAmt = '';
  const inp = document.getElementById('wlAmt'); if(inp) inp.value = '';
  const f = document.getElementById('wlFlip'); if(f) f.classList.toggle('turn');
  walletRefresh();
}
function walletExchange(){
  const units = walletUnits();
  if(!walletAmt || units < 1){
    showToast(walletAmt ? tt(walletDir === 'buy' ? 'wl_min_buy' : 'wl_min_sell') : tt('wl_enter'));
    return;
  }
  if(walletDir === 'buy'){
    const cost = units * WL_BUY_COINS_PER_UNIT;
    if(cost > Math.floor(state.coins + 1e-9)){ showToast(tt('wl_no_coins')); return; }
    state.coins -= cost;
    state.dia = (state.dia || 0) + units;
    showToast(tt('wl_done_buy', {n: fmtDia(units)}));
  } else {
    if(units > (state.dia || 0)){ showToast(tt('wl_no_dia')); return; }
    const got = units * WL_SELL_COINS_PER_UNIT;
    state.dia -= units;
    state.coins += got;
    showToast(tt('wl_done_sell', {n: fmtNum(got)}));
  }
  playClickSound();
  pushCoinsToBackend();   /* saves coins and diamonds to the backend */
  renderChips();          /* also saves the local state */
  playClaimSound();
  walletAmt = '';
  if(state.tab === 'wallet') renderMain();
}
function walletClaimCode(){
  const el = document.getElementById('wlCode');
  const code = el ? el.value.trim() : '';
  playClickSound();
  showToast(code ? tt('wl_promo_soon') : tt('wl_promo_empty'));
}

/* ---------- init ---------- */
/* what happens right after the app opens (once the language is known) */
/* short interstitial (AdsGram int-23717) shown once every time the app opens; whatever happens (ad shown / no fill / error) the normal flow continues */
function showEntryInterstitial(){
  return new Promise(resolve=>{
    try{
      const c = getInterstitialAdController();
      if(!c){ resolve(); return; }
      c.show().then(()=>resolve()).catch(()=>resolve());
    }catch(e){ resolve(); }
  });
}
async function startEntryFlow(){
  await showEntryInterstitial();
  if(!state.giftClaimed) showGiftOverlay();
  else if(shouldShowDailyReward()) showDailyRewardOverlay();
}
updateLangButton();
applyStaticI18n();
renderChips();
renderAdsBanner();
renderNav();
renderMain();
initAdPreload();
if(LANG_WAS_SAVED) startEntryFlow();
else openLangPicker(true);   /* very first launch: ask for the language before anything else */
loadCrashNamePool();   /* one-time fetch of ~50 player names for Crash */
syncUserFromBackend().then(autoRegisterFromStartParam); /* refreshes state.coins from Supabase once it responds; local value renders first so there's no blank flash */
</script>
