<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreePay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#11152B; --bgSoft:#161B36; --card:#1B2044; --card2:#20264C;
    --border:rgba(255,255,255,0.07); --text:#F3EFE3; --textMuted:#9098C2; --textDim:#6A7099;
    --gold:#F5B942; --goldDark:#B9822A; --pink:#FF5C8A; --pinkDark:#C23A63;
    --gray:#3A4066; --grayLight:#9AA1C9; --blue:#34B3F1; --blueLight:#7FD4FA; --star:#FFD24C;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family:'Manrope', sans-serif; color:var(--text);
    display:flex; justify-content:center; min-height:100vh;
  }
  button{ font-family:inherit; }
  .tap:active{ transform:scale(0.96); }

  @keyframes popIn{ from{opacity:0; transform:translateY(10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes floatToast{ from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);} }

  #app{
    width:100%; max-width:430px; height:100vh; max-height:900px;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.4);
  }

  /* header */
  header{ padding:16px 16px 10px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-size:20px; font-weight:800; }
  .logo .pay{ color:var(--gold); }
  .chips{ display:flex; gap:6px; }
  .chip{
    display:flex; align-items:center; gap:5px; background:var(--card);
    border:1px solid var(--border); border-radius:999px; padding:5px 10px 5px 9px;
    font-size:13px; font-weight:600;
  }
  .chip span{ font-variant-numeric:tabular-nums; }

  /* ads-watched banner */
  .ads-banner{
    margin:0 16px 8px; padding:9px 12px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--textMuted);
  }
  .ads-banner b{ color:var(--text); font-variant-numeric:tabular-nums; }

  /* body / screens */
  main{ flex:1; overflow-y:auto; padding:6px 16px 16px; }
  .screen-title{ font-size:15px; font-weight:700; }
  .screen-sub{ font-size:12px; color:var(--textMuted); margin-top:2px; }
  .section-label{ font-size:11.5px; color:var(--textDim); margin:16px 0 8px; }

  /* bottom nav */
  nav{
    display:flex; border-top:1px solid var(--border); background:var(--bgSoft);
    padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  }
  .nav-btn{
    position:relative; flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:6px 0; cursor:pointer;
  }
  .nav-btn span{ font-size:11px; color:var(--textDim); font-weight:500; }
  .nav-btn.active span{ color:var(--gold); font-weight:700; }
  .nav-dot{
    position:absolute; top:2px; right:calc(50% - 20px); width:8px; height:8px;
    border-radius:50%; background:var(--star); box-shadow:0 0 0 2px var(--bgSoft);
    animation:popIn .2s ease-out;
  }

  /* flappy dino tab */
  .game-frame-wrap{ display:flex; justify-content:center; margin-top:10px; }
  .game-frame{
    width:100%; max-width:320px; aspect-ratio:9/16; max-height:65vh;
    border:none; border-radius:16px; background:#05010f;
    box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }

  /* toast */
  #toast{
    position:absolute; top:70px; left:50%; animation:floatToast .2s ease-out;
    background:var(--card2); border:1px solid var(--border); padding:8px 16px;
    border-radius:999px; font-size:13px; white-space:nowrap; z-index:60; display:none;
  }

  /* onboarding tutorial spotlight */
  .tut-mask-panel{
    position:absolute; background:rgba(9,11,25,0.6);
    backdrop-filter:blur(4px) grayscale(1); -webkit-backdrop-filter:blur(4px) grayscale(1);
    z-index:55; pointer-events:auto;
  }
  .tut-highlight-ring{
    position:absolute; z-index:56; border:2px solid var(--gold); border-radius:14px;
    pointer-events:none; animation:tutPulse 1.4s ease-in-out infinite;
  }
  @keyframes tutPulse{
    0%,100%{ box-shadow:0 0 0 4px rgba(245,185,66,0.25), 0 0 14px rgba(245,185,66,0.5); }
    50%{ box-shadow:0 0 0 8px rgba(245,185,66,0.12), 0 0 26px rgba(245,185,66,0.85); }
  }
  .tut-bubble{
    position:absolute; z-index:57; background:var(--card2); border:1px solid var(--border);
    border-radius:14px; padding:9px 14px; font-size:12.5px; font-weight:700; color:var(--text);
    text-align:center; box-shadow:0 6px 20px rgba(0,0,0,0.45); pointer-events:none;
    animation:popIn .25s ease-out;
  }

  /* modal */
  #modalOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.72);
    display:none; align-items:center; justify-content:center; z-index:40;
  }
  #modalBox{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:28px 26px; width:260px; text-align:center; animation:popIn .25s ease-out;
  }
  #modalIcon{ display:flex; justify-content:center; margin-bottom:14px; }
  #modalTitle{ font-size:17px; font-weight:700; margin-bottom:4px; }
  #modalSub{ font-size:13px; color:var(--textMuted); margin-bottom:18px; }
  #modalBtn{
    width:100%; padding:11px; border-radius:12px; border:none;
    background:var(--gold); color:#241A05; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* welcome gift overlay */
  #giftOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.88);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #giftCard{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:30px 24px; width:270px; text-align:center; animation:popIn .3s ease-out;
    position:relative; overflow:visible;
  }
  #giftTitle{ font-size:17px; font-weight:800; margin-bottom:4px; }
  #giftSub{ font-size:13px; color:var(--textMuted); margin-bottom:6px; }
  #giftStage{ position:relative; width:140px; height:140px; margin:14px auto 6px; }
  #giftParticles{ position:absolute; inset:-40px; pointer-events:none; }
  #giftBox{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; animation:giftBounce 1.6s ease-in-out infinite;
  }
  #giftBox.opened{ animation:none; transform:scale(1.12); transition:transform .25s ease-out; }
  #giftBox.opened svg #giftLid{ transform:translateY(-14px) rotate(-8deg); }
  #giftBox svg #giftLid{ transition:transform .3s ease-out; transform-origin:20% 100%; }
  @keyframes giftBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  #giftResult{ font-size:15px; font-weight:700; color:var(--gold); min-height:20px; margin-top:8px; }
  #giftContinueBtn{
    display:none; width:100%; margin-top:16px; padding:11px; border-radius:12px; border:none;
    background:var(--gold); color:#241A05; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* home screen */
  .home-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:8px; }
  .home-head{ text-align:center; margin-bottom:4px; }
  #wheelBox{ position:relative; width:min(78vw,280px); aspect-ratio:1/1; margin-top:18px; }
  #pointer{
    position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent;
    border-top:18px solid var(--gold); z-index:5; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  #wheel{
    width:100%; height:100%; border-radius:50%;
    background: conic-gradient(from 0deg,
      var(--gold) 0deg 60deg, var(--pink) 60deg 120deg, var(--gray) 120deg 180deg,
      var(--gold) 180deg 240deg, var(--pink) 240deg 300deg, var(--gray) 300deg 360deg);
    border:5px solid var(--card2);
    box-shadow:0 0 0 2px var(--border), 0 10px 30px rgba(0,0,0,0.4);
    position:relative; transform:rotate(0deg);
  }
  .seg{ position:absolute; inset:0; }
  .seg-icon{ position:absolute; top:13%; left:50%; }
  #hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:26%; height:26%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFE3A0, #F5B942 55%, #C98A2A 100%);
    border:3px solid var(--bgSoft); color:#2A1C05; font-weight:800; font-size:12px;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2;
  }
  #hub.hub-ad{
    font-size:9.5px; font-weight:800;
    background:radial-gradient(circle at 35% 30%, #BEEBFF, var(--blue) 55%, #1C7CA8 100%);
    color:#06222E;
  }
  #spinHint{ margin-top:22px; font-size:13px; color:var(--textMuted); }
  .legend{ display:flex; gap:14px; margin-top:18px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--textMuted); }

  /* task screen */
  .task-list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }

  /* AdsGram ad-task cards */
  .ad-task{
    --adsgram-task-font-size: 13.5px;
    --adsgram-task-icon-size: 42px;
    --adsgram-task-icon-title-gap: 12px;
    --adsgram-task-button-width: 76px;
    --adsgram-task-icon-border-radius: 10px;
    display:block;
    background:var(--card);
    border:1px solid var(--border);
    border-inline-start:3px solid var(--blue);
    border-radius:14px;
    padding:12px;
    font-family:'Manrope', sans-serif;
    color:var(--text);
  }
  .ad-task__reward{ display:block; font-size:11.5px; color:var(--textMuted); margin-top:2px; }
  .ad-task__btn{
    background:var(--blue); color:#06222E; border-radius:10px; padding:8px 0;
    font-size:12px; font-weight:700; text-align:center; cursor:pointer;
  }
  .ad-task__btn--claim{ background:var(--gold); color:#241A05; }
  .ad-task__btn--done{ background:transparent; border:1px solid var(--border); color:var(--textDim); }

  /* ad cooldown (neon countdown between ads) */
  .ad-cooldown{
    background:var(--card); border:1px solid var(--border); border-inline-start:3px solid #39FF88;
    border-radius:14px; padding:14px;
  }
  .ad-cooldown__top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .ad-cooldown__title{ font-size:13.5px; font-weight:600; }
  .ad-cooldown__sub{ font-size:11.5px; color:var(--textMuted); margin-top:2px; }
  .ad-cooldown__timer{
    font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; color:#39FF88;
    text-shadow:0 0 8px rgba(57,255,136,0.8);
  }
  .ad-cooldown__track{
    height:9px; border-radius:999px; background:rgba(255,255,255,0.08);
    overflow:hidden; position:relative;
  }
  .ad-cooldown__bar{
    height:100%; border-radius:999px; width:100%;
    background:linear-gradient(90deg,#39FF88,#34E0F1,#39FF88);
    background-size:200% 100%;
    box-shadow:0 0 10px 2px rgba(57,255,136,0.7), 0 0 18px 4px rgba(52,224,241,0.45);
    transition:width .25s linear;
    animation:neonShift 1.6s linear infinite;
  }
  @keyframes neonShift{ 0%{ background-position:0% 0; } 100%{ background-position:200% 0; } }

  /* daily link tasks */
  .task-card{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--border); border-radius:14px; padding:12px;
    border-inline-start:3px solid var(--pink);
  }
  .task-card.done{ opacity:.55; border-inline-start-color:var(--gray); }
  .task-info{ flex:1; }
  .task-info .t{ font-size:13.5px; font-weight:600; }
  .task-info .d{ font-size:11.5px; color:var(--textMuted); margin-top:3px; }
  .task-btn{
    display:flex; align-items:center; gap:5px; flex-shrink:0; background:var(--pink);
    color:#3A0E1E; border:none; border-radius:10px; padding:8px 12px; font-size:12px;
    font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .task-btn.done{ background:transparent; color:var(--textDim); border:1px solid var(--border); cursor:default; }

  /* shop screen */
  .shop-list{ display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .shop-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
  .shop-top{ display:flex; align-items:center; gap:10px; }
  .shop-icon{
    width:42px; height:42px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; background:rgba(52,179,241,0.12);
  }
  .shop-info{ flex:1; }
  .shop-info .t{ font-size:14px; font-weight:700; }
  .shop-info .d{ font-size:11.5px; color:var(--textMuted); margin-top:2px; }
  .shop-btn{
    width:100%; margin-top:12px; padding:10px; border-radius:10px; border:none;
    font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:6px;
  }
  .shop-btn.disabled{ background:var(--card2)!important; color:var(--textDim)!important; }
  .shop-btn:disabled{ cursor:default; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo"><span>Free</span><span class="pay">Pay</span></div>
    <div class="chips">
      <div class="chip" id="chipCoins"></div>
      <div class="chip" id="chipTickets"></div>
      <div class="chip" id="chipTon"></div>
    </div>
  </header>

  <div id="adsBanner"></div>

  <main id="main"></main>

  <nav>
    <button class="nav-btn" id="navHome" onclick="setTab('home')"></button>
    <button class="nav-btn" id="navTask" onclick="setTab('task')"></button>
    <button class="nav-btn" id="navShop" onclick="setTab('shop')"></button>
    <button class="nav-btn" id="navGame" onclick="setTab('game')"></button>
  </nav>

  <div id="toast"></div>

  <div id="modalOverlay">
    <div id="modalBox">
      <div id="modalIcon"></div>
      <div id="modalTitle"></div>
      <div id="modalSub"></div>
      <button id="modalBtn" class="tap" onclick="closeModal()">Got it</button>
    </div>
  </div>

  <div id="giftOverlay">
    <div id="giftCard">
      <div id="giftTitle">Welcome to FreePay!</div>
      <div id="giftSub">Tap the gift to open your welcome bonus</div>
      <div id="giftStage">
        <canvas id="giftParticles"></canvas>
        <div id="giftBox" class="tap" onclick="openGift()">
          <svg width="86" height="86" viewBox="0 0 64 64">
            <rect x="10" y="26" width="44" height="30" rx="4" fill="#F5B942" stroke="#B9822A" stroke-width="2"/>
            <rect x="10" y="26" width="44" height="8" fill="#FF5C8A"/>
            <rect id="giftLid" x="7" y="16" width="50" height="12" rx="4" fill="#FF5C8A" stroke="#C23A63" stroke-width="2"/>
            <rect x="29" y="16" width="6" height="40" fill="#B9822A"/>
          </svg>
        </div>
      </div>
      <div id="giftResult"></div>
      <button id="giftContinueBtn" class="tap" onclick="closeGiftOverlay()">Continue</button>
    </div>
  </div>

  <div id="adPreload" style="position:fixed; top:0; left:0; width:1px; height:1px; overflow:hidden; opacity:0.01; pointer-events:none; z-index:-1;"></div>

  <div id="tutorialOverlay" style="position:absolute; inset:0; pointer-events:none;"></div>
</div>

<script>
/* ---------- Telegram WebApp bootstrap ---------- */
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(TG){ try{ TG.ready(); TG.expand(); }catch(e){} }

/* ---------- per-account storage (keyed by numeric Telegram user id) ---------- */
function getUserId(){
  try{
    const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
    if(u && u.id) return String(u.id);
  }catch(e){}
  return "guest";
}
const USER_ID = getUserId();
const STORAGE_KEY = "freepay:" + USER_ID + ":state";

/* ---------- Supabase backend (same project/table used by the rest of FreePay) ----------
   `point` on `telusersinfo` is the shared coin balance, kept in sync with state.coins.
   `AdsWatch` is the shared lifetime ad counter. Everything else in this screen
   (tickets, TON, wheel position, daily counters, gift-claimed flag) has no column
   in the backend yet, so it's kept in localStorage only, per the per-account key above. */
const _supabase = window.supabase.createClient(
  'https://nomuylulsjtwjoinrxmr.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vbXV5bHVsc2p0d2pvaW5yeG1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU2NzgwOTgsImV4cCI6MjA2MTI1NDA5OH0.9Vgp9y1EQkbH2GooJgUmXjW4NEA-WY8keL4P5S1tiIc'
);

/* Creates/refreshes the row for this Telegram user, then pulls the real coin
   balance from the backend so it overrides whatever was cached locally. */
async function syncUserFromBackend(){
  if(USER_ID === 'guest') return;
  const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  try{
    await _supabase.from('telusersinfo').upsert({
      id: USER_ID,
      name: u ? u.first_name : null,
      username: u ? u.username : null,
      premium: u ? u.is_premium : null
    }, { onConflict: ['id'] });

    const { data: row, error } = await _supabase
      .from('telusersinfo')
      .select('point')
      .eq('id', USER_ID)
      .single();
    if(error) throw error;

    if(row && typeof row.point === 'number'){
      state.coins = row.point;
    } else {
      /* brand-new row with no point value yet: seed it with whatever we have locally */
      await _supabase.from('telusersinfo').update({ point: state.coins }).eq('id', USER_ID);
    }
    renderChips();
    if(state.tab === 'home' || state.tab === 'shop') renderMain();
  }catch(e){
    console.error('FreePay: could not reach backend, using local coin balance', e);
  }
}

/* Call right after state.coins changes locally, so the backend stays the source of truth. */
async function pushCoinsToBackend(){
  if(USER_ID === 'guest') return;
  try{
    await _supabase.from('telusersinfo').update({ point: state.coins }).eq('id', USER_ID);
  }catch(e){
    console.error('FreePay: could not save coins to backend', e);
  }
}

/* Fire-and-forget bump of the shared lifetime ad counter (does not block ticket reward UX). */
async function bumpAdsWatchedBackend(){
  if(USER_ID === 'guest') return;
  try{
    const { data: row } = await _supabase.from('telusersinfo').select('AdsWatch').eq('id', USER_ID).single();
    const next = (row && typeof row.AdsWatch === 'number' ? row.AdsWatch : 0) + 1;
    await _supabase.from('telusersinfo').update({ AdsWatch: next }).eq('id', USER_ID);
  }catch(e){
    console.error('FreePay: could not update AdsWatch on backend', e);
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  const isBrandNew = !raw;
  const base = {
    coins:0, tickets:0, ton:0, rotation:0, spinCount:0,
    dailyDate: todayStr(), adsWatchedToday:0, tasksDoneToday:{},
    giftClaimed: !isBrandNew /* returning users with older saves never see the welcome gift */
  };
  let saved = null;
  try{ saved = raw ? JSON.parse(raw) : null; }catch(e){}
  if(!saved) return base;
  const merged = Object.assign({}, base, saved);
  if(merged.dailyDate !== todayStr()){
    merged.dailyDate = todayStr();
    merged.adsWatchedToday = 0;
    merged.tasksDoneToday = {};
  }
  return merged;
}

function persistState(){
  const toSave = {
    coins: state.coins, tickets: state.tickets, ton: state.ton,
    rotation: state.rotation, spinCount: state.spinCount,
    dailyDate: state.dailyDate, adsWatchedToday: state.adsWatchedToday,
    tasksDoneToday: state.tasksDoneToday, giftClaimed: state.giftClaimed
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); }catch(e){}
}

/* ---------- palette ---------- */
const C = {
  gold:'#F5B942', goldDark:'#B9822A', pink:'#FF5C8A', gray:'#3A4066',
  grayLight:'#9AA1C9', blue:'#34B3F1', card:'#1B2044', bg:'#11152B'
};

/* ---------- sound effects (synthesized, no external files) ---------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function playTone(freq, duration, type, vol, delay){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol || 0.2, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}

/* ---------- lightweight particle burst (used by the welcome gift) ---------- */
function burstParticles(canvas, count){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w; canvas.height = h;
  const cx = w / 2, cy = h / 2;
  const colors = [C.gold, C.goldDark, C.pink, '#FFD24C'];
  const particles = [];
  for(let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 5.5;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2.5,
      life: 1,
      decay: 0.014 + Math.random() * 0.012,
      size: 2.5 + Math.random() * 3.5,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  function tick(){
    ctx.clearRect(0, 0, w, h);
    let alive = false;
    particles.forEach(p => {
      if(p.life <= 0) return;
      alive = true;
      p.vy += 0.16;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if(alive) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, w, h);
  }
  tick();
}

/* ---------- background ad preload (drives the "Tasks" nav dot) ---------- */
/* AdsGram's <adsgram-task> only fires reward / onError / onBannerNotFound /
   onTooLongSession — there is no official "ad finished loading" event.
   We approximate "loaded and ready to watch" by preloading a hidden probe
   instance for each block and treating "no error after ~2.5s" as ready. */
let adReadyState = {};   // blockId -> true/false
let dotVisible = false;
let prevAnyAdReady = false;
let adPreloadGeneration = 0; // bumped every time the active block changes, so old timers/listeners for the previous block become no-ops

function updateNavDot(){
  const anyReady = Object.values(adReadyState).some(Boolean);
  if(anyReady && !prevAnyAdReady && state.tab !== 'task') dotVisible = true;
  if(!anyReady) dotVisible = false;
  prevAnyAdReady = anyReady;
  renderNav();
}

function schedulePreload(t, delay, gen){
  setTimeout(()=>{
    if(gen !== adPreloadGeneration) return; // this block is no longer the active one — stop the chain
    const container = document.getElementById('adPreload');
    if(!container) return;
    const old = container.querySelector(`[data-block-id="${t.blockId}"]`);
    if(old) old.remove();

    const el = document.createElement('adsgram-task');
    el.setAttribute('data-block-id', t.blockId);
    el.setAttribute('data-debug', 'false');
    el.setAttribute('data-debug-console', 'false');
    el.innerHTML = `<span slot="reward"></span><div slot="button"></div><div slot="claim"></div><div slot="done"></div>`;

    let settled = false;
    el.addEventListener('onError', ()=>{ settled = true; if(gen !== adPreloadGeneration) return; adReadyState[t.blockId] = false; updateNavDot(); schedulePreload(t, 30000, gen); });
    el.addEventListener('onBannerNotFound', ()=>{ settled = true; if(gen !== adPreloadGeneration) return; adReadyState[t.blockId] = false; updateNavDot(); schedulePreload(t, 30000, gen); });
    el.addEventListener('onTooLongSession', ()=>{ settled = true; });
    el.addEventListener('reward', ()=>{ if(gen !== adPreloadGeneration) return; adReadyState[t.blockId] = false; updateNavDot(); schedulePreload(t, 3000, gen); });

    container.appendChild(el);

    setTimeout(()=>{
      if(gen !== adPreloadGeneration) return;
      if(!settled){ adReadyState[t.blockId] = true; updateNavDot(); }
    }, 2500);
  }, delay);
}

/* ---------- forced pause between block ads (anti-abuse + lets AdsGram register the click) ---------- */
const AD_COOLDOWN_MS = 15000;
let adCoolingDown = false;
let adCooldownStart = 0;

let adCooldownTimeout = null;

function adCooldownCard(){
  return `
    <div class="ad-cooldown">
      <div class="ad-cooldown__top">
        <div>

        </div>
        <div class="ad-cooldown__timer" id="adCooldownNum">${Math.ceil(AD_COOLDOWN_MS/1000)}</div>
      </div>
      <div class="ad-cooldown__track">
        <div class="ad-cooldown__bar" id="adCooldownBar"></div>
      </div>
    </div>`;
}

function updateAdCooldownUI(){
  const bar = document.getElementById('adCooldownBar');
  const num = document.getElementById('adCooldownNum');
  if(!bar || !num) return;
  const remain = Math.max(0, AD_COOLDOWN_MS - (Date.now() - adCooldownStart));
  bar.style.width = Math.max(0, (remain / AD_COOLDOWN_MS) * 100) + '%';
  num.textContent = Math.ceil(remain / 1000);
}

function startAdCooldown(){
  adCoolingDown = true;
  adCooldownStart = Date.now();
  if(adCooldownInterval) clearInterval(adCooldownInterval);
  if(adCooldownTimeout) clearTimeout(adCooldownTimeout);

  if(state.tab === 'task') renderMain();
  /* set the bar's initial width on the *next* frame so the CSS transition
     actually animates from 100% down, instead of snapping straight to 0 */
  requestAnimationFrame(()=>{
    const bar = document.getElementById('adCooldownBar');
    if(bar) bar.style.width = '100%';
    requestAnimationFrame(updateAdCooldownUI);
  });

  adCooldownInterval = setInterval(updateAdCooldownUI, 250);
  adCooldownTimeout = setTimeout(()=>{
    adCoolingDown = false;
    clearInterval(adCooldownInterval);
    adCooldownInterval = null;
    adCooldownTimeout = null;
    rotateActiveAdBlock();
  }, AD_COOLDOWN_MS);
}

/* Only ever preloads the single currently-active block — never both at once. */
function startPreloadForActiveBlock(){
  adPreloadGeneration++;
  const gen = adPreloadGeneration;
  const container = document.getElementById('adPreload');
  if(container) container.innerHTML = '';
  adReadyState = {};
  updateNavDot();
  schedulePreload(AD_TASKS[activeAdIndex], 0, gen);

function handleSpinWithAd(){
  if(state.spinning) return;
  if(state.tickets !== 4){
    handleSpin();
    return;
  }
  const controller = getSpinAdController();
  if(!controller){
    showToast('Ad module is not ready, try again in a moment');
    return;
  }
  playClickSound();
  const hub = document.getElementById('hub');
  if(hub) hub.disabled = true;

  controller.show().then(()=>{
    if(hub) hub.disabled = false;
    state.tickets -= 4;
    performSpin();
  }).catch(()=>{
    if(hub) hub.disabled = false;
    showToast('Ad was not completed, spin canceled');
  });
}

function performSpin(){
  state.spinCount += 1;
  persistState();
  renderChips();
  const n = state.spinCount;

  let idx, type, amount;
  if(n === 1){ idx=0; type='coin'; amount=10; }
  else if(n === 2){ idx=1; type='ticket'; amount=5; }
  else if(n === 3){ idx=3; type='coin'; amount=5; }
  else{
    idx = Math.floor(Math.random()*6);
    type = SEGMENTS[idx].type;
    if(type==='coin') amount = 3 + Math.floor(Math.random()*6);
    else if(type==='ticket') amount = 2 + Math.floor(Math.random()*6);
    else amount = 0;
  }

  const centerAngle = idx*60 + 30;
  const finalMod = (360 - centerAngle) % 360;
  const currentMod = ((state.rotation % 360) + 360) % 360;
  const delta = ((finalMod - currentMod) % 360 + 360) % 360;
  const extraSpins = 6;
  const nextRotation = state.rotation + extraSpins*360 + delta;

  state.spinning = true;
  state.rotation = nextRotation;

  const wheel = document.getElementById('wheel');
  wheel.style.transition = 'transform 4.2s cubic-bezier(.17,.67,.16,1)';
  wheel.style.transform = `rotate(${nextRotation}deg)`;

  const hub = document.getElementById('hub');
  if(hub){ hub.textContent = '...'; hub.disabled = true; }

  setTimeout(()=>{
    state.spinning = false;
    if(type === 'coin'){ state.coins += amount; pushCoinsToBackend(); }
    if(type === 'ticket') state.tickets += amount;
    renderChips();
    if(type !== 'blank') playClaimSound();
    if(state.tab === 'home') renderMain();
    openModal(type, amount);
  }, 4300);
}

/* ---------- AdsGram ad-task behavior ---------- */
function attachAdTaskListeners(){
  document.querySelectorAll('adsgram-task.ad-task').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    const reward = parseInt(el.dataset.reward || '1', 10);

    el.addEventListener('reward', ()=>{
      if(tutorialStep === 2) finishTutorial();
      state.tickets += reward;
      state.adsWatchedToday += 1;
      renderChips();
      renderAdsBanner();
      playClaimSound();
      showToast(`+${reward} ticket earned 🎫`);
      bumpAdsWatchedBackend();
      startAdCooldown();
    });
    el.addEventListener('onBannerNotFound', ()=>{
      showToast('No ad available right now, try again later');
      rotateActiveAdBlock();
    });
    el.addEventListener('onError', ()=>{
      showToast('Could not load the ad, try again later');
      rotateActiveAdBlock();
    });
    el.addEventListener('onTooLongSession', ()=>{
      showToast('Session expired, please reopen the app');
      rotateActiveAdBlock();
    });
  });
}

/* ---------- daily link task behavior ---------- */
function openExtraTask(id){
  const t = EXTRA_TASKS.find(x => x.id === id);
  if(!t || state.tasksDoneToday[t.id]) return;
  playClickSound();
  if(t.url.indexOf('https://t.me/') === 0){
    if(TG && TG.openTelegramLink) TG.openTelegramLink(t.url); else window.open(t.url, '_blank');
  } else {
    if(TG && TG.openLink) TG.openLink(t.url); else window.open(t.url, '_blank');
  }
  openedTasks[t.id] = true;
  if(state.tab === 'task') renderMain();
}

function claimExtraTask(id){
  const t = EXTRA_TASKS.find(x => x.id === id);
  if(!t || state.tasksDoneToday[t.id]) return;
  state.tasksDoneToday[t.id] = true;
  state.tickets += t.reward;
  renderChips();
  playClaimSound();
  showToast(`+${t.reward} ticket earned 🎫`);
  if(state.tab === 'task') renderMain();
}

/* ---------- shop behavior ---------- */
function withdrawOnce(){
  if(state.coins < 500){ showToast('You need at least 500 coins'); return; }
  playClickSound();
  state.coins -= 500;
  state.ton += 1;
  pushCoinsToBackend();
  renderChips();
  playClaimSound();
  showToast('1 TON Coin added to your wallet 💠');
  if(state.tab === 'shop') renderMain();
}
function buyTenPack(){
  if(state.coins < 4300){ showToast('Not enough coins'); return; }
  playClickSound();
  state.coins -= 4300;
  state.ton += 10;
  pushCoinsToBackend();
  renderChips();
  playClaimSound();
  showToast('You got 10 TON Coin 💠');
  if(state.tab === 'shop') renderMain();
}

/* ---------- onboarding tutorial (shown every launch while tickets < 4) ---------- */
let tutorialStep = 0;              // 0 = none, 1 = pointing at Tasks tab, 2 = pointing at the ad-task cards
let tutorialResizeHandler = null;

function maybeStartTutorial(){
  if(state.tickets < 4 && state.tab === 'home' && tutorialStep === 0){
    startTutorialStepNav();
  }
}

function clearTutorialOverlay(){
  const el = document.getElementById('tutorialOverlay');
  if(el) el.innerHTML = '';
  if(tutorialResizeHandler){ window.removeEventListener('resize', tutorialResizeHandler); tutorialResizeHandler = null; }
}

function paintSpotlight(rect, bubbleHtml, bubbleAbove){
  const overlay = document.getElementById('tutorialOverlay');
  if(!overlay) return;
  const appEl = document.getElementById('app');
  const appRect = appEl.getBoundingClientRect();
  const pad = 8;
  const hole = {
    left: Math.max(rect.left - appRect.left - pad, 0),
    top: Math.max(rect.top - appRect.top - pad, 0),
    right: Math.min(rect.right - appRect.left + pad, appRect.width),
    bottom: Math.min(rect.bottom - appRect.top + pad, appRect.height)
  };
  const appW = appRect.width, appH = appRect.height;

  overlay.innerHTML = `
    <div class="tut-mask-panel" style="left:0px; top:0px; width:${appW}px; height:${hole.top}px;"></div>
    <div class="tut-mask-panel" style="left:0px; top:${hole.bottom}px; width:${appW}px; height:${Math.max(appH-hole.bottom,0)}px;"></div>
    <div class="tut-mask-panel" style="left:0px; top:${hole.top}px; width:${hole.left}px; height:${hole.bottom-hole.top}px;"></div>
    <div class="tut-mask-panel" style="left:${hole.right}px; top:${hole.top}px; width:${Math.max(appW-hole.right,0)}px; height:${hole.bottom-hole.top}px;"></div>
    <div class="tut-highlight-ring" style="left:${hole.left}px; top:${hole.top}px; width:${hole.right-hole.left}px; height:${hole.bottom-hole.top}px;"></div>
  `;

  const bubble = document.createElement('div');
  bubble.className = 'tut-bubble';
  bubble.style.maxWidth = Math.min(appW-32, 260)+'px';
  bubble.innerHTML = bubbleHtml;
  overlay.appendChild(bubble);

  requestAnimationFrame(()=>{
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    let bLeft = hole.left + (hole.right-hole.left)/2 - bw/2;
    bLeft = Math.max(10, Math.min(bLeft, appW-bw-10));
    let bTop = bubbleAbove ? (hole.top - bh - 14) : (hole.bottom + 14);
    if(bTop < 10) bTop = hole.bottom + 14;
    if(bTop + bh > appH-10) bTop = Math.max(10, hole.top - bh - 14);
    bubble.style.left = bLeft+'px';
    bubble.style.top = bTop+'px';
  });
}

function startTutorialStepNav(){
  tutorialStep = 1;
  const target = document.getElementById('navTask');
  if(!target) return;
  const paint = ()=> paintSpotlight(target.getBoundingClientRect(), '👆 برای دیدن تسک‌ها اینجا بزن', true);
  paint();
  tutorialResizeHandler = ()=>{ if(tutorialStep === 1) paint(); };
  window.addEventListener('resize', tutorialResizeHandler);
}

function startTutorialStepTasks(){
  tutorialStep = 2;
  const mainEl = document.getElementById('main');
  if(mainEl) mainEl.scrollTop = 0;
  setTimeout(()=>{
    if(tutorialStep !== 2) return;
    const tasks = document.querySelectorAll('.ad-task');
    if(!tasks.length){ finishTutorial(); return; }
    const paint = ()=>{
      const first = tasks[0].getBoundingClientRect();
      const last = tasks[tasks.length-1].getBoundingClientRect();
      const rect = {
        left: Math.min(first.left, last.left), right: Math.max(first.right, last.right),
        top: Math.min(first.top, last.top), bottom: Math.max(first.bottom, last.bottom)
      };
      paintSpotlight(rect, '👆 روی یکی از این تبلیغ‌ها بزن تا بلیط بگیری', false);
    };
    paint();
    tutorialResizeHandler = ()=>{ if(tutorialStep === 2) paint(); };
    window.addEventListener('resize', tutorialResizeHandler);
  }, 260);
}

function finishTutorial(){
  if(tutorialStep === 0) return;
  tutorialStep = 0;
  clearTutorialOverlay();
}

/* ---------- init ---------- */
renderChips();
renderAdsBanner();
renderNav();
renderMain();
initAdPreload();
if(!state.giftClaimed) showGiftOverlay(); else maybeStartTutorial();
syncUserFromBackend(); /* refreshes state.coins from Supabase once it responds; local value renders first so there's no blank flash */
</script>
