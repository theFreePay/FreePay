<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreePay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#11152B; --bgSoft:#161B36; --card:#1B2044; --card2:#20264C;
    --border:rgba(255,255,255,0.07); --text:#F3EFE3; --textMuted:#9098C2; --textDim:#6A7099;
    --gold:#F5B942; --goldDark:#B9822A; --pink:#FF5C8A; --pinkDark:#C23A63;
    --gray:#3A4066; --grayLight:#9AA1C9; --blue:#34B3F1; --blueLight:#7FD4FA; --star:#FFD24C;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family:'Manrope', sans-serif; color:var(--text);
    display:flex; justify-content:center; min-height:100vh;
  }
  button{ font-family:inherit; }
  .tap:active{ transform:scale(0.96); }

  @keyframes popIn{ from{opacity:0; transform:translateY(10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes floatToast{ from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);} }

  #app{
    width:100%; max-width:430px; height:100vh; max-height:900px;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.4);
  }

  /* header */
  header{ padding:16px 16px 10px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-size:20px; font-weight:800; }
  .logo .pay{ color:var(--gold); }
  .chips{ display:flex; gap:6px; }
  .chip{
    display:flex; align-items:center; gap:5px; background:var(--card);
    border:1px solid var(--border); border-radius:999px; padding:5px 10px 5px 9px;
    font-size:13px; font-weight:600;
  }
  .chip span{ font-variant-numeric:tabular-nums; }

  /* ads-watched banner */
  .ads-banner{
    margin:0 16px 8px; padding:9px 12px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--textMuted);
  }
  .ads-banner b{ color:var(--text); font-variant-numeric:tabular-nums; }

  /* body / screens */
  main{ flex:1; overflow-y:auto; padding:6px 16px 16px; }
  .screen-title{ font-size:15px; font-weight:700; }
  .screen-sub{ font-size:12px; color:var(--textMuted); margin-top:2px; }
  .section-label{ font-size:11.5px; color:var(--textDim); margin:16px 0 8px; }

  /* bottom nav */
  nav{
    display:flex; border-top:1px solid var(--border); background:var(--bgSoft);
    padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  }
  .nav-btn{
    position:relative; flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:6px 0; cursor:pointer;
  }
  .nav-btn span{ font-size:11px; color:var(--textDim); font-weight:500; }
  .nav-btn.active span{ color:var(--gold); font-weight:700; }
  .nav-dot{
    position:absolute; top:2px; right:calc(50% - 20px); width:8px; height:8px;
    border-radius:50%; background:var(--star); box-shadow:0 0 0 2px var(--bgSoft);
    animation:popIn .2s ease-out;
  }

  /* toast */
  #toast{
    position:absolute; top:70px; left:50%; animation:floatToast .2s ease-out;
    background:var(--card2); border:1px solid var(--border); padding:8px 16px;
    border-radius:999px; font-size:13px; white-space:nowrap; z-index:60; display:none;
  }


  /* modal */
  #modalOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.72);
    display:none; align-items:center; justify-content:center; z-index:40;
  }
  #modalBox{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:28px 26px; width:260px; text-align:center; animation:popIn .25s ease-out;
  }
  #modalIcon{ display:flex; justify-content:center; margin-bottom:14px; }
  #modalTitle{ font-size:17px; font-weight:700; margin-bottom:4px; }
  #modalSub{ font-size:13px; color:var(--textMuted); margin-bottom:18px; }
  #modalBtn{
    width:100%; padding:11px; border-radius:12px; border:none;
    background:var(--gold); color:#241A05; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* welcome gift overlay */
  #giftOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.88);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #giftCard{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:30px 24px; width:270px; text-align:center; animation:popIn .3s ease-out;
    position:relative; overflow:visible;
  }
  #giftTitle{ font-size:17px; font-weight:800; margin-bottom:4px; }
  #giftSub{ font-size:13px; color:var(--textMuted); margin-bottom:6px; }
  #giftStage{ position:relative; width:140px; height:140px; margin:14px auto 6px; }
  #giftParticles{ position:absolute; inset:-40px; pointer-events:none; }
  #giftBox{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; animation:giftBounce 1.6s ease-in-out infinite;
  }
  #giftBox.opened{ animation:none; transform:scale(1.12); transition:transform .25s ease-out; }
  #giftBox.opened svg #giftLid{ transform:translateY(-14px) rotate(-8deg); }
  #giftBox svg #giftLid{ transition:transform .3s ease-out; transform-origin:20% 100%; }
  @keyframes giftBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  #giftResult{ font-size:15px; font-weight:700; color:var(--gold); min-height:20px; margin-top:8px; }
  #giftContinueBtn{
    display:none; width:100%; margin-top:16px; padding:11px; border-radius:12px; border:none;
    background:var(--gold); color:#241A05; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* ---------- daily reward overlay ---------- */
  #dailyRewardOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.9);
    display:none; align-items:center; justify-content:center; z-index:51;
  }
  #dailyRewardCard{
    background:linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid rgba(245,185,66,0.35); border-radius:24px;
    padding:28px 24px 24px; width:280px; text-align:center; animation:popIn .32s ease-out;
    position:relative; overflow:visible;
    box-shadow:0 0 0 1px rgba(245,185,66,0.08), 0 18px 50px rgba(0,0,0,0.55);
  }
  #dailyRewardTitle{ font-size:18px; font-weight:800; letter-spacing:.3px; }
  #dailyRewardTitle .pay{ color:var(--gold); }
  #dailyRewardSub{ font-size:13px; color:var(--textMuted); margin-top:4px; margin-bottom:4px; }
  #dailyRewardStage{ position:relative; width:150px; height:150px; margin:16px auto 4px; }
  #dailyRewardParticles{ position:absolute; inset:-40px; width:calc(100% + 80px); height:calc(100% + 80px); pointer-events:none; }
  #dailyRewardBox{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; animation:giftBounce 1.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 16px rgba(245,185,66,0.35));
  }
  #dailyRewardBox.opened{ animation:none; transform:scale(1.12); transition:transform .25s ease-out; }
  #dailyRewardBox.opened svg #dailyRewardLid{ transform:translateY(-14px) rotate(-8deg); }
  #dailyRewardBox svg #dailyRewardLid{ transition:transform .3s ease-out; transform-origin:20% 100%; }
  #dailyRewardGlow{
    position:absolute; inset:8px; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(245,185,66,0.35), transparent 70%);
    animation:dailyGlowPulse 1.8s ease-in-out infinite;
  }
  @keyframes dailyGlowPulse{ 0%,100%{ opacity:.5; transform:scale(0.9);} 50%{ opacity:1; transform:scale(1.08);} }
  #dailyRewardResult{ font-size:17px; font-weight:800; color:var(--gold); min-height:22px; margin-top:6px; }
  #dailyRewardOpenBtn{
    display:block; width:100%; margin-top:16px; padding:13px; border-radius:14px; border:none;
    background:linear-gradient(135deg, var(--gold), var(--goldDark)); color:#241A05;
    font-weight:800; font-size:15px; letter-spacing:.4px; cursor:pointer;
    box-shadow:0 8px 20px rgba(245,185,66,0.35);
  }
  #dailyRewardButtons{ display:none; flex-direction:column; gap:9px; margin-top:16px; }
  #dailyRewardAdBtn{
    width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#2ecc71,#27ae60); color:#06301B;
    font-weight:800; font-size:14.5px; letter-spacing:.3px;
    box-shadow:0 8px 20px rgba(46,204,113,0.35);
  }
  #dailyRewardAdBtn:disabled{ opacity:.55; cursor:default; }
  #dailyRewardAdBtn small{ display:block; font-size:11px; font-weight:600; opacity:.85; margin-top:2px; }
  #dailyRewardClaimBtn{
    width:100%; padding:8px; border:none; background:none; cursor:pointer;
    color:var(--textMuted); font-weight:600; font-size:12.5px;
  }


  /* ---------- out-of-coins offer ---------- */

  /* big-win share popup */
  #shareWinOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.78);
    display:none; align-items:center; justify-content:center; z-index:56;
  }
  #shareWinCard{
    position:relative; background:linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid rgba(245,185,66,0.4); border-radius:24px;
    padding:26px 20px 16px; width:290px; max-width:calc(100% - 32px); text-align:center; animation:popIn .3s ease-out;
    box-shadow:0 0 0 1px rgba(245,185,66,0.08), 0 18px 50px rgba(0,0,0,0.55);
  }
  #shareWinX{
    position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.08); color:var(--textMuted); font-size:15px; cursor:pointer; line-height:1;
  }
  #shareWinTitle{ font-size:20px; font-weight:800; }
  #shareWinWon{ font-size:16px; font-weight:800; color:var(--gold); margin-top:6px; }
  #shareWinSub{ font-size:12.5px; color:var(--textMuted); margin:8px 0 16px; line-height:1.45; }
  #shareWinBtn{
    width:100%; padding:13px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--gold), var(--goldDark)); color:#241A05; font-weight:800; font-size:15px;
  }
  #shareWinLater{ width:100%; margin-top:6px; padding:10px; background:none; border:none; color:var(--textMuted); font-size:13px; cursor:pointer; }
  #coinOfferOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.8);
    display:none; align-items:center; justify-content:center; z-index:55;
  }
  #coinOfferCard{
    background:linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid rgba(245,185,66,0.35); border-radius:24px;
    padding:24px 20px 14px; width:290px; max-width:calc(100% - 32px); text-align:center; animation:popIn .3s ease-out;
    box-shadow:0 0 0 1px rgba(245,185,66,0.08), 0 18px 50px rgba(0,0,0,0.55);
  }
  #coinOfferIcon{ display:flex; justify-content:center; margin-bottom:8px; filter:drop-shadow(0 6px 14px rgba(245,185,66,0.4)); }
  #coinOfferTitle{ font-size:19px; font-weight:800; }
  #coinOfferSub{ font-size:12.5px; color:var(--textMuted); margin:4px 0 16px; }
  .offer-btn{
    display:block; width:100%; padding:13px 10px; border-radius:14px; border:none; cursor:pointer;
    font-weight:800; font-size:14px; letter-spacing:.2px; margin-bottom:9px; line-height:1.3;
  }
  .offer-btn:disabled{ opacity:.55; cursor:default; }
  .offer-btn.one{ background:linear-gradient(135deg,#2ecc71,#27ae60); color:#06301B; box-shadow:0 8px 20px rgba(46,204,113,0.3); }
  .offer-btn.three{ background:linear-gradient(135deg,var(--gold),var(--goldDark)); color:#241A05; box-shadow:0 8px 20px rgba(245,185,66,0.3); }
  #coinOfferSkip{ width:100%; padding:9px; border:none; background:none; cursor:pointer; color:var(--textMuted); font-weight:600; font-size:13px; }

  /* ---------- game mode panel (fun / coins) ---------- */
  #modeOverlay{
    position:absolute; inset:0; background:rgba(6,8,20,0.72);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:57;
  }
  #modeCard{
    --a:245,185,66;
    position:relative; display:flex; align-items:stretch; width:calc(100% - 28px); max-width:420px; min-height:300px;
    border-radius:28px; overflow:hidden; animation:popIn .3s ease-out;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(var(--a),.20), transparent 60%),
      linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 0 0 1px rgba(var(--a),.28), 0 24px 60px rgba(0,0,0,.6), 0 0 60px -14px rgba(var(--a),.6);
  }
  .mp-left{ flex:1 1 60%; min-width:0; display:flex; flex-direction:column; padding:22px 4px 16px 18px; position:relative; z-index:1; }
  .mp-name{ font-size:23px; font-weight:800; line-height:1.1; letter-spacing:-.2px; }
  .mp-name::after{ content:''; display:block; width:30px; height:3px; border-radius:3px; margin-top:9px; background:rgb(var(--a)); box-shadow:0 0 12px rgba(var(--a),.8); }
  .mp-desc{ font-size:12.5px; color:var(--textMuted); line-height:1.55; margin:12px 0 16px; }
  .mp-actions{ margin-top:auto; display:flex; gap:8px; align-items:flex-start; }
  .mp-opt{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .mp-btn{
    display:flex; align-items:center; justify-content:center; gap:5px; width:100%; min-height:38px; padding:6px 8px;
    border-radius:12px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:800; line-height:1.1; text-align:center;
    border:1px solid transparent;
  }
  .mp-btn i{ font-style:normal; font-size:13px; flex:0 0 auto; display:flex; }
  .mp-btn.fun{ background:rgba(var(--a),.16); border-color:rgba(var(--a),.5); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
  .mp-btn.coins{ background:linear-gradient(135deg,var(--gold),var(--goldDark)); color:#241A05; box-shadow:0 6px 16px rgba(245,185,66,.28); }
  .mp-cap{ font-size:10px; line-height:1.3; color:var(--textMuted); text-align:center; padding:0 2px; }
  .mp-right{ flex:0 0 40%; position:relative; overflow:hidden; background:#050914; }
  .mp-right svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .mp-right::before{   /* soft fade into the card on the left edge */
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(90deg, var(--card) 0%, rgba(0,0,0,0) 38%), linear-gradient(0deg, rgba(5,9,20,.55) 0%, rgba(0,0,0,0) 35%);
  }
  .mp-x{
    position:absolute; top:10px; right:10px; z-index:3; width:28px; height:28px; border-radius:50%;
    border:1px solid rgba(255,255,255,.18); background:rgba(10,12,28,.45); color:#fff; font-size:12px; cursor:pointer; line-height:1;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #funBadge{
    position:absolute; top:3px; left:50%; transform:translateX(-50%); z-index:40; display:none; pointer-events:none;
    padding:2px 10px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    background:rgba(34,211,238,.16); border:1px solid rgba(34,211,238,.6); color:#7be9fa;
  }
  .chip.fun{ outline:1px dashed rgba(34,211,238,.75); outline-offset:1px; }

  /* ---------- Home lobby (game cards) ---------- */
  .game-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:stretch; padding:2px 0 8px; }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px) scale(.96); } to{ opacity:1; transform:none; } }
  .game-card{
    --a:245,185,66;                                   /* per-game accent (r,g,b) */
    position:relative; display:block; width:100%; padding:0; margin:0; border:0; border-radius:22px;
    text-align:left; color:var(--text); cursor:pointer; overflow:hidden; isolation:isolate; background:#0b0e1f;
    box-shadow:0 12px 26px rgba(0,0,0,.38), 0 0 0 1px rgba(255,255,255,.07), 0 0 26px -6px rgba(var(--a),.30);
    transition:transform .18s ease, box-shadow .25s ease;
    animation:cardIn .5s cubic-bezier(.2,.9,.3,1) both;
    -webkit-tap-highlight-color:transparent;
  }
  .game-card:nth-child(1){ animation-delay:.02s } .game-card:nth-child(2){ animation-delay:.07s }
  .game-card:nth-child(3){ animation-delay:.12s } .game-card:nth-child(4){ animation-delay:.17s }
  .game-card:nth-child(5){ animation-delay:.22s } .game-card:nth-child(6){ animation-delay:.27s }
  .game-card:nth-child(n+7){ animation-delay:.32s }
  .game-card:active{ transform:scale(.965); box-shadow:0 6px 16px rgba(0,0,0,.4), 0 0 0 1px rgba(var(--a),.55), 0 0 30px -4px rgba(var(--a),.55); }
  /* glossy rim + soft accent light in the top corner */
  .game-card::before{
    content:''; position:absolute; inset:0; z-index:3; pointer-events:none; border-radius:inherit;
    background:radial-gradient(120% 70% at 0% 0%, rgba(var(--a),.28), transparent 55%),
               linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 28%);
    opacity:.9;
  }
  .game-card::after{
    content:''; position:absolute; inset:0; z-index:4; pointer-events:none; border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.09), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .game-card.crash  { --a:139,92,246; }
  .game-card.chicken{ --a:46,204,113; }
  .game-card.slot   { --a:217,70,239; }
  .game-card.sling  { --a:255,138,61; }
  .game-card.mines  { --a:34,211,238; }
  .game-card.cross  { --a:250,204,21; }
  .game-card.draw   { --a:255,107,74; }
  .gc-shot{ position:relative; width:100%; aspect-ratio:19/15; overflow:hidden; background:#0b0e1f; }
  .gc-shot svg{ position:absolute; inset:0; width:100%; height:100%; display:block; transition:transform .5s ease; }
  .game-card:active .gc-shot svg{ transform:scale(1.05); }
  .gc-shot::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:62%; pointer-events:none;
    background:linear-gradient(180deg, rgba(11,14,31,0) 0%, rgba(11,14,31,.55) 45%, rgba(11,14,31,.94) 100%);
  }
  .gc-body{
    position:absolute; left:0; right:0; bottom:0; z-index:2; padding:0 8px 8px 13px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .gc-name{
    font-size:15px; font-weight:800; letter-spacing:-.015em; line-height:1.15; min-width:0;
    text-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  .gc-play{
    flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(145deg,#FFD679,var(--gold) 55%,var(--goldDark)); color:#241A05;
    box-shadow:0 6px 14px rgba(245,185,66,.35), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .2s ease;
  }
  .gc-play svg{ width:15px; height:15px; margin-left:2px; display:block; }
  .game-card:active .gc-play{ transform:scale(1.12); }
  /* an odd last card becomes a full-width featured banner */
  .game-card:last-child:nth-child(odd){ grid-column:1 / -1; }
  .game-card:last-child:nth-child(odd) .gc-shot{ aspect-ratio:19/9; }
  .game-card:last-child:nth-child(odd) .gc-body{ padding:0 12px 12px 16px; }
  .game-card:last-child:nth-child(odd) .gc-name{ font-size:18px; }
  .game-card:last-child:nth-child(odd) .gc-play{ width:40px; height:40px; }
  .game-card:last-child:nth-child(odd) .gc-play svg{ width:17px; height:17px; }
  @media (prefers-reduced-motion:reduce){ .game-card{ animation:none; } .gc-shot svg, .gc-play{ transition:none; } }
  /* ---------- Game loading screen ----------
     Only transform / opacity are animated (no blur, no filters, no layout work), so the browser runs everything on the GPU
     and it stays smooth even while the game itself is booting on the main thread. */
  #gameLoader{
    --a:245,185,66; --c1:#1B2044;
    position:absolute; inset:0; z-index:35; display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; padding:24px 28px calc(env(safe-area-inset-bottom,0px) + 24px); contain:layout paint;
    background:linear-gradient(180deg,var(--c1) 0%, #0B0F22 82%);
    visibility:hidden; opacity:0; pointer-events:none; transition:opacity .35s ease, visibility 0s linear .35s;
  }
  #gameLoader.on{ visibility:visible; opacity:1; pointer-events:auto; transition:opacity .15s ease; }
  .gl-glow{
    position:absolute; left:50%; top:40%; width:150%; aspect-ratio:1; margin:-75% 0 0 -75%; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(closest-side, rgba(var(--a),.45), rgba(var(--a),0)); animation:glBreath 4.2s ease-in-out infinite; will-change:transform,opacity;
  }
  .gl-brand{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 22px); left:0; right:0; z-index:2; text-align:center; font-size:15px; font-weight:800; opacity:.8; letter-spacing:.01em; }
  .gl-brand b{ color:var(--gold); font-weight:800; }
  .gl-parts{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .gl-parts i, .gl-parts u{ position:absolute; bottom:-44px; opacity:0; animation:glRise linear infinite; will-change:transform,opacity; }
  .gl-parts i{ font-style:normal; line-height:1; }
  .gl-parts u{ text-decoration:none; border-radius:50%; background:rgba(var(--a),.95); box-shadow:0 0 10px 2px rgba(var(--a),.55); }
  #gameLoader.fall .gl-parts i, #gameLoader.fall .gl-parts u{ bottom:auto; top:-44px; animation-name:glFall; }
  @keyframes glRise{ 0%{ transform:translate3d(0,0,0) rotate(0); opacity:0; } 12%{ opacity:.95; } 85%{ opacity:.85; } 100%{ transform:translate3d(var(--dx),-112vh,0) rotate(var(--rot)); opacity:0; } }
  @keyframes glFall{ 0%{ transform:translate3d(0,0,0) rotate(0); opacity:0; } 12%{ opacity:.95; } 85%{ opacity:.85; } 100%{ transform:translate3d(var(--dx),112vh,0) rotate(var(--rot)); opacity:0; } }
  @keyframes glBreath{ 0%,100%{ transform:scale(.9); opacity:.7; } 50%{ transform:scale(1.08); opacity:1; } }

  .gl-center{ position:relative; z-index:2; width:100%; max-width:290px; display:flex; flex-direction:column; align-items:center; }
  .gl-hero{ position:relative; width:100%; }
  .gl-ring{
    position:absolute; inset:0; border-radius:32px; border:2px solid rgba(var(--a),.6); opacity:0; pointer-events:none;
    animation:glRing 2.6s ease-out infinite; will-change:transform,opacity;
  }
  .gl-ring + .gl-ring{ animation-delay:1.3s; }
  @keyframes glRing{ 0%{ transform:scale(1); opacity:.7; } 100%{ transform:scale(1.3); opacity:0; } }
  .gl-frame{
    position:relative; padding:6px; border-radius:32px; will-change:transform; animation:glFloat 3.6s ease-in-out infinite;
    background:linear-gradient(160deg, rgba(255,255,255,.26), rgba(255,255,255,.06));
    box-shadow:0 26px 50px rgba(0,0,0,.5), 0 0 60px -6px rgba(var(--a),.65);
  }
  @keyframes glFloat{ 0%,100%{ transform:translate3d(0,0,0) rotate(-1deg); } 50%{ transform:translate3d(0,-8px,0) rotate(1deg); } }
  .gl-art{ position:relative; border-radius:26px; overflow:hidden; aspect-ratio:19/14; background:#0b0e1f; }
  .gl-art svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .gl-art::after{
    content:''; position:absolute; top:0; bottom:0; left:-60%; width:45%; will-change:transform;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.3), transparent);
    transform:translate3d(0,0,0) skewX(-14deg); animation:glShine 2.6s ease-in-out infinite;
  }
  @keyframes glShine{ 0%{ transform:translate3d(0,0,0) skewX(-14deg); } 55%,100%{ transform:translate3d(480%,0,0) skewX(-14deg); } }
  .gl-name{ margin-top:30px; font-size:28px; font-weight:800; letter-spacing:-.025em; text-align:center; text-shadow:0 4px 20px rgba(0,0,0,.5); }
  .gl-bar{ position:relative; width:100%; height:6px; margin-top:22px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; }
  .gl-fill{
    position:absolute; inset:0; border-radius:inherit; overflow:hidden; transform-origin:left center; transform:scaleX(0); will-change:transform;
    background:linear-gradient(90deg, rgba(var(--a),.95), #FFE29A);
  }
  .gl-fill::after{
    content:''; position:absolute; top:0; bottom:0; left:-40%; width:40%; will-change:transform;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation:glSweep 1.1s linear infinite;
  }
  @keyframes glSweep{ from{ transform:translate3d(0,0,0); } to{ transform:translate3d(360%,0,0); } }
  .gl-row{ width:100%; margin-top:12px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:var(--textMuted); }
  .gl-row b{ color:var(--text); font-variant-numeric:tabular-nums; }
  .gl-dots{ display:inline-flex; gap:3px; margin-left:5px; vertical-align:middle; }
  .gl-dots i{ width:4px; height:4px; border-radius:50%; background:currentColor; opacity:.4; animation:glBounce 1s ease-in-out infinite; }
  .gl-dots i:nth-child(2){ animation-delay:.15s; } .gl-dots i:nth-child(3){ animation-delay:.3s; }
  @keyframes glBounce{ 0%,60%,100%{ transform:translate3d(0,0,0); opacity:.4; } 30%{ transform:translate3d(0,-4px,0); opacity:1; } }
  @media (prefers-reduced-motion:reduce){ #gameLoader *, #gameLoader *::after{ animation:none !important; } }

  .back-row{ display:flex; align-items:center; gap:10px; flex:none; height:30px; margin-bottom:4px; }
  .back-btn{ background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:4px 12px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .back-row > span{ font-size:13px; font-weight:700; color:var(--textMuted); }

  #chickenHost .back-row, #slotHost .back-row, #slingHost .back-row, #minesHost .back-row, #crossHost .back-row, #drawHost .back-row{ padding:0 16px; }

  .back-btn.home-btn{

  /* ---------- Crash game ---------- */
  main.crash-tab{ display:flex; flex-direction:column; padding:4px 12px 10px; }
  #crashRoot{
    --rows:4; --rowh:25px;
    --bg0:#11152B; --bg1:#1b1445; --panel:#1B2044; --panel2:#20264C; --line:#323a70;
    --ink:#F3EFE3; --mute:#9098C2; --or:#F5B942; --or2:#FFD27A; --grn:#35d07f; --red:#ff5468; --gold:#ffd36b;
    flex:1; min-height:480px; width:100%; display:flex; flex-direction:column; gap:6px;
    font-family:inherit; color:var(--ink);
  }
  @media (max-height:780px){ #crashRoot{ --rows:3; } }
  @media (max-height:680px){ #crashRoot{ --rows:2; } }

  #crashRoot .stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
  #crashRoot .st{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;line-height:1.25}

  #crashRoot .st b.down{color:#ff8a96}
  #crashRoot .coin-unused{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e8a92b 60%,#a9741a);flex:none}
  #crashRoot .histrow{display:flex;align-items:center;gap:8px;height:24px}
  #crashRoot .round{font-size:11px;color:var(--mute);white-space:nowrap}
  #crashRoot .hist{display:flex;gap:4px;flex:1;overflow:hidden;min-width:0}
  #crashRoot .hb{flex:none;height:22px;padding:0 7px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:800;direction:ltr;
  background:rgba(0,0,0,.3);border:1px solid var(--line)}
  #crashRoot .hb.lo{color:#ff8a96}
  #crashRoot .hb.mid{color:#7dffb8}
  #crashRoot .hb.hi{color:var(--gold);border-color:rgba(255,211,107,.6)}
  #crashRoot .wrap{flex:1;min-height:140px;position:relative;display:grid;place-items:center;overflow:hidden}
  #crashRoot .stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px var(--line),0 8px 24px rgba(0,0,0,.5)}
  #crashRoot canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #crashRoot .hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--s) * .045)}
  #crashRoot .mult{font-weight:800;font-size:calc(var(--s) * .165);line-height:1.05;direction:ltr;font-variant-numeric:tabular-nums;
  text-shadow:0 calc(var(--s) * .01) 0 rgba(10,6,30,.55),0 0 16px rgba(10,6,30,.45);transition:color .2s}
  #crashRoot .mult small{font-size:.38em;margin-inline-start:.15em;opacity:.85;font-weight:700}
  #crashRoot .sub{font-size:calc(var(--s) * .038);font-weight:700;text-shadow:0 1px 0 rgba(10,6,30,.7),0 0 8px rgba(10,6,30,.6);margin-top:2px}
  #crashRoot .res{position:absolute;left:50%;bottom:calc(var(--s) * .035);transform:translate(-50%,10px);opacity:0;padding:6px 16px;border-radius:999px;
  font-weight:800;font-size:calc(var(--s) * .042);white-space:nowrap;direction:ltr;transition:opacity .25s,transform .25s;
  background:var(--grn);color:#052a17;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  #crashRoot .res.show{opacity:1;transform:translate(-50%,0)}
  #crashRoot .res.lose{background:#5d1830;color:#ffd5dc}
  #crashRoot .res.info{background:rgba(10,6,30,.8);color:var(--ink);border:1px solid var(--line)}
  #crashRoot .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;flex:none}
  #crashRoot .r1{display:flex;gap:6px;align-items:flex-end}
  #crashRoot .fld{display:flex;flex-direction:column;gap:2px;min-width:0}

  #crashRoot .fld.b{flex:1}
  #crashRoot .fld.a{width:92px}
  #crashRoot input{width:100%;height:34px;background:var(--bg0);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font:800 16px 'Manrope',sans-serif;text-align:center;direction:ltr;padding:0 6px;-webkit-user-select:text;user-select:text}
  #crashRoot input:focus-visible,#crashRoot button:focus-visible{outline:2px solid var(--or2);outline-offset:2px}

  #crashRoot .sq:active{background:#3a2f80}
  #crashRoot .act{height:50px;border-radius:14px;border:0;font:800 17px 'Manrope',sans-serif;cursor:pointer;color:#2a1600;
  background:linear-gradient(#ffc24d,var(--or));box-shadow:0 5px 0 #B9822A;transition:transform .08s,box-shadow .08s}
  #crashRoot .act:active{transform:translateY(4px);box-shadow:0 1px 0 #B9822A}
  #crashRoot .act.cash{color:#042a17;background:linear-gradient(#5cf0a0,var(--grn));box-shadow:0 5px 0 #14884f;animation:cr_pulse .8s ease-in-out infinite}
  #crashRoot .act.cash:active{box-shadow:0 1px 0 #14884f}
  @keyframes cr_pulse{50%{filter:brightness(1.18)}}

  @keyframes cr_in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#crashRoot .rw,#crashRoot .act.cash{animation:none}}

  /* task screen */
  .task-list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }

  /* AdsGram ad-task cards */
  .ad-task{
    --adsgram-task-font-size: 13.5px;

/* ---------- per-account storage (keyed by numeric Telegram user id) ---------- */
function getUserId(){
  try{
    const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
    if(u && u.id) return String(u.id);
  }catch(e){}
  return "guest";
}
const USER_ID = getUserId();

/* ---------- play mode: 'real' = the user's own coins, 'fun' = demo balance that never touches the real wallet ---------- */
const FUN_START = 5000;                 /* demo balance every time a game is entered in fun mode */

let betMode = 'real';                   /* mode of the LAST bet: its payout/refund goes back to the same place */

/* ---------- languages: English / Русский / Deutsch ---------- */
const LANGS = {
  en: { name:'English' },
  ru: { name:'Русский' },
  de: { name:'Deutsch' }
};
const LANG_STORAGE_KEY = "freepay:" + USER_ID + ":lang";
function getSavedLang(){
  try{ const v = localStorage.getItem(LANG_STORAGE_KEY); return LANGS[v] ? v : null; }catch(e){ return null; }
}
function saveLang(l){ try{ localStorage.setItem(LANG_STORAGE_KEY, l); }catch(e){} }
function detectLang(){
  let c = '';
  try{
    const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
    c = (u && u.language_code) || navigator.language || '';
  }catch(e){}
  c = String(c).slice(0, 2).toLowerCase();
  return LANGS[c] ? c : 'en';
}

const PLURAL_RULE = {
  en: n => n === 1 ? 0 : 1,
  de: n => n === 1 ? 0 : 1,
  ru: n => {
    if(!Number.isInteger(n)) return 1;
    const a = n % 10, b = n % 100;
    if(a === 1 && b !== 11) return 0;
    if(a >= 2 && a <= 4 && !(b >= 12 && b <= 14)) return 1;
    return 2;
  }
};
const COIN_FORMS = { en:['coin','coins'], de:['Münze','Münzen'], ru:['монета','монеты','монет'] };

  const forms = COIN_FORMS[LANG] || COIN_FORMS.en;
  const i = (PLURAL_RULE[LANG] || PLURAL_RULE.en)(Number(n));

/* translate a key; {n} {c} {x} ... are filled from vars. {c} = the right form of "coin" for {n}. */
function tt(key, vars){
  let str = I18N[LANG] && I18N[LANG][key];
  if(str === undefined) str = I18N.en[key];
  if(str === undefined) return key;
  const v = Object.assign({}, vars || {});
  if(v.c === undefined && v.n !== undefined && v.n !== '' && isFinite(Number(v.n))) v.c = coinWord(Number(v.n));
  return str.replace(/\{(\w+)\}/g, (m, k) => v[k] !== undefined ? v[k] : m);
}
/* set an element's text AND remember the key, so it can be re-translated when the language changes */
function setI(el, key, vars){
  if(!el) return;
  el.dataset.i18n = key;
  if(vars) el.dataset.i18nVars = JSON.stringify(vars); else delete el.dataset.i18nVars;
  el.textContent = tt(key, vars);
}
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    let vars; try{ vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : undefined; }catch(e){}
    el.textContent = tt(el.dataset.i18n, vars);
  });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', tt(el.dataset.i18nAria)));
}
window.FreePayLang = () => LANG;   /* Chicken Goal (iframe) reads the language from here */

function updateLangButton(){
  const c = document.getElementById('langCode');
  if(c) c.textContent = LANG.toUpperCase();
  document.documentElement.lang = LANG;
}
function setLanguage(l){
  if(!LANGS[l]) return;
  LANG = l; saveLang(l);
  updateLangButton();
  applyStaticI18n();
  renderAdsBanner(); renderNav();
  renderMain();
  try{ if(chickenFrame) chickenFrame.contentWindow.ChickenGoal.setLang(l); }catch(e){}
  try{ if(slotFrame) slotFrame.contentWindow.SkullFiesta.setLang(l); }catch(e){}
  try{ if(slingFrame) slingFrame.contentWindow.SlingBirds.setLang(l); }catch(e){}
  try{ if(minesFrame) minesFrame.contentWindow.MinesGame.setLang(l); }catch(e){}
  try{ if(crossFrame) crossFrame.contentWindow.ChickenCross.setLang(l); }catch(e){}
  try{ if(drawFrame) drawFrame.contentWindow.QuickDraw.setLang(l); }catch(e){}
}
function renderLangList(){
  document.getElementById('langList').innerHTML = Object.keys(LANGS).map(k =>
    `<button class="lang-opt${k === LANG ? ' on' : ''}" onclick="pickLanguage('${k}')"><span class="cd">${k.toUpperCase()}</span><span class="nm">${LANGS[k].name}</span><span class="ck">✓</span></button>`
  ).join('');
}
function openLangPicker(first){
  langPickerFirstRun = (first === true);
  document.getElementById('langClose').style.display = langPickerFirstRun ? 'none' : 'block';
  renderLangList();
  document.getElementById('langOverlay').style.display = 'flex';
  if(!langPickerFirstRun) playClickSound();
}
function closeLangPicker(){
  document.getElementById('langOverlay').style.display = 'none';
}
function pickLanguage(l){
  playClickSound();
  const wasFirst = langPickerFirstRun;
  langPickerFirstRun = false;
  setLanguage(l);
  closeLangPicker();
  if(wasFirst) startEntryFlow();
}

/* Guarded: if the CDN script failed to load (blocked network, slow connection,
   filtering inside the Telegram in-app browser, etc.), window.supabase is undefined.
   Calling .createClient on it used to throw here and crash the WHOLE inline script
   before any render*() call ran below -> blank screen, even though it worked fine
   in a normal desktop browser with unrestricted network. Now we degrade gracefully:
   the app renders and runs on local storage only, and just skips the backend sync. */
let _supabase = null;
try{
  if(window.supabase && typeof window.supabase.createClient === 'function'){

/* Creates/refreshes the row for this Telegram user, then pulls the real coin
   balance from the backend so it overrides whatever was cached locally. */
async function syncUserFromBackend(){
  if(USER_ID === 'guest' || !_supabase){ migrateLegacyTickets(); return; }
  const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  try{
    await _supabase.from('telusersinfo').upsert({
      id: USER_ID,
      name: u ? u.first_name : null,
      username: u ? u.username : null,
      premium: u ? u.is_premium : null
    }, { onConflict: ['id'] });

    let { data: row, error } = await _supabase
      .from('telusersinfo')
      .select('point, diamonds')
      .eq('id', USER_ID)
      .single();
    if(error && isMissingDiaColumn(error)){
      /* the `diamonds` column isn't created yet: carry on with coins only */
      diaColumnOk = false;
      ({ data: row, error } = await _supabase.from('telusersinfo').select('point').eq('id', USER_ID).single());
    }
    if(error) throw error;

    if(row && typeof row.point === 'number'){
      state.coins = row.point;
    } else {
      /* brand-new row with no point value yet: seed it with whatever we have locally */
      await _supabase.from('telusersinfo').update({ point: state.coins }).eq('id', USER_ID);
    }
    /* diamonds: the server value wins; if it's still empty, upload what this device has */
    if(diaColumnOk){
      if(row && row.diamonds !== null && row.diamonds !== undefined && isFinite(Number(row.diamonds))){
        state.dia = Math.round(Number(row.diamonds) * 100);
      } else {
        await _supabase.from('telusersinfo').update({ diamonds: diaForBackend() }).eq('id', USER_ID);
      }
      diaSynced = true;
    }
    migrateLegacyTickets();
    renderChips();
    if(state.tab === 'home' || state.tab === 'friends') renderMain();
  }catch(e){
    console.error('FreePay: could not reach backend, using local coin balance', e);
    migrateLegacyTickets();
  }
}

/* Call right after state.coins changes locally, so the backend stays the source of truth. */
/* Diamonds live in state.dia as whole hundredths (1 = 0.01); the table column `diamonds` holds the plain
   decimal number (state.dia / 100). Nothing is uploaded until the first sync has read what the server has. */
let diaColumnOk = true;     /* becomes false if the `diamonds` column doesn't exist yet */
let diaSynced = false;
function diaForBackend(){ return Math.round(state.dia || 0) / 100; }
function isMissingDiaColumn(err){
  return !!err && (/diamonds/i.test(String(err.message || '')) || err.code === 'PGRST204' || err.code === '42703');
}
async function pushCoinsToBackend(){
  if(USER_ID === 'guest' || !_supabase) return;
  try{
    const patch = { point: state.coins };
    if(diaColumnOk && diaSynced) patch.diamonds = diaForBackend();
    let { error } = await _supabase.from('telusersinfo').update(patch).eq('id', USER_ID);
    if(error && patch.diamonds !== undefined && isMissingDiaColumn(error)){
      diaColumnOk = false;   /* keep saving coins, stop sending diamonds */
      ({ error } = await _supabase.from('telusersinfo').update({ point: state.coins }).eq('id', USER_ID));
    }
    if(error) throw error;
  }catch(e){
    console.error('FreePay: could not save coins to backend', e);
  }
}

/* Adds a coin reward. Coins in the wallet (and the backend `point` column) stay whole numbers, so a
   fractional reward is carried over and paid out as soon as it adds up to a full coin. */
function creditCoins(amount){
  const total = (state.coinCarry || 0) + amount;
  const whole = Math.floor(total + 1e-9);
  state.coinCarry = Math.round((total - whole) * 100) / 100;
  if(whole > 0){ state.coins += whole; pushCoinsToBackend(); }
  persistState();
  return whole;
}

/* One-time conversion of tickets saved by older versions: 1 ticket -> 1 coin. */
function migrateLegacyTickets(){
  const legacy = state.legacyTickets || 0;
  if(legacy <= 0) return;
  state.legacyTickets = 0;
  const whole = creditCoins(legacy);
  renderChips();
  if(whole > 0) showToast(tt('toast_legacy', {n: whole}));
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  const isBrandNew = !raw;
  const base = {
    coins:0, coinCarry:0, legacyTickets:0, dia:0, rotation:0, spinCount:0,
    dailyDate: todayStr(), adsWatchedToday:0, tasksDoneToday:{},
    seqPos: 0,
    giftClaimed: !isBrandNew, /* returning users with older saves never see the welcome gift */
    dailyRewardDate: null /* date string of the last day the daily reward overlay was claimed */
  };
  let saved = null;
  try{ saved = raw ? JSON.parse(raw) : null; }catch(e){}
  if(!saved) return base;
  const merged = Object.assign({}, base, saved);
  /* tickets no longer exist: keep an old balance aside so it can be converted to coins */
  merged.legacyTickets = Math.max(0, Number(merged.legacyTickets) || 0) + Math.max(0, Number(saved.tickets) || 0);
  delete merged.tickets;
  delete merged.energy;   /* the energy system was removed */
  if(merged.dailyDate !== todayStr()){
    merged.dailyDate = todayStr();
    merged.adsWatchedToday = 0;
    merged.tasksDoneToday = {};
  }
  return merged;
}

function persistState(){
  const toSave = {
    coins: state.coins, coinCarry: state.coinCarry, legacyTickets: state.legacyTickets,
    dia: state.dia,
    rotation: state.rotation, spinCount: state.spinCount,
    dailyDate: state.dailyDate, adsWatchedToday: state.adsWatchedToday,
    tasksDoneToday: state.tasksDoneToday, giftClaimed: state.giftClaimed,
    dailyRewardDate: state.dailyRewardDate,
    seqPos: state.seqPos
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); }catch(e){}
}

/* ---------- sound effects (synthesized, no external files) ---------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function playTone(freq, duration, type, vol, delay){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol || 0.2, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
function playClickSound(){ playTone(680, 0.06, 'square', 0.10); }
function playClaimSound(){
  playTone(660, 0.12, 'triangle', 0.16, 0);
  playTone(880, 0.14, 'triangle', 0.16, 0.08);

}

/* ---------- lightweight particle burst (used by the welcome gift) ---------- */
function burstParticles(canvas, count){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w; canvas.height = h;
  const cx = w / 2, cy = h / 2;
  const colors = [C.gold, C.goldDark, C.pink, '#FFD24C'];
  const particles = [];
  for(let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 5.5;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2.5,
      life: 1,
      decay: 0.014 + Math.random() * 0.012,
      size: 2.5 + Math.random() * 3.5,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  function tick(){
    ctx.clearRect(0, 0, w, h);
    let alive = false;
    particles.forEach(p => {
      if(p.life <= 0) return;
      alive = true;
      p.vy += 0.16;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if(alive) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, w, h);
  }
  tick();
}

/* ---------- background ad preload (drives the "Tasks" nav dot) ---------- */
/* AdsGram's <adsgram-task> only fires reward / onError / onBannerNotFound /
   onTooLongSession — there is no official "ad finished loading" event.
   We approximate "loaded and ready to watch" by preloading a hidden probe
   instance for each block and treating "no error after ~2.5s" as ready. */
let adReadyState = {};   // blockId -> true/false
let dotVisible = false;
let prevAnyAdReady = false;
let adPreloadGeneration = 0; // bumped every time the active block changes, so old timers/listeners for the previous block become no-ops

function updateNavDot(){
  const anyReady = Object.values(adReadyState).some(Boolean);
  if(anyReady && !prevAnyAdReady && state.tab !== 'task') dotVisible = true;
  if(!anyReady) dotVisible = false;
  prevAnyAdReady = anyReady;
  renderNav();
}

function schedulePreload(t, delay, gen){
  setTimeout(()=>{
    if(gen !== adPreloadGeneration) return; // this block is no longer the active one — stop the chain
    const container = document.getElementById('adPreload');
    if(!container) return;
    const old = container.querySelector(`[data-block-id="${t.blockId}"]`);
    if(old) old.remove();

    const el = document.createElement('adsgram-task');
    el.setAttribute('data-block-id', t.blockId);
    el.setAttribute('data-debug', 'false');
    el.setAttribute('data-debug-console', 'false');
    el.innerHTML = `<span slot="reward"></span><div slot="button"></div><div slot="claim"></div><div slot="done"></div>`;

    let settled = false;
    el.addEventListener('onError', ()=>{ settled = true; if(gen !== adPreloadGeneration) return; adReadyState[t.blockId] = false; updateNavDot(); schedulePreload(t, 30000, gen); });
    el.addEventListener('onBannerNotFound', ()=>{ settled = true; if(gen !== adPreloadGeneration) return; adReadyState[t.blockId] = false; updateNavDot(); schedulePreload(t, 30000, gen); });
    el.addEventListener('onTooLongSession', ()=>{ settled = true; });
    el.addEventListener('reward', ()=>{ if(gen !== adPreloadGeneration) return; adReadyState[t.blockId] = false; updateNavDot(); schedulePreload(t, 3000, gen); });

    container.appendChild(el);

    setTimeout(()=>{
      if(gen !== adPreloadGeneration) return;
      if(!settled){ adReadyState[t.blockId] = true; updateNavDot(); }
    }, 2500);
  }, delay);
}

/* ---------- tiny "mining" animation for the cooldown card ----------
   Draws the flappy character swinging a pickaxe at a rock, transparent
   background so it blends with the card instead of showing a boxed sprite. */
let cooldownMineTime = 0;
let cooldownMineLastTs = 0;
function drawCooldownMineFrame(ts){
  const canvas = document.getElementById('adCooldownAnim');
  if(!canvas){ adCooldownRafId = null; return; }
  if(!cooldownMineLastTs) cooldownMineLastTs = ts;
  const dt = Math.min((ts - cooldownMineLastTs) / 1000, 0.05);
  cooldownMineLastTs = ts;
  cooldownMineTime += dt;

  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const cycle = (cooldownMineTime % 1.1) / 1.1; // 0..1 swing cycle
  const swing = Math.sin(cycle * Math.PI * 2);      // -1..1
  const impact = cycle > 0.42 && cycle < 0.5;        // brief impact moment

  ctx.save();
  ctx.translate(w * 0.36, h * 0.62);

  /* rock */
  ctx.fillStyle = '#3A4066';
  ctx.beginPath();
  ctx.moveTo(w * 0.18, h * 0.06);
  ctx.lineTo(w * 0.34, -h * 0.06);
  ctx.lineTo(w * 0.44, h * 0.10);
  ctx.lineTo(w * 0.30, h * 0.16);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#4A5188';
  ctx.beginPath();
  ctx.moveTo(w * 0.20, h * 0.05);
  ctx.lineTo(w * 0.30, -h * 0.02);
  ctx.lineTo(w * 0.34, h * 0.08);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  /* impact chips */
  if(impact){
    ctx.fillStyle = '#9AA1C9';
    for(let i = 0; i < 4; i++){
      const a = (i / 4) * Math.PI * 2 + cooldownMineTime * 6;
      const r = w * 0.06;
      const cx = w * 0.62 + Math.cos(a) * r;
      const cy = h * 0.5 + Math.sin(a) * r * 0.6;
      ctx.beginPath();
      ctx.arc(cx, cy, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* miner body (simple rounded shape, no external image = no blocked-CDN risk) */
  ctx.save();
  ctx.translate(w * 0.6, h * 0.55);
  const bob = Math.sin(cooldownMineTime * 6) * 1.2;
  ctx.translate(0, bob);
  ctx.fillStyle = '#F5B942';
  ctx.beginPath();
  ctx.ellipse(0, 0, w * 0.11, h * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFE3A0';
  ctx.beginPath();
  ctx.arc(0, -h * 0.2, w * 0.075, 0, Math.PI * 2);
  ctx.fill();

  /* pickaxe arm, swinging toward the rock */
  const swingAngle = -0.9 + swing * 0.9; // radians
  ctx.save();
  ctx.translate(-w * 0.06, -h * 0.05);
  ctx.rotate(swingAngle);
  ctx.strokeStyle = '#B9822A';
  ctx.lineWidth = Math.max(2, w * 0.045);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w * 0.22, 0);
  ctx.stroke();
  ctx.fillStyle = '#9AA1C9';
  ctx.beginPath();
  ctx.moveTo(w * 0.22, -h * 0.05);
  ctx.lineTo(w * 0.30, 0);
  ctx.lineTo(w * 0.22, h * 0.05);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.restore();

  adCooldownRafId = requestAnimationFrame(drawCooldownMineFrame);
}

function startCooldownMineAnim(){
  stopCooldownMineAnim();
  cooldownMineTime = 0;
  cooldownMineLastTs = 0;
  adCooldownRafId = requestAnimationFrame(drawCooldownMineFrame);
}
function stopCooldownMineAnim(){
  if(adCooldownRafId){ cancelAnimationFrame(adCooldownRafId); adCooldownRafId = null; }
}

function startAdCooldown(){
  adCoolingDown = true;
  adCooldownStart = Date.now();
  if(adCooldownInterval) clearInterval(adCooldownInterval);
  if(adCooldownTimeout) clearTimeout(adCooldownTimeout);

  if(state.tab === 'task') renderMain();
  /* set the bar's initial width on the *next* frame so the CSS transition
     actually animates from 100% down, instead of snapping straight to 0 */
  requestAnimationFrame(()=>{
    const bar = document.getElementById('adCooldownBar');
    if(bar) bar.style.width = '100%';
    requestAnimationFrame(updateAdCooldownUI);
    startCooldownMineAnim();
  });

  adCooldownInterval = setInterval(updateAdCooldownUI, 250);
  adCooldownTimeout = setTimeout(()=>{
    adCoolingDown = false;
    stopCooldownMineAnim();
    clearInterval(adCooldownInterval);
    adCooldownInterval = null;
    adCooldownTimeout = null;
    rotateActiveAdBlock();
  }, AD_COOLDOWN_MS);
}

/* Only ever preloads the single currently-active block — never both at once. */
function startPreloadForActiveBlock(){
  adPreloadGeneration++;
  const gen = adPreloadGeneration;
  const container = document.getElementById('adPreload');
  if(container) container.innerHTML = '';
  adReadyState = {};
  updateNavDot();
  schedulePreload(AD_TASKS[activeAdIndex], 0, gen);

/* Called when the live task-list block settles (reward / error / no-fill) so the
   other block becomes live next time the user opens the Tasks tab. */
function rotateActiveAdBlock(){
  activeAdIndex = (activeAdIndex + 1) % AD_TASKS.length;
  startPreloadForActiveBlock();
  if(state.tab === 'task') renderMain();

/* ---------- game lobby: open / close ---------- */
/* ---------- game loading screen (shown every time a game opens; themed per game) ----------
   The bar is a CSS transition (GPU) – JS only sets a few target values, so nothing here depends on the main thread staying free. */
const GAME_THEME = {
  crash:  { name:'Crash',         rgb:'139,92,246', c1:'#2a1450', parts:['🚀','✨','⭐','🌠'] },
  chicken:{ name:'Chicken Goal',  rgb:'46,204,113', c1:'#0f4a28', parts:['⚽','🧤','🐔','🥅'] },
  slot:   { name:'Skull Fiesta',  rgb:'217,70,239', c1:'#4a1650', parts:['💀','🌵','🪙','🎰'], fall:true },
  sling:  { name:'Sling Birds',   rgb:'255,138,61', c1:'#5a2a16', parts:['🐦','🐷','💥','🪵'] },
  mines:  { name:'Mines',         rgb:'34,211,238', c1:'#0e4150', parts:['💎','💣','✨','💎'], fall:true },
  cross:  { name:'Chicken Cross', rgb:'250,204,21', c1:'#4a3d12', parts:['🐔','🚗','🚕','🐥'] },
  draw:   { name:'Quick Draw',    rgb:'255,107,74', c1:'#5a2a1c', parts:['🤠','🌵','💰','⭐'] }
};
const GAME_HOST = { chicken:'chickenHost', slot:'slotHost', sling:'slingHost', mines:'minesHost', cross:'crossHost', draw:'drawHost' };
const LOADER_FIRST_MS = 2600;    /* first time a game is opened in this session */
const LOADER_REPEAT_MS = 1300;   /* when it is opened again (the game is already loaded) */
const gameSeen = {};
let loaderRun = 0;
function frameReady(fr){
  return new Promise(res => {
    if(!fr) return res();
    try{ const d = fr.contentDocument; if(d && d.readyState === 'complete' && d.body && d.body.children.length) return res(); }catch(e){}
    fr.addEventListener('load', () => res(), { once:true });
    setTimeout(res, 8000);       /* never trap the player on the loading screen */
  });
}
function gameLoaderShow(g){
  const th = GAME_THEME[g], el = document.getElementById('gameLoader');
  if(!th || !el) return null;
  const run = ++loaderRun, first = !gameSeen[g]; gameSeen[g] = true;
  /* the lobby card is hidden (display:none) while a game is open, so its gradients stop rendering: give the clone its own unique ids */
  const art = document.querySelector('#main .game-card.' + g + ' .gc-shot svg');
  let artHTML = '';
  if(art){
    artHTML = art.outerHTML;
    [...artHTML.matchAll(/\sid="([^"]+)"/g)].forEach(m => { const id = m[1];
      artHTML = artHTML.split('id="' + id + '"').join('id="gl_' + id + '"').split('url(#' + id + ')').join('url(#gl_' + id + ')').split('href="#' + id + '"').join('href="#gl_' + id + '"'); });
  }
  const R = (a, b) => a + Math.random() * (b - a);
  let parts = '';
  for(let i = 0; i < 8; i++){
    const dur = R(4.2, 7);
    parts += `<i style="left:${R(2, 96).toFixed(1)}%;font-size:${R(20, 34).toFixed(0)}px;animation-duration:${dur.toFixed(2)}s;animation-delay:${(-R(0, dur)).toFixed(2)}s;--dx:${R(-40, 40).toFixed(0)}px;--rot:${R(-50, 50).toFixed(0)}deg">${th.parts[i % th.parts.length]}</i>`;
  }
  for(let i = 0; i < 12; i++){
    const dur = R(3.6, 6.4), sz = R(3, 7);
    parts += `<u style="left:${R(2, 98).toFixed(1)}%;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;animation-duration:${dur.toFixed(2)}s;animation-delay:${(-R(0, dur)).toFixed(2)}s;--dx:${R(-24, 24).toFixed(0)}px;--rot:0deg"></u>`;
  }
  el.style.setProperty('--a', th.rgb); el.style.setProperty('--c1', th.c1);
  el.className = th.fall ? 'fall' : '';
  el.innerHTML = `
    <div class="gl-glow" aria-hidden="true"></div>
    <div class="gl-brand" aria-hidden="true">Free<b>Pay</b></div>
    <div class="gl-parts" aria-hidden="true">${parts}</div>
    <div class="gl-center">
      <div class="gl-hero" aria-hidden="true"><div class="gl-ring"></div><div class="gl-ring"></div><div class="gl-frame"><div class="gl-art">${artHTML}</div></div></div>
      <div class="gl-name">${th.name}</div>
      <div class="gl-bar"><div class="gl-fill"></div></div>
      <div class="gl-row"><span>${tt('loading')}<span class="gl-dots"><i></i><i></i><i></i></span></span><b class="gl-pct">0%</b></div>
    </div>`;
  el.classList.add('on');

  const fill = el.querySelector('.gl-fill'), pct = el.querySelector('.gl-pct');
  const L = { run, ready:false, done:false, t0:performance.now(), min: first ? LOADER_FIRST_MS : LOADER_REPEAT_MS };
  fill.style.transition = 'none'; fill.style.transform = 'scaleX(0)';
  void fill.offsetWidth;
  fill.style.transition = 'transform ' + L.min + 'ms cubic-bezier(.2,.75,.3,1)';
  fill.style.transform = 'scaleX(.9)';
  /* percentage readout: 10 times a second is plenty and costs almost nothing */
  const tick = setInterval(() => {
    if(L.run !== loaderRun){ clearInterval(tick); return; }
    const m = /matrix\(([^,]+)/.exec(getComputedStyle(fill).transform);
    if(m) pct.textContent = Math.min(100, Math.round(parseFloat(m[1]) * 100)) + '%';
  }, 100);
  /* if the game is slower than the minimum time, keep creeping instead of freezing */
  setTimeout(() => { if(L.run === loaderRun && !L.done && !L.ready){ fill.style.transition = 'transform 6s linear'; fill.style.transform = 'scaleX(.97)'; } }, L.min);
  L.finish = () => {
    if(L.done || L.run !== loaderRun) return;
    L.done = true;
    fill.style.transition = 'transform .28s ease-out'; fill.style.transform = 'scaleX(1)';
    setTimeout(() => { pct.textContent = '100%'; }, 280);
    setTimeout(() => { if(L.run === loaderRun) el.classList.remove('on'); }, 360);
    setTimeout(() => { clearInterval(tick); if(L.run === loaderRun && !el.classList.contains('on')) el.innerHTML = ''; }, 900);
  };
  return L;
}
function gameLoaderReady(L){
  L.ready = true;
  setTimeout(() => L.finish(), Math.max(0, L.min - (performance.now() - L.t0)));
}

function openGame(g){
  playClickSound();
  const L = gameLoaderShow(g);            /* built from the lobby card, so it must run before the lobby is replaced */
  const enter = () => {
    state.homeView = g; renderMain(); refreshAllBalances(); renderChips();
    if(L){
      const host = GAME_HOST[g] && document.getElementById(GAME_HOST[g]);
      frameReady(host && host.querySelector('iframe')).then(() => gameLoaderReady(L));
    }
  };
  /* let the loading screen paint its first frames BEFORE the heavy part (building the game) starts */
  if(L) requestAnimationFrame(() => setTimeout(enter, 90)); else enter();
}
function closeGame(){ playClickSound(); state.homeView = 'lobby'; renderMain(); renderChips(); }

/* ---------- Chicken Goal (isolated in an iframe so its CSS/JS can't clash with FreePay) ----------
   The iframe is created once and kept alive (just hidden) so a round in progress is never lost
   when the player leaves the game. It reads/spends/pays the same coin balance as everything else. */
/* ---------- big-win share popup: win >= x5 of the bet, at most once every 2 hours, can be closed ---------- */
const SHARE_WIN_MIN_MULT = 5;
const SHARE_WIN_COOLDOWN_MS = 2 * 60 * 60 * 1000;
const SHARE_WIN_KEY = 'freepay:' + USER_ID + ':shareWinAt';
let lastBetAmt = 0, shareWinData = null;
function shareWinAllowed(){
  try{ const t = Number(localStorage.getItem(SHARE_WIN_KEY)) || 0; return Date.now() - t >= SHARE_WIN_COOLDOWN_MS; }catch(e){ return true; }
}
function shareWinCheck(payout, bet){
  payout = Math.floor(Number(payout) || 0); bet = Math.floor(Number(bet) || 0);
  if(payout < 1 || bet < 1 || payout / bet < SHARE_WIN_MIN_MULT) return;
  if(!shareWinAllowed()) return;
  shareWinData = { n: payout, x: Math.round(payout / bet * 10) / 10 };
  try{ localStorage.setItem(SHARE_WIN_KEY, String(Date.now())); }catch(e){}   /* counts from the moment it is shown */
  setTimeout(showShareWin, 1600);   /* let the game's own win animation play first */
}
function showShareWin(){
  if(!shareWinData) return;
  const busy = ['coinOfferOverlay','giftOverlay','dailyRewardOverlay'].some(id => { const e = document.getElementById(id); return e && e.style.display === 'flex'; });
  if(busy){ shareWinData = null; return; }
  const d = shareWinData;
  document.getElementById('shareWinTitle').textContent = tt('sw_title');
  document.getElementById('shareWinWon').textContent = tt('sw_won', {n: fmtNum(d.n)}) + '  ·  x' + d.x;
  document.getElementById('shareWinSub').textContent = tt('sw_sub', {f: REF_FRIEND_REWARD, fc: coinWord(REF_FRIEND_REWARD)});
  document.getElementById('shareWinBtn').textContent = tt('sw_share');
  document.getElementById('shareWinLater').textContent = tt('sw_later');
  document.getElementById('shareWinOverlay').style.display = 'flex';
}
function closeShareWin(){
  document.getElementById('shareWinOverlay').style.display = 'none';
  shareWinData = null;
}
function shareBigWin(){
  playClickSound();
  const d = shareWinData; closeShareWin();
  if(!d) return;
  const text = tt('sw_text', {n: fmtNum(d.n), x: d.x, f: REF_FRIEND_REWARD, fc: coinWord(REF_FRIEND_REWARD)});
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(inviteLink()) + '&text=' + encodeURIComponent(text);
  if(TG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, '_blank');
}

/* ---------- bank: every game (iframes AND Crash) goes through these, so fun mode is handled in ONE place ----------
   fun  -> a demo balance (funCoins): nothing is taken from / added to state.coins, nothing is sent to the backend,
           and no big-win share popup. real -> the user's own coins, exactly as before. */
function bankGet(){ return playMode === 'fun' ? Math.floor(funCoins) : Math.floor(state.coins + 1e-9); }
function bankSpend(a){
  if(playMode === 'fun'){ funCoins -= a; betMode = 'fun'; }
  else { state.coins -= a; betMode = 'real'; pushCoinsToBackend(); }
  renderChips();
}
function bankPay(a){            /* payout or refund: goes to the same place the bet came from */
  if(betMode === 'fun'){ funCoins += a; }
  else { state.coins += a; pushCoinsToBackend(); }
  renderChips();
}
function refreshAllBalances(){
  try{ if(chickenFrame) chickenFrame.contentWindow.ChickenGoal.refreshBalance(); }catch(e){}
  try{ if(slotFrame)    slotFrame.contentWindow.SkullFiesta.refreshBalance(); }catch(e){}
  try{ if(slingFrame)   slingFrame.contentWindow.SlingBirds.refreshBalance(); }catch(e){}
  try{ if(minesFrame)   minesFrame.contentWindow.MinesGame.refreshBalance(); }catch(e){}
  try{ if(crossFrame)   crossFrame.contentWindow.ChickenCross.refreshBalance(); }catch(e){}
  try{ if(drawFrame)    drawFrame.contentWindow.QuickDraw.refreshBalance(); }catch(e){}
}
function funActive(){ return playMode === 'fun' && state.tab === 'home' && !!state.homeView && state.homeView !== 'lobby'; }
function syncFunUI(){
  const on = funActive();
  const bd = document.getElementById('funBadge'); if(bd){ bd.style.display = on ? 'block' : 'none'; bd.textContent = tt('mp_badge'); }
  const ch = document.getElementById('chipCoins'); if(ch) ch.classList.toggle('fun', on);
}

window.FreePayWallet = {
  get(){ return bankGet(); },
  bet(a){
    a = Math.floor(Number(a) || 0);
    if(a < 1 || a > bankGet()) return false;
    bankSpend(a); lastBetAmt = a;
    return true;
  },
  win(a){
    a = Math.floor(Number(a) || 0);
    if(a < 1) return;
    bankPay(a);
    if(betMode !== 'fun') shareWinCheck(a, lastBetAmt);
  },
  /* not enough coins to play: tell the user, then send them to the Tasks tab */
  needCoins(msg){
    if(playMode === 'fun'){        /* demo balance ran out: just refill it, no offer, no Tasks tab */
      funCoins = FUN_START; renderChips(); refreshAllBalances(); showToast(tt('mp_refill'));
      return;
    }
    if(coinOfferVisible()) return;
    if(coinOfferAllowed()){ showCoinOffer(); return; }   /* offer is on cooldown -> old behaviour */
    showToast(msg || tt('need_coins_tasks'));
    setTab('task');
  }
};

/* ---------- out-of-coins offer: shown when ANY game can't be played for lack of coins ----------
   Option 1: 1 short (interstitial) ad = 25 coins — it has no reward callback, so the coins are paid if the ad
   showed without an error, after a short minimum wait.
   Option 2: 1 normal rewarded ad = 75 coins.
   At most once per COIN_OFFER_COOLDOWN_MS: the time of the
   last offer is kept in localStorage and checked before the offer is shown again. */
const COIN_OFFER_COOLDOWN_MS = 2 * 60 * 1000;
const COIN_OFFER_ONE   = { coins:25 };   /* short interstitial ad (INTERSTITIAL_BLOCK_ID) */
const COIN_OFFER_THREE = { coins:75 };   /* ONE normal rewarded ad (COIN_OFFER_BLOCK_ID) — name kept, it is the second button */
const COIN_OFFER_SHORT_WAIT_MS = 3000;   /* minimum wait before paying the short-ad coins */
const COIN_OFFER_BLOCK_ID = "47445";   /* AdsGram reward block — put a dedicated block id here if you create one */
const COIN_OFFER_KEY = "freepay:" + USER_ID + ":coinOfferTs";
let coinOfferMemTs = 0, coinOfferAdController = null, coinOfferBusy = false;

function coinOfferLastTs(){
  let ts = 0;
  try{ ts = Number(localStorage.getItem(COIN_OFFER_KEY)) || 0; }catch(e){}
  return Math.max(ts, coinOfferMemTs);
}
function coinOfferMark(){
  coinOfferMemTs = Date.now();
  try{ localStorage.setItem(COIN_OFFER_KEY, String(coinOfferMemTs)); }catch(e){}
}
function coinOfferAllowed(){
  const last = coinOfferLastTs(), now = Date.now();
  return !last || last > now || (now - last) >= COIN_OFFER_COOLDOWN_MS;   /* last > now = clock was changed */
}
function coinOfferVisible(){ return document.getElementById('coinOfferOverlay').style.display === 'flex'; }
function getCoinOfferAdController(){
  if(!coinOfferAdController && window.Adsgram){
    coinOfferAdController = window.Adsgram.init({ blockId: COIN_OFFER_BLOCK_ID });
  }
  return coinOfferAdController;
}
function setCoinOfferButtons(disabled){
  document.getElementById('offerAd1').disabled = disabled;
  document.getElementById('offerAd3').disabled = disabled;
}
function renderCoinOffer(){
  document.getElementById('coinOfferIcon').innerHTML = coinIcon(54);
  setI(document.getElementById('offerAd1Label'), 'offer_ad1', {n: COIN_OFFER_ONE.coins});
  setI(document.getElementById('offerAd3Label'), 'offer_ad3', {n: COIN_OFFER_THREE.coins});
}
function showCoinOffer(){
  coinOfferBusy = false;
  renderCoinOffer(); setCoinOfferButtons(false);
  document.getElementById('coinOfferOverlay').style.display = 'flex';
}
function hideCoinOffer(){ document.getElementById('coinOfferOverlay').style.display = 'none'; }
function skipCoinOffer(){
  if(coinOfferBusy) return;
  playClickSound();
  coinOfferMark();        /* "no thanks" also counts, so the offer doesn't nag again right away */
  hideCoinOffer();
}
async function watchCoinOffer(kind){
  if(coinOfferBusy) return;
  const isShort = kind !== 3;                       /* 1 = short interstitial (25), 3 = rewarded (75) */
  const cfg = isShort ? COIN_OFFER_ONE : COIN_OFFER_THREE;
  const controller = isShort ? getInterstitialAdController() : getCoinOfferAdController();
  if(!controller){ showToast(tt('toast_ad_not_ready')); return; }
  playClickSound();
  coinOfferBusy = true; setCoinOfferButtons(true);
  const startedAt = Date.now();
  try{
    await controller.show();                        /* rejects on no-fill / error (rewarded ad: also when skipped) */
    if(isShort){
      /* the interstitial has no reward callback: it showed without an error -> wait a few seconds, then pay */
      const left = COIN_OFFER_SHORT_WAIT_MS - (Date.now() - startedAt);
      if(left > 0) await new Promise(r => setTimeout(r, left));
    }
    bumpAdsWatchedBackend();
  }catch(e){
    coinOfferBusy = false; setCoinOfferButtons(false);
    showToast(tt(isShort ? 'toast_ad_error' : 'toast_ad_incomplete'));
    return;
  }
  /* ad done -> pay out */
  state.coins += cfg.coins;
  persistState(); pushCoinsToBackend(); renderChips();
  coinOfferMark();
  coinOfferBusy = false;
  hideCoinOffer();
  try{ playClaimSound(); }catch(e){}
  showToast(tt('toast_offer_got', {n: cfg.coins}));
  try{ if(chickenFrame) chickenFrame.contentWindow.ChickenGoal.refreshBalance(); }catch(e){}
  try{ if(slotFrame) slotFrame.contentWindow.SkullFiesta.refreshBalance(); }catch(e){}
  try{ if(slingFrame) slingFrame.contentWindow.SlingBirds.refreshBalance(); }catch(e){}
  try{ if(minesFrame) minesFrame.contentWindow.MinesGame.refreshBalance(); }catch(e){}
  try{ if(crossFrame) crossFrame.contentWindow.ChickenCross.refreshBalance(); }catch(e){}
  try{ if(drawFrame) drawFrame.contentWindow.QuickDraw.refreshBalance(); }catch(e){}
}
/* ---------- game code is loaded only when a game is opened ----------
   The code of every game sits in an inert <script type="text/plain"> block at the very end of the page: the browser never
   parses or compiles it as JavaScript, and nothing is decoded or started until the player actually opens that game. */
function gameSource(id){
  const node = document.getElementById('game-' + id);
  if(!node){ console.error('game payload missing:', id); return null; }
  const bin = atob(node.textContent.trim());
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
let chickenFrame = null;
function ensureChickenGame(){
  if(!chickenFrame){
    const html = gameSource('chicken'); if(!html) return;
    chickenFrame = document.createElement('iframe');
    chickenFrame.title = 'Chicken Goal';
    chickenFrame.setAttribute('allow', 'autoplay');
    chickenFrame.srcdoc = html;
    document.getElementById('chickenHost').appendChild(chickenFrame);
  } else {
    try{ chickenFrame.contentWindow.ChickenGoal.refreshBalance(); }catch(e){}
  }
}

/* ---------- main screen render ---------- */
function renderMain(){
  syncFunUI();
  const main = document.getElementById('main');
  const host = document.getElementById('chickenHost');
  const slotHost = document.getElementById('slotHost');
  const slingHost = document.getElementById('slingHost');
  const minesHost = document.getElementById('minesHost');
  const crossHost = document.getElementById('crossHost');
  const drawHost = document.getElementById('drawHost');
  const view = state.tab === 'home' ? (state.homeView || 'lobby') : null;
  if(view !== 'crash') Crash.unmount();
  /* leaving the slot: stop AUTO so it can't keep betting while hidden */
  if(view !== 'slot' && slotFrame){ try{ slotFrame.contentWindow.SkullFiesta.stopAuto(); }catch(e){} }
  /* leaving Sling Birds: silence its music (the iframe stays alive, just hidden) */
  if(view !== 'sling' && slingFrame){ try{ slingFrame.contentWindow.SlingBirds.pause(); }catch(e){} }
  const fullGame = view === 'chicken' || view === 'slot' || view === 'sling' || view === 'mines' || view === 'cross' || view === 'draw';
  host.style.display = view === 'chicken' ? 'flex' : 'none';
  slotHost.style.display = view === 'slot' ? 'flex' : 'none';
  slingHost.style.display = view === 'sling' ? 'flex' : 'none';
  minesHost.style.display = view === 'mines' ? 'flex' : 'none';
  crossHost.style.display = view === 'cross' ? 'flex' : 'none';
  drawHost.style.display = view === 'draw' ? 'flex' : 'none';
  main.style.display = fullGame ? 'none' : '';
  document.getElementById('app').classList.toggle('chicken-mode', fullGame || view === 'crash');
  main.classList.toggle('crash-tab', view === 'crash');
  if(view === 'chicken'){ ensureChickenGame(); return; }
  if(view === 'slot'){ ensureSlotGame(); return; }
  if(view === 'sling'){ ensureSlingGame(); return; }
  if(view === 'mines'){ ensureMinesGame(); return; }
  if(view === 'cross'){ ensureCrossGame(); return; }
  if(view === 'draw'){ ensureDrawGame(); return; }
  if(state.tab === 'home') main.innerHTML = homeHTML();
  else if(state.tab === 'task') main.innerHTML = taskHTML();
  else if(state.tab === 'friends') main.innerHTML = friendsHTML();
  else if(state.tab === 'wallet') main.innerHTML = walletHTML();

  if(view === 'crash') Crash.mount(document.getElementById('crashRoot'));
  if(state.tab === 'task'){
    attachAdTaskListeners();
    if(adCoolingDown){ updateAdCooldownUI(); startCooldownMineAnim(); }
  }
  if(state.tab === 'wallet') walletRefresh();
}

/* ---------- task sequence helpers ---------- */
/* the item that is "up next" in the Tasks list: 'ad' or a link-task id.
   Link tasks already done today are skipped. */
function getCurrentSeqItem(){
  const len = TASK_SEQUENCE.length;
  for(let i = 0; i < len; i++){
    const item = TASK_SEQUENCE[state.seqPos % len];
    if(item === 'ad' || !state.tasksDoneToday[item]) return item;
    state.seqPos = (state.seqPos + 1) % len;
  }
  return 'ad';
}
function advanceSeq(){
  state.seqPos = (state.seqPos + 1) % TASK_SEQUENCE.length;
  persistState();
}
function taskHTML(){
  const cur = getCurrentSeqItem();
  let cards;
  if(cur === 'ad'){
    if(adCoolingDown){
      cards = adCooldownCard();
    } else if(state.adsWatchedToday === 8){
      /* the upcoming ad is the 9th one watched today */
      cards = AD_TASKS.map((t, i) => i === activeAdIndex ? ninthAdTaskCard(t) : adTaskCard(t, false)).join('');
    } else {
      cards = AD_TASKS.map((t, i) => adTaskCard(t, i === activeAdIndex)).join('');
    }
  } else {
    const t = EXTRA_TASKS.find(x => x.id === cur);
    cards = t ? extraTaskCard(t) : '';
  }
  return `
    <div class="screen-title">${tt('task_title')}</div>
    <div class="screen-sub">${tt('task_sub')}</div>
    <div class="task-list">${cards}</div>
  `;
}

const BOT_APP_URL = 'https://t.me/TheFreePayBot/FreePayShop';
const REF_FRIEND_REWARD = 25;    /* the new friend, instantly when a code is accepted */
const REF_INVITER_REWARD = 50;   /* the inviter, once that friend is active */

function frEsc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function inviteLink(){
  return USER_ID === 'guest' ? BOT_APP_URL : BOT_APP_URL + '?startapp=' + USER_ID;
}
function copyText(text){
  return new Promise(resolve => {
    const fallback = () => {
      try{
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        resolve(!!ok);
      }catch(e){ resolve(false); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => resolve(true)).catch(fallback);
    } else fallback();
  });
}
function friendsCopy(text){
  playClickSound();
  if(USER_ID === 'guest'){ showToast(tt('fr_guest')); return; }
  copyText(text).then(ok => showToast(ok ? tt('fr_copied') : tt('fr_err_copy')));
}
function friendsCopyLink(){ friendsCopy(inviteLink()); }
function friendsCopyCode(){ friendsCopy(USER_ID); }

  const url = 'https://t.me/share/url?url=' + encodeURIComponent(inviteLink()) +
              '&text=' + encodeURIComponent(tt('fr_share_text', {n: REF_FRIEND_REWARD}));
  if(TG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, '_blank');
}

function uidNum(){ return Number(USER_ID); }
async function friendsRpc(fn, args){
  if(USER_ID === 'guest' || !_supabase) return null;
  try{
    const { data, error } = await _supabase.rpc(fn, args);
    if(error) throw error;
    return data;
  }catch(e){
    console.error('FreePay: ' + fn + ' failed', e);
    return null;
  }
}
/* the server adds coins to `point` itself, so take its balance as the new truth */
function applyServerPoint(p){
  const n = Number(p);
  if(isFinite(n)){ state.coins = n; renderChips(); }
}
function friendsRerender(){
  if(state.tab !== 'friends') return;
  const a = document.activeElement;
  if(a && a.id === 'frCode') return;   /* don't yank the keyboard while someone is typing */
  renderMain();
}

/* open the tab: pay out friends that became active, then load the numbers */
async function friendsRefresh(){
  if(friendsData.loading) return;
  if(USER_ID === 'guest' || !_supabase){ friendsData.loaded = true; return; }
  friendsData.loading = true;
  try{
    await pushCoinsToBackend();   /* flush local coins first so the server adds to the right balance */
    const st = await friendsRpc('freepay_settle_referrals', { p_inviter: uidNum() });
    if(st && st.ok && Number(st.reward) > 0){
      applyServerPoint(st.point);
      playClaimSound();
      showToast(tt('fr_toast_settled', {n: st.reward}));
    }
    const d = await friendsRpc('freepay_my_referrals', { p_inviter: uidNum() });
    if(d){
      friendsData.count = Number(d.count) || 0;
      friendsData.active = Number(d.active) || 0;
      friendsData.earned = Number(d.earned) || 0;
      friendsData.oneClaimed = !!d.oneClaimed;
      friendsData.fiveClaimed = !!d.fiveClaimed;
      friendsData.hasReferrer = !!d.hasReferrer;
      friendsData.list = Array.isArray(d.friends) ? d.friends : [];
      friendsData.loaded = true;
    }
  } finally {
    friendsData.loading = false;
  }
  friendsRerender();
}

async function friendsRegisterRequest(code){
  await pushCoinsToBackend();
  const res = await friendsRpc('freepay_register_referral', { p_invitee: uidNum(), p_code: Number(code) });

/* ---------- Crash game (replaces the Lucky Wheel on the Home tab) ----------
   Bet coins. Cash out before the crash and you get floor(bet x multiplier) coins back;
   crash first and the bet is lost. */
/* ---------- Crash: pool of ~50 real user names (fetched ONCE per app launch) ----------
   Used for the "other players" list. One count + one range query, then everything is
   served from memory, so the backend is never hit again while the app stays open. */
let crashNamePool = null;       /* null = not loaded yet / failed -> Crash falls back to its built-in names */
let crashNamePoolPromise = null;
function loadCrashNamePool(){
  if(crashNamePoolPromise) return crashNamePoolPromise;
  crashNamePoolPromise = (async () => {
    if(!_supabase) return;
    try{
      const SIZE = 50;
      let cq = _supabase.from('telusersinfo').select('id', { count:'exact', head:true });
      if(USER_ID !== 'guest') cq = cq.neq('id', USER_ID);
      const { count } = await cq;
      const total = typeof count === 'number' ? count : 0;
      if(total < 1) return;
      const from = Math.floor(Math.random() * Math.max(1, total - SIZE + 1));
      let q = _supabase.from('telusersinfo').select('name,username').order('id').range(from, from + SIZE - 1);
      const { data, error } = await q;
      if(error || !Array.isArray(data)) return;
      const seen = new Set(), out = [];
      for(const r of data){
        let n = String((r && (r.name || r.username)) || '').replace(/[\u0000-\u001F\u007F<>&"']/g, '').trim();
        if(!n || Array.from(n).length > 16 || seen.has(n.toLowerCase())) continue;
        seen.add(n.toLowerCase()); out.push(n);
      }
      if(out.length >= 4) crashNamePool = out;
    }catch(e){
      console.error('FreePay: could not load player names, using built-in names', e);
    }
  })();
  return crashNamePoolPromise;
}

const _hexC = new Map(), _adjC = new Map();
function hexRgb(h) {
  let v = _hexC.get(h);
  if (!v) { v = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; _hexC.set(h, v); }

function adj(h, f) {
  const key = h + f; let res = _adjC.get(key);
