  const [r, g, b] = hexRgb(h);
  const t = f > 0 ? 255 : 0, a = Math.abs(f);
  const m = v => Math.round(v + (t - v) * a);
  res = '#' + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  _adjC.set(key, res); return res;
}

// Painting helpers for one sprite grid. flap only matters for the wing polygons (wk argument).
function spriteOps(px, flap) {
  const gx = x => (x - 90) / 15 + 1.5, gy = y => (y - 140) / 15 + 1.5;
  const wdy = (x, k) => -flap * k * 150 * Math.pow(Math.max(0, Math.min(1, (650 - x) / 550)), 1.15);

  function inside(P, x, y) {
    let c = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const xi = P[i][0], yi = P[i][1], xj = P[j][0], yj = P[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
    }
    return c;
  }
  function poly(col, pts, wk) {
    const P = [];
    for (let i = 0; i < pts.length; i += 2) { let x = pts[i], y = pts[i + 1]; if (wk) y += wdy(x, wk); P.push([gx(x), gy(y)]); }
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of P) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(SH - 1, Math.ceil(y1)); y++)
      for (let x = Math.max(0, Math.floor(x0)); x <= Math.min(SW - 1, Math.ceil(x1)); x++)
        if (inside(P, x + .5, y + .5)) px[y * SW + x] = col;
  }
  function dot(col, x, y, r) { // grid coords
    for (let yy = Math.floor(y - r); yy <= Math.ceil(y + r); yy++)
      for (let xx = Math.floor(x - r); xx <= Math.ceil(x + r); xx++)
        if (xx >= 0 && yy >= 0 && xx < SW && yy < SH && (xx + .5 - x) ** 2 + (yy + .5 - y) ** 2 <= r * r) px[yy * SW + xx] = col;
  }
  function line(col, pts, w, wk) { // polyline in reference coords
    for (let i = 0; i + 3 < pts.length; i += 2) {
      let ax = gx(pts[i]), ay = gy(pts[i + 1] + (wk ? wdy(pts[i], wk) : 0));
      let bx = gx(pts[i + 2]), by = gy(pts[i + 3] + (wk ? wdy(pts[i + 2], wk) : 0));
      const n = Math.ceil(Math.hypot(bx - ax, by - ay) * 3) + 1;
      for (let s = 0; s <= n; s++) dot(col, ax + (bx - ax) * s / n, ay + (by - ay) * s / n, w / 2 + .12);
    }
  }
  const disc = (col, xr, yr, r) => dot(col, gx(xr), gy(yr), r);

  return { gx, gy, poly, dot, line, disc };
}

// Returns RGBA pixel data for one animation frame. flap: -1 (wings down) .. 1 (wings up)
function buildSprite(flap) {
  const px = new Array(SW * SH).fill(null);
  const { poly, line } = spriteOps(px, flap);
  // ---- far wing (flaps) ----
  poly(SC.bl, [100,485, 200,466, 330,474, 480,503, 600,540, 655,590, 560,602, 450,562, 330,522, 210,492], 1);
  poly(SC.be, [100,485, 210,492, 330,522, 450,562, 560,602, 540,640, 500,668, 468,674, 430,626, 350,572, 250,526, 170,502], 1);
  poly(SC.bed, [330,522, 450,562, 560,602, 540,640, 500,668, 468,674, 480,640, 470,610, 400,570], 1);
  line(SC.bll, [210,472, 330,480, 470,510], 1, 1);

  // ---- near wing arm ----
  poly(SC.bl, [455,692, 520,652, 600,610, 648,640, 600,702, 520,724, 470,710], 0.45);
  poly(SC.bld, [500,702, 590,694, 645,702, 600,737, 530,737], 0.45);

  if (!STATIC_PX) { STATIC_PX = new Array(SW * SH).fill(null); paintStatic(STATIC_PX); }
  for (let i = 0; i < px.length; i++) { const c = STATIC_PX[i]; if (c) px[i] = c; }

  // ---- post: texture, edge light, outline ----
  const mask = px.map(c => c !== null);
  const out = px.slice();
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
    const i = y * SW + x; let c = px[i]; if (!c) continue;
    if (c === SC.hr && ((x * 3 + y * 5) % 4 === 0)) c = SC.hrl;
    const up = y > 0 && mask[i - SW], dn = y < SH - 1 && mask[i + SW];
    if (!up) c = adj(c, .14); else if (!dn) c = adj(c, -.16);
    out[i] = c;
  }

    const y = c.y + alt * H * (.8 + l * .35); if (y > H + 6) continue;
    Rb(x, y + 3, c.w, 3, shade); Rb(x + 2, y + 1, c.w * .72, 3, top); Rb(x + c.w * .3, y - 1, c.w * .3, 3, top);
  }
}
function drawBackground(T, dt) {
  const b = bctx;
  // sky
  const bands = 18;
  for (let i = 0; i < bands; i++) {
    let y = Math.floor(i * H / bands) - 1, h = Math.ceil(H / bands) + 2;
    if (i === 0) { h += y + M; y = -M; }
    if (i === bands - 1) h += M;
    Rb(-M, y, W + 2 * M, h, skyCol((i + .5) / bands, altS));
  }
  // stars
  b.globalAlpha = clamp(altS * 1.5 + .22, 0, 1);
  for (const s of stars) { if (Math.sin(T * 2 + s.p) > .8) continue; Rb(s.x, s.y, s.s, s.s, '#e8ecff'); }
  b.globalAlpha = 1;
  // sun
  const scx = Math.round(W * .72), scy = Math.round(H * .6 + altS * H * 1.0), sr = 15;
  if (scy - sr < H) for (let dy = -sr; dy <= sr; dy++) {
    if (dy > 2 && (dy % 4 === 0 || (dy > 8 && dy % 3 === 0))) continue;
    const hw = Math.floor(Math.sqrt(sr * sr - dy * dy)); Rb(scx - hw, scy + dy, hw * 2, 1, SUN_COL[dy + sr]);
  }
  const cTop = mixS('#ffd9c4', '#6a6fc0', altS), cShade = mixS('#c4688f', '#2c2f78', altS);
  cloudLayer(0, cTop, cShade);
  drawMount(.2, H * .74, 11, mixS('#5b2f7a', '#10143c', altS), 1.3, true, T);
  cloudLayer(1, cTop, cShade);
  drawMount(.5, H * .84, 8, mixS('#2e1a52', '#0a0d2e', altS), 4.1, false, T);
  drawMount(1, H * .94, 5, mixS('#1a0f33', '#070920', altS), 7.7, false, T);
  cloudLayer(2, cTop, cShade);
  // speed streaks
  if (phase === 'fly' && m > 1.3) {
    b.globalAlpha = clamp((m - 1.3) / 3, 0, .35);
    for (const s of streaks) { s.x -= ws * dt * 3.2; if (s.x + s.len < 0) { s.x = W + Math.random() * 40; s.y = Math.random() * H; } Rb(s.x, s.y, s.len, 1, '#ffffff'); }
    b.globalAlpha = 1;
  }
}

function render(T, dt) {
  // simulation state
  const altT = phase === 'fly' ? clamp(Math.log(m) / Math.log(40), 0, 1) : 0;
  altS += (altT - altS) * Math.min(1, dt * (phase === 'fly' ? 2.6 : 1.1));
  const wsT = phase === 'fly' ? 12 + 20 * Math.log(m) : phase === 'crash' ? 3 : 7;
  ws += (wsT - ws) * Math.min(1, dt * 2.5); worldX += ws * dt;

  // shake
  let sh = 0; if (phase === 'fly') sh = clamp(Math.log(m) * .4, 0, 2); else if (phase === 'crash') sh = 5 * Math.exp(-(T - crashT) * 5);
  const sx = sh > .3 ? Math.round((Math.random() - .5) * 2 * sh) : 0, sy = sh > .3 ? Math.round((Math.random() - .5) * 2 * sh) : 0;

  // background is painted on a small offscreen canvas, then scaled up with a single drawImage
  if (!bgc) { bgc = document.createElement('canvas'); bctx = bgc.getContext('2d', { alpha: false }); bFill = ''; }
  if (bgc.width !== W + 2 * M || bgc.height !== H + 2 * M) { bgc.width = W + 2 * M; bgc.height = H + 2 * M; bFill = ''; }
  drawBackground(T, dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.drawImage(bgc, (sx - M) * U, (sy - M) * U, (W + 2 * M) * U, (H + 2 * M) * U);
  ctx.setTransform(1, 0, 0, 1, sx * U, sy * U);

  // sprite
  const sp = sprPos(T);
  const showFly = phase !== 'crash';
  if (showFly) {
    wakeAcc += dt; while (wakeAcc > .035) {
      wakeAcc -= .035;
      wake.push({ x: sp.x - 34 + Math.random() * 6, y: sp.y + Math.random() * 12 - 4, vx: -ws * .9 - Math.random() * 6, vy: Math.random() * 6 - 3, g: 0, life: .9 + Math.random() * .4, max: 1.3, s: 2 + Math.random() * 2, c: Math.random() < .5 ? '#fff1e3' : '#ffd0c0' });
    }
  }
  // particles
  const drawP = arr => {
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i]; p.life -= dt; if (p.life <= 0) { arr.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const a = p.life / p.max, s = Math.max(1, Math.round(p.s * Math.pow(a, .6)));
      R(p.x - s / 2, p.y - s / 2, s, s, p.c);
    }
  };
  drawP(wake);
  if (showFly) {
    const fi = Math.floor(T * (8 + (phase === 'fly' ? Math.log(m) * 2 : 0))) % NF;
    const fr = frames[fi] || frames[0]; if (fr) drawSpr(fr, sp.x, sp.y, sp.tilt);
  } else if (tum) {
    const since = T - crashT;
    if (since < .12) { if (whites[0]) drawSpr(whites[0], crashPos.x, crashPos.y, tum.rot); }
    else {
      tum.vy += 190 * dt; tum.x += tum.vx * dt; tum.y += tum.vy * dt; tum.rot += tum.vr * dt;
      smokeAcc += dt; while (smokeAcc > .03) { smokeAcc -= .03; wake.push({ x: tum.x - 10 + Math.random() * 10, y: tum.y + Math.random() * 10, vx: -8 + Math.random() * 6, vy: -10 - Math.random() * 10, g: 0, life: .8, max: .8, s: 4, c: Math.random() < .5 ? '#3a2a4a' : '#6a5a7a' }); }
      const tf = frames[Math.floor(T * 14) % NF] || frames[0]; if (tf && tum.y < H + 70) drawSpr(tf, tum.x, tum.y, tum.rot);
    }
  }
  drawP(boom);
  // shockwave
  const cs = T - crashT;
  if (cs >= 0 && cs < .55) {
    const r = cs * 130; ctx.globalAlpha = 1 - cs / .55;
    const n = Math.floor(r * 1.7) + 10;
    for (let i = 0; i < n; i++) { const a = i / n * TAU; R(crashPos.x + Math.cos(a) * r, crashPos.y + Math.sin(a) * r, 3, 3, '#ffe9a8'); }
    ctx.globalAlpha = 1;
  }
  // flash
  if (cs >= 0 && cs < .25) { ctx.globalAlpha = (1 - cs / .25) * .75; R(-6, -6, W + 12, H + 12, '#ffffff'); ctx.globalAlpha = 1; }
}

// ---------- lifecycle (the Home tab re-renders #main, so the DOM comes and goes; the game state stays) ----------
function frame() {
  if (!root) return;
  const T = nowS();
  tick(T);
  if (bankGet() !== lastCoins) { lastCoins = bankGet(); uiDirty = true; }
  if (listDirty) { renderList(); listDirty = false; }
  if (uiDirty) { refreshStats(); uiDirty = false; }
  refreshAct(); refreshHud(T);
  const since = T - lastT;
  if (U && H && since >= .010) { lastT = T; render(T, since > .05 ? .05 : since); }   /* >=10ms: 60Hz untouched, 120Hz renders every other frame */
  raf = requestAnimationFrame(frame);
}
function startBg() {            // keep a flight running (auto cash-out / crash) while the user is on another tab
  if (bgTimer) return;
  bgTimer = setInterval(() => { tick(nowS()); if (phase !== 'fly') stopBg(); }, 250);
}
function stopBg() { clearInterval(bgTimer); bgTimer = null; }
function release() {
  cancelAnimationFrame(raf); raf = 0;
  if (ro) { ro.disconnect(); ro = null; }
  clearTimeout(resT);
  root = null; wrap = stage = cv = ctx = null;
  betEl = autoEl = actEl = resEl = multEl = subEl = null;
}
function mount(el) {
  if (!el) return;
  const wasMounted = !!root;
  if (wasMounted) release();       // same session, DOM was just re-rendered: keep playing
  root = el;
  ensureSprites();
  stopBg();

  wrap = $('wrap'); stage = $('stage'); cv = $('cv'); ctx = cv.getContext('2d', { alpha: false });
  betEl = $('bet'); autoEl = $('auto'); actEl = $('act'); resEl = $('res'); multEl = $('mult'); subEl = $('sub');
  betEl.value = betAmount; if (autoAt > 0) autoEl.value = autoAt;
  betEl.addEventListener('input', () => {
    if (Number(betEl.value) > MAX_BET){ betEl.value = MAX_BET; showRes(TR.maxBetMsg, 'info'); }
    betAmount = betEl.value; actKey = '';
  });
  autoEl.addEventListener('input', () => {
    let v = parseFloat(autoEl.value) || 0;
    if (v > MAX_MULT){ v = MAX_MULT; autoEl.value = v; }
    autoAt = v;
  });
  $('half').onclick = () => { betAmount = Math.max(MIN_BET, Math.floor((Number(betEl.value) || 0) / 2)); betEl.value = betAmount; actKey = ''; };
  $('dbl').onclick = () => {
    const want = Math.max(MIN_BET, Math.floor((Number(betEl.value) || 0) * 2));
    const cap = Math.min(maxBet(), MAX_BET);
    betAmount = Math.min(Math.max(MIN_BET, cap), want); betEl.value = betAmount; actKey = '';
    if (cap >= MIN_BET && want > cap) showRes(maxBet() < MAX_BET ? TR.onlyHave(fa(cap)) : TR.maxBetMsg, 'info');
  };
  actEl.onclick = onAct;
  if (!SHOW_SIM_PLAYERS) { const pl = $('rows').parentNode; pl.style.display = 'none'; }

  const flying = phase === 'fly' && myBet && myBet.cashed == null;
  if (!wasMounted && !flying) startBet(nowS());     // fresh round when coming back to Home
  actKey = ''; hudKey = ''; hudCol = ''; hudSub = ''; lastRowsHtml = ''; lastT = nowS(); lastCoins = -1;
  listDirty = uiDirty = true;
  $('round').textContent = TR.round(fa(roundNo));
  renderHist();
  layout();
  ro = new ResizeObserver(layout); ro.observe(wrap);
  raf = requestAnimationFrame(frame);
}
function unmount() {              // user left the Home tab
  if (!root) return;
  release();
  queued = false;
  if (phase === 'bet' && myBet) { refundCoins(myBet.amt); myBet = null; }     // nothing has flown yet: give the bet back
  if (phase === 'fly' && myBet && myBet.cashed == null) startBg();            // a live flight keeps running in the background
}

return { mount, unmount };
})();


/* ---------- AdsGram ad-task behavior ---------- */
function attachAdTaskListeners(){
  document.querySelectorAll('adsgram-task.ad-task').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    const reward = parseInt(el.dataset.reward || '1', 10);

    el.addEventListener('reward', ()=>{
      creditCoins(reward);
      state.adsWatchedToday += 1;
      advanceSeq();
      renderChips();
      renderAdsBanner();
      playClaimSound();
      showToast(tt('toast_earned', {n: reward}));
      bumpAdsWatchedBackend();
      startAdCooldown();
    });
    el.addEventListener('onBannerNotFound', ()=>{
      showToast(tt('toast_no_ad'));
      rotateActiveAdBlock();
    });
    el.addEventListener('onError', ()=>{
      showToast(tt('toast_ad_error'));
      rotateActiveAdBlock();
    });
    el.addEventListener('onTooLongSession', ()=>{
      showToast(tt('toast_session'));
      rotateActiveAdBlock();
    });
  });
}

/* ---------- daily link task behavior ---------- */
function openExtraTask(id){
  const t = EXTRA_TASKS.find(x => x.id === id);
  if(!t || state.tasksDoneToday[t.id]) return;
  playClickSound();
  if(t.url.indexOf('https://t.me/') === 0){
    if(TG && TG.openTelegramLink) TG.openTelegramLink(t.url); else window.open(t.url, '_blank');
  } else {
    if(TG && TG.openLink) TG.openLink(t.url); else window.open(t.url, '_blank');
  }
  openedTasks[t.id] = true;
  if(state.tab === 'task') renderMain();
}

function claimExtraTask(id){
  const t = EXTRA_TASKS.find(x => x.id === id);
  if(!t || state.tasksDoneToday[t.id]) return;
  state.tasksDoneToday[t.id] = true;
  creditCoins(t.reward);
  advanceSeq();
  renderChips();
  playClaimSound();
  showToast(tt('toast_earned', {n: t.reward}));
  if(state.tab === 'task') renderMain();
}


/* ================= Wallet: coins <-> diamonds ================= */
/* Diamonds are stored as whole hundredths (state.dia = 1 means 0.01) so there are no float errors.
   Buying: every 100 coins -> 0.01 diamond, no fee.  Selling: 0.01 diamond -> 90 coins (10% network fee). */
const WL_BUY_COINS_PER_UNIT = 100;
const WL_SELL_COINS_PER_UNIT = 90;
let walletDir = 'buy';   /* 'buy' = coins -> diamonds, 'sell' = diamonds -> coins */
let walletAmt = '';

function fmtDia(units){ return (units / 100).toFixed(2); }
function fmtNum(n){ return Number(n).toLocaleString('en-US'); }

/* turn what the user typed into whole units (buy: units of 100 coins, sell: hundredths of a diamond) */
function walletUnits(){
  const v = parseFloat(String(walletAmt).replace(',', '.'));
  if(!isFinite(v) || v <= 0) return 0;
  return walletDir === 'buy' ? Math.floor(v / WL_BUY_COINS_PER_UNIT + 1e-9) : Math.floor(v * 100 + 1e-6);
}

function walletHTML(){
  return `
    <div class="screen-title">${tt('wl_title')}</div>
    <div class="screen-sub">${tt('wl_sub')}</div>

    <div class="wl-bal">
      <div class="wl-tile"><small>${tt('wl_coins')}</small><b id="wlBalCoins">${coinIcon(20)}<span>${fmtNum(state.coins)}</span></b></div>
      <div class="wl-tile dia"><small>${tt('wl_dia')}</small><b id="wlBalDia">${diaIcon(20)}<span>${fmtDia(state.dia || 0)}</span></b></div>
    </div>

    <div class="wl-card">
      <div class="wl-card-title">${tt('wl_swap_title')}</div>

      <div class="wl-row" id="wlPayRow">
        <small>${tt('wl_pay')}</small>
        <div class="wl-line">
          <input id="wlAmt" class="wl-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${walletAmt}"
                 oninput="walletInput(this.value)" onfocus="document.getElementById('wlPayRow').classList.add('focus')" onblur="document.getElementById('wlPayRow').classList.remove('focus')">
          <div class="wl-pill" id="wlPayPill"></div>
        </div>
        <div class="wl-quick" id="wlQuick"></div>
      </div>

      <button class="wl-flip tap" id="wlFlip" onclick="walletFlip()" aria-label="Switch direction">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v15M4.5 15.5 8 19l3.5-3.5M16 20V5M12.5 8.5 16 5l3.5 3.5"/></svg>
      </button>

      <div class="wl-row">
        <small>${tt('wl_get')}</small>
        <div class="wl-line">
          <div id="wlOut" class="wl-out empty">0</div>
          <div class="wl-pill" id="wlGetPill"></div>
        </div>
      </div>

      <div class="wl-info">
        <div><span>${tt('wl_rate')}</span><b id="wlRate"></b></div>
        <div><span>${tt('wl_fee')}</span><b id="wlFee"></b></div>
      </div>

      <button class="shop-btn wl-go tap" id="wlGo" onclick="walletExchange()">${tt('wl_go')}</button>
    </div>

    <div class="wl-card">
      <div class="wl-card-title">${tt('wl_promo_title')}</div>
      <div class="wl-card-sub">${tt('wl_promo_sub')}</div>
      <div class="wl-promo">
        <input id="wlCode" class="wl-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${tt('wl_promo_ph')}">
        <button class="wl-claim tap" onclick="walletClaimCode()">${tt('wl_claim')}</button>
      </div>
    </div>
  `;
}

/* refresh the parts of the swap card that depend on direction / amount (the input itself is never re-rendered, so the keyboard stays open) */
function walletRefresh(){
  const buy = walletDir === 'buy';
  const coinPill = `${coinIcon(18)}<span>${tt('wl_coins')}</span>`;
  const diaPill = `${diaIcon(18)}<span>${tt('wl_dia')}</span>`;
  const set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set('wlPayPill', buy ? coinPill : diaPill);
  set('wlGetPill', buy ? diaPill : coinPill);
  const ic = (f) => `<span style="display:inline-flex;vertical-align:-2px;margin:0 2px">${f}</span>`;
  set('wlRate', buy ? `100 ${ic(coinIcon(13))} = 0.01 ${ic(diaIcon(13))}` : `0.01 ${ic(diaIcon(13))} = 90 ${ic(coinIcon(13))}`);
  const units = walletUnits();
  const feeCoins = units * (WL_BUY_COINS_PER_UNIT - WL_SELL_COINS_PER_UNIT);
  set('wlFee', buy ? tt('wl_fee_buy') : tt('wl_fee_sell', {n: fmtNum(feeCoins)}));
  const out = document.getElementById('wlOut');
  if(out){
    const getTxt = units < 1 ? '0' : (buy ? fmtDia(units) : fmtNum(units * WL_SELL_COINS_PER_UNIT));
    out.textContent = getTxt;
    out.classList.toggle('empty', units < 1);
  }
  const quick = document.getElementById('wlQuick');
  if(quick){
    const maxVal = buy ? Math.floor(state.coins / WL_BUY_COINS_PER_UNIT) * WL_BUY_COINS_PER_UNIT : (state.dia || 0) / 100;
    const opts = buy ? [100, 500, 1000] : [0.01, 0.1, 0.5];
    quick.innerHTML = opts.map(v => `<button onclick="walletQuick(${v})">${buy ? fmtNum(v) : v.toFixed(2)}</button>`).join('')
      + `<button onclick="walletQuick(${maxVal})">${tt('wl_max')}</button>`;
  }
  const inp = document.getElementById('wlAmt');
  if(inp) inp.inputMode = buy ? 'numeric' : 'decimal';
}
function walletInput(v){
  /* keep digits and one decimal separator only */
  let c = String(v).replace(',', '.').replace(/[^0-9.]/g, '');
  const i = c.indexOf('.');
  if(i !== -1) c = c.slice(0, i + 1) + c.slice(i + 1).replace(/\./g, '');
  if(walletDir === 'buy') c = c.split('.')[0];
  else if(i !== -1) c = c.slice(0, c.indexOf('.') + 3);
  walletAmt = c;
  const inp = document.getElementById('wlAmt');
  if(inp && inp.value !== c) inp.value = c;
  walletRefresh();
}
function walletQuick(v){
  playClickSound();
  walletAmt = v > 0 ? String(walletDir === 'buy' ? v : v.toFixed(2)) : '';
  const inp = document.getElementById('wlAmt'); if(inp) inp.value = walletAmt;
  walletRefresh();
}
function walletFlip(){
  playClickSound();
  walletDir = walletDir === 'buy' ? 'sell' : 'buy';
  walletAmt = '';
  const inp = document.getElementById('wlAmt'); if(inp) inp.value = '';
  const f = document.getElementById('wlFlip'); if(f) f.classList.toggle('turn');
  walletRefresh();
}
function walletExchange(){
  const units = walletUnits();
  if(!walletAmt || units < 1){
    showToast(walletAmt ? tt(walletDir === 'buy' ? 'wl_min_buy' : 'wl_min_sell') : tt('wl_enter'));
    return;
  }
  if(walletDir === 'buy'){
    const cost = units * WL_BUY_COINS_PER_UNIT;
    if(cost > Math.floor(state.coins + 1e-9)){ showToast(tt('wl_no_coins')); return; }
    state.coins -= cost;
    state.dia = (state.dia || 0) + units;
    showToast(tt('wl_done_buy', {n: fmtDia(units)}));
  } else {
    if(units > (state.dia || 0)){ showToast(tt('wl_no_dia')); return; }
    const got = units * WL_SELL_COINS_PER_UNIT;
    state.dia -= units;
    state.coins += got;
    showToast(tt('wl_done_sell', {n: fmtNum(got)}));
  }
  playClickSound();
  pushCoinsToBackend();   /* saves coins and diamonds to the backend */
  renderChips();          /* also saves the local state */
  playClaimSound();
  walletAmt = '';
  if(state.tab === 'wallet') renderMain();
}
function walletClaimCode(){
  const el = document.getElementById('wlCode');
  const code = el ? el.value.trim() : '';
  playClickSound();
  showToast(code ? tt('wl_promo_soon') : tt('wl_promo_empty'));
}

/* ---------- init ---------- */
/* what happens right after the app opens (once the language is known) */
/* short interstitial (AdsGram int-23717) shown once every time the app opens; whatever happens (ad shown / no fill / error) the normal flow continues */
function showEntryInterstitial(){
  return new Promise(resolve=>{
    try{
      const c = getInterstitialAdController();
      if(!c){ resolve(); return; }
      c.show().then(()=>resolve()).catch(()=>resolve());
    }catch(e){ resolve(); }
  });
}
async function startEntryFlow(){
  await showEntryInterstitial();
  if(!state.giftClaimed) showGiftOverlay();
  else if(shouldShowDailyReward()) showDailyRewardOverlay();
}
updateLangButton();
applyStaticI18n();
renderChips();
renderAdsBanner();
renderNav();
renderMain();
initAdPreload();
if(LANG_WAS_SAVED) startEntryFlow();
else openLangPicker(true);   /* very first launch: ask for the language before anything else */
loadCrashNamePool();   /* one-time fetch of ~50 player names for Crash */
