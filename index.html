<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreePay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#11152B; --bgSoft:#161B36; --card:#1B2044; --card2:#20264C;
    --border:rgba(255,255,255,0.07); --text:#F3EFE3; --textMuted:#9098C2; --textDim:#6A7099;
    --gold:#F5B942; --goldDark:#B9822A; --pink:#FF5C8A; --pinkDark:#C23A63;
    --gray:#3A4066; --grayLight:#9AA1C9; --blue:#34B3F1; --blueLight:#7FD4FA; --star:#FFD24C;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family:'Manrope', sans-serif; color:var(--text);
    display:flex; justify-content:center; min-height:100vh;
  }
  button{ font-family:inherit; }
  .tap:active{ transform:scale(0.96); }

  @keyframes popIn{ from{opacity:0; transform:translateY(10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes floatToast{ from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);} }

  #app{
    width:100%; max-width:430px; height:100vh; max-height:900px;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.4);
  }

  /* header */
  header{ padding:16px 16px 10px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-size:20px; font-weight:800; }
  .logo .pay{ color:var(--gold); }
  .chips{ display:flex; gap:6px; }
  .chip{
    display:flex; align-items:center; gap:5px; background:var(--card);
    border:1px solid var(--border); border-radius:999px; padding:5px 10px 5px 9px;
    font-size:13px; font-weight:600;
  }
  .chip span{ font-variant-numeric:tabular-nums; }

  /* body / screens */
  main{ flex:1; overflow-y:auto; padding:6px 16px 16px; }
  .screen-title{ font-size:15px; font-weight:700; }
  .screen-sub{ font-size:12px; color:var(--textMuted); margin-top:2px; }

  /* bottom nav */
  nav{
    display:flex; border-top:1px solid var(--border); background:var(--bgSoft);
    padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  }
  .nav-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:6px 0; cursor:pointer;
  }
  .nav-btn span{ font-size:11px; color:var(--textDim); font-weight:500; }
  .nav-btn.active span{ color:var(--gold); font-weight:700; }

  /* toast */
  #toast{
    position:absolute; top:70px; left:50%; animation:floatToast .2s ease-out;
    background:var(--card2); border:1px solid var(--border); padding:8px 16px;
    border-radius:999px; font-size:13px; white-space:nowrap; z-index:30; display:none;
  }

  /* modal */
  #modalOverlay{
    position:absolute; inset:0; background:rgba(9,11,25,0.72);
    display:none; align-items:center; justify-content:center; z-index:40;
  }
  #modalBox{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:28px 26px; width:260px; text-align:center; animation:popIn .25s ease-out;
  }
  #modalIcon{ display:flex; justify-content:center; margin-bottom:14px; }
  #modalTitle{ font-size:17px; font-weight:700; margin-bottom:4px; }
  #modalSub{ font-size:13px; color:var(--textMuted); margin-bottom:18px; }
  #modalBtn{
    width:100%; padding:11px; border-radius:12px; border:none;
    background:var(--gold); color:#241A05; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* home screen */
  .home-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:8px; }
  .home-head{ text-align:center; margin-bottom:4px; }
  #wheelBox{ position:relative; width:min(78vw,280px); aspect-ratio:1/1; margin-top:18px; }
  #pointer{
    position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent;
    border-top:18px solid var(--gold); z-index:5; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  #wheel{
    width:100%; height:100%; border-radius:50%;
    background: conic-gradient(from 0deg,
      var(--gold) 0deg 60deg, var(--pink) 60deg 120deg, var(--gray) 120deg 180deg,
      var(--gold) 180deg 240deg, var(--pink) 240deg 300deg, var(--gray) 300deg 360deg);
    border:5px solid var(--card2);
    box-shadow:0 0 0 2px var(--border), 0 10px 30px rgba(0,0,0,0.4);
    position:relative; transform:rotate(0deg);
  }
  .seg{ position:absolute; inset:0; }
  .seg-icon{ position:absolute; top:13%; left:50%; }
  #hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:26%; height:26%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFE3A0, #F5B942 55%, #C98A2A 100%);
    border:3px solid var(--bgSoft); color:#2A1C05; font-weight:800; font-size:12px;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.35);
  }
  #spinHint{ margin-top:22px; font-size:13px; color:var(--textMuted); }
  .legend{ display:flex; gap:14px; margin-top:18px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--textMuted); }

  /* task screen */
  .task-list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .task-card{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--border); border-radius:14px; padding:12px;
    border-inline-start:3px solid var(--pink);
  }
  .task-card.done{ opacity:.55; border-inline-start-color:var(--gray); }
  .task-info{ flex:1; }
  .task-info .t{ font-size:13.5px; font-weight:600; }
  .task-info .d{ font-size:11.5px; color:var(--textMuted); margin-top:3px; }
  .task-btn{
    display:flex; align-items:center; gap:5px; flex-shrink:0; background:var(--pink);
    color:#3A0E1E; border:none; border-radius:10px; padding:8px 12px; font-size:12px;
    font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .task-btn.done{ background:transparent; color:var(--textDim); border:1px solid var(--border); cursor:default; }

  /* shop screen */
  .shop-list{ display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .shop-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
  .shop-top{ display:flex; align-items:center; gap:10px; }
  .shop-icon{
    width:42px; height:42px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; background:rgba(52,179,241,0.12);
  }
  .shop-icon.star-bg{ background:rgba(255,210,76,0.12); }
  .shop-info{ flex:1; }
  .shop-info .t{ font-size:14px; font-weight:700; }
  .shop-info .d{ font-size:11.5px; color:var(--textMuted); margin-top:2px; }
  .shop-btn{
    width:100%; margin-top:12px; padding:10px; border-radius:10px; border:none;
    font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:6px;
  }
  .shop-btn.disabled{ background:var(--card2)!important; color:var(--textDim)!important; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo"><span>Free</span><span class="pay">Pay</span></div>
    <div class="chips">
      <div class="chip" id="chipCoins"></div>
      <div class="chip" id="chipTickets"></div>
      <div class="chip" id="chipTon"></div>
    </div>
  </header>

  <main id="main"></main>

  <nav>
    <button class="nav-btn" id="navHome" onclick="setTab('home')"></button>
    <button class="nav-btn" id="navTask" onclick="setTab('task')"></button>
    <button class="nav-btn" id="navShop" onclick="setTab('shop')"></button>
  </nav>

  <div id="toast"></div>

  <div id="modalOverlay">
    <div id="modalBox">
      <div id="modalIcon"></div>
      <div id="modalTitle"></div>
      <div id="modalSub"></div>
      <button id="modalBtn" class="tap" onclick="closeModal()">Got it</button>
    </div>
  </div>
</div>

<script>
/* ---------- palette (mirrors CSS vars) ---------- */
const C = {
  gold:'#F5B942', goldDark:'#B9822A', pink:'#FF5C8A', gray:'#3A4066',
  grayLight:'#9AA1C9', blue:'#34B3F1', star:'#FFD24C', card:'#1B2044', bg:'#11152B'
};

/* ---------- icon builders (return SVG markup strings) ---------- */
function coinIcon(size=26, fill=C.gold, ring=C.goldDark){
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="17.5" fill="${fill}" stroke="${ring}" stroke-width="2.5"/>
    <circle cx="20" cy="20" r="11.5" fill="none" stroke="${ring}" stroke-width="1.6" opacity="0.55"/>
    <path d="M14 22c0 2.8 2.6 4.5 6 4.5s6-1.4 6-3.4c0-4.6-11-2-11-6.4 0-2 2.4-3.4 5.6-3.4 2.7 0 4.9 1 5.6 2.7"
      fill="none" stroke="${ring}" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
  </svg>`;
}
function ticketIcon(size=28, fill=C.pink, bg=C.card){
  const w = size, h = size*0.66;
  return `<svg width="${w}" height="${h}" viewBox="0 0 44 28">
    <rect x="1.5" y="1.5" width="41" height="25" rx="6" fill="${fill}" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <circle cx="22" cy="1.5" r="4" fill="${bg}"/>
    <circle cx="22" cy="26.5" r="4" fill="${bg}"/>
    <line x1="22" y1="8" x2="22" y2="20" stroke="${bg}" stroke-width="2" stroke-dasharray="2.5,3" stroke-linecap="round"/>
  </svg>`;
}
function pochIcon(size=24, stroke=C.grayLight){
  return `<svg width="${size}" height="${size}" viewBox="0 0 26 26">
    <circle cx="13" cy="13" r="10.5" fill="none" stroke="${stroke}" stroke-width="2.2" opacity="0.9"/>
    <line x1="6.5" y1="19.5" x2="19.5" y2="6.5" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  </svg>`;
}
function tonIcon(size=22){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
    <path d="M12 2 L22 8.2 L12 22 L2 8.2 Z" fill="${C.blue}"/>
    <path d="M12 2 L22 8.2 L12 13.2 Z" fill="#7FD4FA"/>
  </svg>`;
}
function starIcon(size=16){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
    <path d="M12 1.5 L14.7 9 L23 9 L16.3 14 L18.8 22 L12 17.2 L5.2 22 L7.7 14 L1 9 L9.3 9 Z" fill="${C.star}"/>
  </svg>`;
}
function navIcon(kind, active){
  const c = active ? C.gold : '#6A7099';
  if(kind==='home') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <path d="M4 11.5 L12 4 L20 11.5" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 10.5V20h5v-6h2v6h5V10.5" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
  if(kind==='task') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <rect x="4" y="4" width="16" height="16" rx="3" stroke="${c}" stroke-width="2"/>
    <path d="M8 12.5l2.3 2.3L16 9.5" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
  return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <path d="M5 8h14l-1 12H6L5 8Z" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}
function segIcon(type){
  if(type==='coin') return coinIcon(24, C.goldDark, '#7A5A1C');
  if(type==='ticket') return ticketIcon(26, '#FDF6E8', C.pink);
  return pochIcon(20, '#EDEFFA');
}

/* ---------- wheel config ---------- */
const SEGMENTS = [{type:'coin'},{type:'ticket'},{type:'blank'},{type:'coin'},{type:'ticket'},{type:'blank'}];

/* ---------- state ---------- */
let state = {
  tab: 'home',
  coins: 0,
  tickets: 5,
  ton: 0,
  rotation: 0,
  spinning: false,
  spinCount: 0,
  tasks: [
    {id:1, title:'Join the FreePay Telegram channel', desc:'Join our official channel so you never miss an update', reward:1, done:false},
    {id:2, title:'Follow our Instagram page', desc:'Give our page a follow', reward:1, done:false},
    {id:3, title:'Invite a friend', desc:'Send your invite link to a friend', reward:1, done:false},
    {id:4, title:'Watch a short video', desc:'Watch a 15-second clip', reward:1, done:false},
    {id:5, title:'Take today\\'s poll', desc:'Tell us what you think of the app', reward:1, done:false},
    {id:6, title:'Share the app', desc:'Share the app link with a group', reward:1, done:false},
    {id:7, title:'Turn on notifications', desc:'So you never miss a reward', reward:1, done:false},
    {id:8, title:'Visit our partner site', desc:'Check out today\\'s partner site', reward:1, done:false},
  ]
};

let toastTimer = null;

/* ---------- render helpers ---------- */
function renderChips(){
  document.getElementById('chipCoins').innerHTML = `${coinIcon(16)}<span>${state.coins}</span>`;
  document.getElementById('chipTickets').innerHTML = `${ticketIcon(18, C.pink, '#20264C')}<span>${state.tickets}</span>`;
  document.getElementById('chipTon').innerHTML = `${tonIcon(14)}<span>${state.ton}</span>`;
}

function renderNav(){
  document.getElementById('navHome').className = 'nav-btn' + (state.tab==='home' ? ' active' : '');
  document.getElementById('navHome').innerHTML = navIcon('home', state.tab==='home') + '<span>Home</span>';
  document.getElementById('navTask').className = 'nav-btn' + (state.tab==='task' ? ' active' : '');
  document.getElementById('navTask').innerHTML = navIcon('task', state.tab==='task') + '<span>Tasks</span>';
  document.getElementById('navShop').className = 'nav-btn' + (state.tab==='shop' ? ' active' : '');
  document.getElementById('navShop').innerHTML = navIcon('shop', state.tab==='shop') + '<span>Shop</span>';
}

function setTab(tab){
  state.tab = tab;
  renderNav();
  renderMain();
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'floatToast .2s ease-out';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 1800);
}

function openModal(type, amount){
  const icon = type==='coin' ? coinIcon(54) : type==='ticket' ? ticketIcon(64, C.pink, C.card) : pochIcon(54, C.grayLight);
  document.getElementById('modalIcon').innerHTML = icon;
  document.getElementById('modalTitle').textContent =
    type==='blank' ? 'Blank! Nothing this time' :
    type==='coin' ? `You won ${amount} coins!` : `You won ${amount} tickets!`;
  document.getElementById('modalSub').textContent =
    type==='blank' ? 'Try your luck again next time' : 'Added to your wallet';
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modalOverlay').style.display = 'none';
}

/* ---------- main screen render ---------- */
function renderMain(){
  const main = document.getElementById('main');
  if(state.tab === 'home') main.innerHTML = homeHTML();
  else if(state.tab === 'task') main.innerHTML = taskHTML();
  else main.innerHTML = shopHTML();

  if(state.tab === 'home') initWheel();
}

function homeHTML(){
  let segs = '';
  SEGMENTS.forEach((seg,i)=>{
    const angle = i*60 + 30;
    segs += `<div class="seg" style="transform:rotate(${angle}deg)">
      <div class="seg-icon" style="transform:translateX(-50%) rotate(${-angle}deg)">${segIcon(seg.type)}</div>
    </div>`;
  });
  const hint = state.tickets < 5 ? `${5-state.tickets} more ticket${5-state.tickets===1?'':'s'} needed` : 'Ready to spin';
  return `
    <div class="home-wrap">
      <div class="home-head">
        <div class="screen-title">Lucky Wheel</div>
        <div class="screen-sub">Every 5 tickets get you one spin</div>
      </div>
      <div id="wheelBox">
        <div id="pointer"></div>
        <div id="wheel">
          ${segs}
          <button id="hub" class="tap" onclick="handleSpin()">SPIN</button>
        </div>
      </div>
      <div id="spinHint" style="color:${state.tickets<5 ? C.pink : '#9098C2'}">${hint}</div>
      <div class="legend">
        <div class="legend-item">${coinIcon(18)}<span>Coin</span></div>
        <div class="legend-item">${ticketIcon(20, C.pink, C.bg)}<span>Ticket</span></div>
        <div class="legend-item">${pochIcon(16)}<span>Blank</span></div>
      </div>
    </div>
  `;
}

function taskHTML(){
  let cards = '';
  state.tasks.forEach(t=>{
    cards += `
      <div class="task-card${t.done ? ' done' : ''}">
        <div class="task-info">
          <div class="t">${t.title}</div>
          <div class="d">${t.desc}</div>
        </div>
        <button class="task-btn${t.done ? ' done' : ''}" onclick="doTask(${t.id})" ${t.done ? 'disabled' : ''}>
          ${t.done ? 'Done' : `+${t.reward} ${ticketIcon(16, '#3A0E1E', C.pink)}`}
        </button>
      </div>`;
  });
  return `
    <div class="screen-title">Daily Tasks</div>
    <div class="screen-sub">Complete a task to earn a ticket</div>
    <div class="task-list">${cards}</div>
  `;
}

function shopHTML(){
  const canWithdraw = state.coins >= 500;
  const canBuyTen = state.coins >= 4300;
  return `
    <div class="screen-title">Shop</div>
    <div class="screen-sub">Trade your coins for TON Coin</div>
    <div class="shop-list">
      <div class="shop-card">
        <div class="shop-top">
          <div class="shop-icon">${tonIcon(22)}</div>
          <div class="shop-info">
            <div class="t">Withdraw TON Coin</div>
            <div class="d">Every 500 coins = 1 TON Coin</div>
          </div>
        </div>
        <button class="shop-btn${canWithdraw ? '' : ' disabled'}" style="background:${canWithdraw ? C.blue : ''};color:${canWithdraw ? '#06222E' : ''}" onclick="withdrawOnce()">Withdraw 1 TON Coin</button>
      </div>

      <div class="shop-card">
        <div class="shop-top">
          <div class="shop-icon">${tonIcon(22)}</div>
          <div class="shop-info">
            <div class="t">10 TON Coin Pack</div>
            <div class="d">Get 10 TON Coin at once for 4,300 coins</div>
          </div>
        </div>
        <button class="shop-btn${canBuyTen ? '' : ' disabled'}" style="background:${canBuyTen ? C.blue : ''};color:${canBuyTen ? '#06222E' : ''}" onclick="buyTenPack()">Buy for ${coinIcon(15)} 4,300</button>
      </div>

      <div class="shop-card">
        <div class="shop-top">
          <div class="shop-icon star-bg">${tonIcon(22)}</div>
          <div class="shop-info">
            <div class="t">1 TON Coin with Stars</div>
            <div class="d">Pay with Telegram Stars</div>
          </div>
        </div>
        <button class="shop-btn" style="background:${C.star};color:#3A2C00" onclick="buyWithStars()">Buy for ${starIcon(15)} 100 Stars</button>
      </div>
    </div>
  `;
}

/* ---------- wheel behavior ---------- */
function initWheel(){
  const wheel = document.getElementById('wheel');
  if(wheel) wheel.style.transform = `rotate(${state.rotation}deg)`;
}

function handleSpin(){
  if(state.spinning) return;
  if(state.tickets < 5){
    showToast('You need 5 tickets to spin the wheel');
    return;
  }
  state.tickets -= 5;
  renderChips();
  state.spinCount += 1;
  const n = state.spinCount;

  let idx, type, amount;
  if(n === 1){ idx=0; type='coin'; amount=10; }
  else if(n === 2){ idx=1; type='ticket'; amount=5; }
  else if(n === 3){ idx=3; type='coin'; amount=5; }
  else{
    idx = Math.floor(Math.random()*6);
    type = SEGMENTS[idx].type;
    if(type==='coin') amount = 3 + Math.floor(Math.random()*6);
    else if(type==='ticket') amount = 2 + Math.floor(Math.random()*6);
    else amount = 0;
  }

  const centerAngle = idx*60 + 30;
  const finalMod = (360 - centerAngle) % 360;
  const currentMod = ((state.rotation % 360) + 360) % 360;
  const delta = ((finalMod - currentMod) % 360 + 360) % 360;
  const extraSpins = 6;
  const nextRotation = state.rotation + extraSpins*360 + delta;

  state.spinning = true;
  state.rotation = nextRotation;

  const wheel = document.getElementById('wheel');
  wheel.style.transition = 'transform 4.2s cubic-bezier(.17,.67,.16,1)';
  wheel.style.transform = `rotate(${nextRotation}deg)`;

  const hub = document.getElementById('hub');
  if(hub){ hub.textContent = '...'; hub.disabled = true; }

  setTimeout(()=>{
    state.spinning = false;
    if(type === 'coin') state.coins += amount;
    if(type === 'ticket') state.tickets += amount;
    renderChips();
    if(state.tab === 'home') renderMain();
    openModal(type, amount);
  }, 4300);
}

/* ---------- task behavior ---------- */
function doTask(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t || t.done) return;
  t.done = true;
  state.tickets += t.reward;
  renderChips();
  showToast(`+${t.reward} ticket earned 🎫`);
  if(state.tab === 'task') renderMain();
}

/* ---------- shop behavior ---------- */
function withdrawOnce(){
  if(state.coins < 500){ showToast('You need at least 500 coins'); return; }
  state.coins -= 500;
  state.ton += 1;
  renderChips();
  showToast('1 TON Coin added to your wallet 💠');
  if(state.tab === 'shop') renderMain();
}
function buyTenPack(){
  if(state.coins < 4300){ showToast('Not enough coins'); return; }
  state.coins -= 4300;
  state.ton += 10;
  renderChips();
  showToast('You got 10 TON Coin 💠');
  if(state.tab === 'shop') renderMain();
}
function buyWithStars(){
  state.ton += 1;
  renderChips();
  showToast('Paid with Stars — 1 TON Coin added 💠');
}
